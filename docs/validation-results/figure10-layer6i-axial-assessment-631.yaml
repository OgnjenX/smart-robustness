interpretation: >-
  The sole source-discrete layer-6I axial endpoint passes every fresh Figure-6
  gate and preserves the complete upstream Figure-10 identity. Applying the
  KInNeSS Equation-9 conductance only to layer 6I reduces post-mismatch output
  from the source-control 72 events to 40, rather than recruiting the broad
  inhibitory wave required for reset. The intact and disconnected arms emit
  exactly the same 40 layer-6I events from the same seven cells, followed by
  the same 98 layer-4 events, 80 winner events, and two released alternatives.
  Projection 025 still carries a 4.63-fold intact/control current-integral
  contrast, but common peripheral somata remain near -69 mV. The KInNeSS axial
  transfer is therefore not sufficient and is directionally worse for the
  missing reset. All source-discrete layer-6I intrinsic, target-compartment,
  spread, and axial alternatives are now exhausted; the family is closed and
  no value is selected.
next_gate: >-
  Return to the paper-axial, one-to-one projection-025 source control and add a
  preregistered read-only trace assay for representative winner-aligned and
  peripheral layer-6I cells. Measure the timing of projection-023, -024, and
  -025 currents relative to proximal and somatic voltage maxima and threshold.
  Use that measured transfer gap to define an isolated replay and bounded
  effective calibration family; do not tune a weight, leak, threshold, or
  axial resistance from this result alone.
