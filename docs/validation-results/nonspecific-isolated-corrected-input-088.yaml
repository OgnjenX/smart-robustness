interpretation:
  - The input equation is the special KInNeSS voltage-drive current g*(V_eq-V), not an ordinary ligand gate.
  - The isolated cell's 60-Hz response lies between Figure 7's approximately 40-Hz match and 70-Hz mismatch values.
  - The intact network also produces 60 Hz under the corrected KInNeSS axial profile, but match and mismatch are identical because TRN supplies no post-startup condition-dependent inhibition.
  - The remaining Figure 7 causal failure is localized to relay/layer-6II recruitment of post-startup TRN output, rather than the nonspecific cell or its direct image input alone.
