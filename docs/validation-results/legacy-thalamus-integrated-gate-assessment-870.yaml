interpretation:
  - The all-gates-on-integrated-V convention corrects the unstimulated state by
    more than 21 mV and brings it within 0.12 mV of the archived mean.
  - The candidate's approximately +49 mV tonic peak is pinned near the
    unshifted serialized sodium reversal of +50 mV, whereas the archived
    internal-coordinate trace reaches +109.565 mV.
  - The sole burst-arm event at 1013.2 ms is the two-millisecond-delayed onset
    crossing of internal -20 mV during hyperpolarization. Audit 476 requires a
    falling crossing of physical -20 mV, which is internal +50 mV for the
    archived -70 mV rest coordinate.
  - Equation 3 requires each driving potential and V to share one coordinate.
    Leaving physical XML reversals unshifted while integrating rest-relative V
    is therefore a dimensional coordinate error, not a failed physical
    parameter hypothesis.
