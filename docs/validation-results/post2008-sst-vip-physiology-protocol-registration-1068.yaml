  simulation: >-
    Fresh model per sweep, complete acquired sweep stimulus, dt exactly inverse
    acquisition rate as native simulate_sweep_from_file. Preserve source
    spike_cut_length, coefficients and initial states; no resampling or state
    fitting. Record source dt and run dt, and native/candidate parity on each
    actual stimulus before physiological promotion. Keep simulated arrays in
    separate ignored outputs, never write simulated voltages into source NWB.
  voltage_coordinates: >-
    Compare experimental spikes in absolute Volts. Candidate subthreshold
    voltage plus source El_reference is descriptive only; retain NaN cut masks
    without 50-mV filling or waveform-fit claims.
  analysis_epoch: >-
    Simulate full sweep. Score only Experiment index_start through
    index_start+count exclusive; timestamps are sweep-relative. Do not add a
    response-selected warmup or change boundaries from observed spikes.
