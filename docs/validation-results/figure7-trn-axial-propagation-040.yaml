interpretation:
  - Every TRN soma produces one common initialization action potential and crosses the paper's +30 mV arming threshold.
  - Later proximal dendritic calcium spikes reach at least +71.9 mV, but the soma remains below -30.2 mV after 5 ms and emits no further event.
  - SMART.nml marks the soma, not a dendrite, with monitorSpikes=true; changing event emission to a dendrite is therefore not source-backed.
  - The exact paired post-startup TRN soma ranges show that this late cycle is intrinsic and condition-independent at this stage.
  - Axial-convention selection alone cannot reproduce Figure 7 match-dependent nonspecific inhibition.
