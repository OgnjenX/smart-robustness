schema_version: 1
id: figure7-half-max-comparator-registration-314
date: '2026-09-04'
status: registered-before-execution-calibrated-reconstruction
profile: configs/calibration/figure7_half_max_comparator_match_v1.yaml
rationale:
  - >-
    Smooth learned-support attenuation fails match because weakening expected
    pixels reduces relay/TRN recruitment and disinhibits nonspecific thalamus.
  - >-
    A saturating comparator is qualitatively distinct: sufficiently supported
    pixels retain the original sensory input while unsupported pixels are
    suppressed. Half maximum is a standard parameter-free field boundary, so
    no output-fitted threshold grid or interpolation is introduced.
  - >-
    The gate uses only weights from selected source row 40 of learned adaptive
    projections 005/007. It receives no orientation, condition, overlap, or
    official target labels.
registered_candidate:
  transform: half_max_binary
  support_threshold: 0.5
  candidate_count: 1
  gain_above_or_equal_threshold: 1.0
  gain_below_threshold: 0.0
scope_boundary:
  classification: calibrated-reconstruction-not-recovered-source
  affects: active bottom-up relay pixels during Figure 7 recognition only
  leaves_unchanged:
    - Figure 6 training inputs and dynamics
    - nonspecific and matrix external inputs
    - learned weights
    - neuron and synapse equations
    - delays, receptor kinetics, and ring geometry
fixed:
  figure6_handoff: docs/validation-results/figure6-projection022-distal003-217.yaml
  learned_headroom_fraction: 1.0
  source_index: 40
  cue_current_pA: 800.0
  current_mode: until_cued_cell_first_event
  receptor_peak_cue_lead_ms: 11.35773631178703
  detector: {arm_mV: -20.0, release_mV: -30.0}
  trn_to_relay_gaba_scales:
    modeldb112923.projection.000: 0.01
    modeldb112923.projection.001: 0.01
    modeldb112923.projection.004: 0.03
  duration_ms: 100.0
  dt_ms: 0.01
stopping_rule: >-
  Run the sole half-max match once. Do not inspect learned support values to
  move the threshold, and do not inspect mismatch unless an independently
  rebuilt match later reproduces every exact gate.
locked_holdouts:
