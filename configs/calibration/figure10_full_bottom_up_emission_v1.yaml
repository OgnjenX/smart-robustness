selection_rule: >-
  Use only for the preregistered Figure-10 source-coherence pair. It is not a
  Figure-7 candidate and cannot revise the locked Figure-7 assessment.
classification_boundary: >-
  The all-one sensory vector removes the reconstructed top-five multiplier but
