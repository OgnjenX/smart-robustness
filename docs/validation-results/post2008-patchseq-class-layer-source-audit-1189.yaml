schema_version: 1
artifact_id: 1189
artifact_type: primary-cell-class-and-measured-laminar-annotation-definition-audit
date: 2026-10-14
primary_paper:
  doi: 10.1016/j.cell.2020.09.057
  full_text_endpoint: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC7781065/unicode
  access: retrieved-through-NCBI-BioC-after-browser-page-challenges
  methods_findings:
    - Transcriptomes are mapped hierarchically to classes, subclasses and types using a VISp reference taxonomy and bootstrapping.
    - Mapping quality is separately categorized as highly consistent, moderately consistent or inconsistent; a type label alone does not encode that quality.
    - Laminar and regional positions are measured from DAPI tissue images and manual CCF placement; normalized soma depth and type-associated layer preference are distinct from an individual measured-layer assignment.
    - Recorded voltages are reported without correction for the measured minus-14-mV liquid junction potential.
  implication: >-
    Source-defined confidence and measured anatomy must be kept distinct from
    targeting genotype, raw taxonomy alias, depth and typical type location.
official_analysis_source:
  repository: AllenInstitute/coupledAE-patchseq
  revision: 6c0be92e7a919321a4b877623354ee48d5f75921
  notebook: notebooks/data_proc_T.ipynb
  notebook_git_blob_sha1: 27fafad376c4392ed0f128f0529f6f0c364beae2
  code_only_inspection: true
