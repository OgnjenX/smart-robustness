interpretation: >-
  The passive harness exactly reproduces the rejected event-locked endpoint,
  so its traces are comparable. The intended transmitter-dependent direct
  reset bias is not missing: from 61--69 ms, intact projection 038 delivers
  1599.32 pA ms to inactive alternative 31 but only 41.80 pA ms to prior
  winner 40, a 38.26-fold contrast. However, projection-036 inhibition is
  already stronger in the intact arm in the release bin, and the first newly
  observed intact projection-036 arrival leads control by 5.55 ms. At the
  alternative, 1705.62 pA ms of additional recorded excitation through 69 ms
  is outweighed by 2437.21 pA ms of additional inhibitory current, leaving a
  -731.59 pA ms net difference. The alternative is therefore already 0.97 mV
  further from threshold in the marker-containing bin, its recurrent input
  starts 14.44 ms later, and the global first-alternative event remains 12.47
  ms later. This localizes the wrong sign to the balance/timing of the indirect
  layer6I-to-layer4I-to-layer4E off-surround route, not failure of the direct
  transmitter-dependent projection-038 spatial bias.
