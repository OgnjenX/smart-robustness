mechanistic_interpretation:
  - The image route is active, but no interneuron emitted event reaches its relay output projection.
  - Zero relay interneuron current is explained by absent interneuron events, not a demonstrated outgoing-transmission defect.
  - The 7.85-ms cue lead lets all 81 TRN cells emit at 5.68 ms, before image onset, and the active interneurons receive substantial TRN inhibition during stimulation.
