coverage_contract: >-
  Require exactly one shared synapse latency row, finite nonnegative latency,
  exactly one rested record with finite correctly signed ic_amp, positive
  ic_rise_time and ic_decay_tau, and finite nonnegative ic_nrmse, and exactly
  one finite measured baseline in [-0.1,0] volts. Keep all original rows and
  failures. Original missing ic_latency remains null and its old gate remains
  failed. Attach the shared-latency source and a plus/minus 100 microsecond
  source-fit search interval, not a confidence interval or recovered datum.
partition_and_strata: >-
  Preserve original global experiment assignments and project, route and
  measured pre/post layer strata. Rested responses pool holding conditions;
  old nominal holding labels are lineage only, not new rested-state bins.
  Count distinct pairs and experiments, not duplicated original fit records.
minimum_units: {fitting_experiments: 5, validation_experiments: 3}
claim_boundary: >-
  A coverage pass establishes availability of a composite, uncertainty-labelled
  source target only. It does not resolve historical source code, baseline
  dispersion, the true rested xoffset, waveform fitting-function semantics,
  cell-specific synapses, biological fidelity or network promotion. All earlier
  contracts remain intact; neither missing baselines nor sparse strata are
  rescued by pooling or nominal holding substitution.
