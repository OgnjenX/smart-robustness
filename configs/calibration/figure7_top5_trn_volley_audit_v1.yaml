  match: {relay_events: 15, trn_events: 635, nonspecific_events: 4}
  mismatch: {relay_events: 3, trn_events: 560, nonspecific_events: 5}
classification_rule: >-
  If mismatch contains seven TRN volleys but fewer than seven corresponding
  nonspecific responses, classify the deficit as downstream transfer loss. If
  mismatch contains fewer than seven volleys, classify it as an upstream TRN
  timing deficit. Do not modify model or protocol parameters.
next_gate: >-
  Test only a previously documented, population-uniform KInNeSS spike-handler
  interpretation against match before consulting mismatch. Figure 10 and all
  spectral holdouts remain locked.
