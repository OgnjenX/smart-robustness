interpretation:
  - Prior extraction and independent partitions remain valid records; their availability gates are not reclassified as biological promotion.
  - Fitting a rested single-event synapse directly to average-train amplitude would confound synaptic dynamics with peak conductance.
  - A nominal holding label cannot be treated as the measured resting baseline.
  - Rested-fit amplitude and actual baseline coverage must be audited under a separate registration, retaining missing data and original experiment partitions.
  - Full response reconstruction would also require source fitting-function semantics; no exponent is silently assumed.
