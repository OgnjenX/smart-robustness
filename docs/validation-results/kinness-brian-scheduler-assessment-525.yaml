conclusion: >-
  The registered Brian2 translation already enforces a synchronous visibility
  boundary: a source event with the archived 0.1-ms delay updates the summed
  ligand gate at 0.11 ms, not at 0.10 ms. Adding another global time-step
  offset would double-count that boundary and has no surviving source basis.
  Moreover, three of the 24 nonspecific events occur before any TRN, relay, or
  category event, so they cannot be caused by recurrent event scheduling.
  Scheduling is therefore closed as the next correction; the remaining failure
  must be localized in stimulus/startup and later inhibition-calcium dynamics.
next_step: >-
  Register one causal, non-promotable match assay on the unchanged paper-source
  bundle: import the intact result as control, remove all three archived
  TRN-to-nonspecific GABA projections in one arm, and remove both
  layer-6II-to-nonspecific excitation projections in another. Use event counts
  only to localize whether the 21 late events require inhibitory rebound or
  corticointralaminar drive; do not select a gain, detector, or parameter.
