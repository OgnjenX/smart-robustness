interpretation:
  - A delayed synaptic event must carry the transmitter resource available when its source spike was emitted; resampling a recovering resource at arrival conflates axonal delay with recovery.
  - Correcting this implementation detail advances the category spike from 83.66 to 82.57 ms but does not create a relay event after its 84.57-ms teaching arrival.
  - The correction is retained on source/causal grounds despite making the failed top-down contrast more negative.
  - Figure 6c remains blocked upstream by the absent layer-2/3 and layer-5 cortical chain and the lack of a causal corticothalamic STDP pair.
