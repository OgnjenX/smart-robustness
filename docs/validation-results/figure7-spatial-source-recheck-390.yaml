interpretation: >-
  The qualitative selection requirement is real, so rate agreement alone is
  insufficient. The current all-events overlap-only scorer is a strict project
  operationalization, not a recovered numerical relay raster. Do not relax it
  after observing failures or classify these sparse events as physiological
  bursts without voltage/calcium evidence. Artifact244 remains unpromoted.
