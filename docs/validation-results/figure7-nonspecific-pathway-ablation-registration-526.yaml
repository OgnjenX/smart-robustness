classification_rule: >-
  Compare each ablation with the hash-pinned intact control. Loss of late events
  after removing all TRN GABA localizes those events to inhibition-dependent
  rebound or another GABA-mediated mechanism. Loss after removing both layer-6II
  projections localizes them to corticointralaminar excitation. Persistence in
  both arms requires a direct-input/intrinsic explanation. The three events
  before the first upstream event are scored and reported unchanged; they are
  never discarded as burn-in.
stopping_rule: >-
  Run one fresh Figure 6 prerequisite and exactly the two registered match
  ablations. Do not run mismatch, tune a gain, alter a detector, or promote an
  ablated network regardless of event counts.
interpretation_boundary: >-
  Projection removal is a causal diagnostic, not a reconstruction of the 2008
  model and not a baseline candidate. It can localize the current discrepancy
  but cannot establish that the removed pathway was absent from original SMART.
