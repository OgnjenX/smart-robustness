  event_rule: >-
    The author-produced 2004 KInNeSS thalamic benchmark aligns every serialized
    axonal event with a preceding falling crossing of physical -20 mV plus the
    declared 2-ms axonal delay, to within one 0.05-ms output sample.
  projection_strengths: >-
    No effective transfer factors are applied. All projections retain their
    source-selected serialized strengths so this run cannot inherit the
    Figure 7 behavior-calibrated 0.01/0.03/0.8 factors.
  boundary: >-
    The recovered 2004 detector is independent source evidence, but it does
    not establish that the unavailable 2008 RC2 executable used identical
    event code. Figure 7, Figure 10, and spectral holdouts remain locked.
