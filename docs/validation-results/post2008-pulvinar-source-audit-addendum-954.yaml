primary_evidence:
  citation: Kirchgessner, Franklin and Callaway (2021), Current Biology 31, 5121-5137.e7
  doi: 10.1016/j.cub.2021.09.025
  url: https://pubmed.ncbi.nlm.nih.gov/34614389/
  accessed_scope: abstract-and-figure-captions
  preparation: awake-mouse-V1-dLGN-pulvinar
  supported:
    - V1 L5 inactivation reduced pulvinar visual responses; V1 L6 did not have the same driving role.
    - Both pathways supplied retinotopic baseline excitation.
    - Superior-colliculus inactivation also suppressed visual responses in the investigated pulvinar subregion.
  limits:
    - This evidence does not identify SMART synaptic conductance, delay or short-term-plasticity constants.
    - The tested L6 source is V1, not the higher visual area represented by SMART V2.
    - Population inactivation is not equivalent to selectively disabling a single modeled synapse class.
    - No independent quantitative transfer-function fit or model intervention is authorized by this audit.
  access_note: >-
    The prior full-text access limitation in audit953 remains historical fact.
    This addendum uses the separately accessible PubMed abstract and captions;
    it does not claim a completed full-text or data reanalysis.

