interpretation:
  - Moving the integrated membrane and leak to KInNeSS's internal-zero axis is
    necessary to match the archived output coordinate but is not sufficient.
  - >-
    Evaluating relay T-type gates after adding -70 mV produces a large tonic
    calcium drive: the nominally unstimulated burst cell settles approximately
    21.7 mV above the archived preinput trace and the normalized hyperpolarizing
    input fails to reach the archived negative regime.
  - No registered arm passes even one event-signature gate. This coordinate
    combination is closed without parameter fitting.
  - The contemporaneous KInNeSS equations define every voltage gate as a
    function of the simulator membrane variable V. Because the archived file
    identifies that V with the internal-zero output, applying the serialized
    leak only to the T gate is an unsupported split-coordinate assumption and
    warrants one separately preregistered source-semantics test.
