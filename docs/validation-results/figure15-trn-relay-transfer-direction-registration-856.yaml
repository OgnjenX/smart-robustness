classification_rule: >-
  Identify a shared-clock frequency direction only if relay, TRN, layer-4
  population, and fixed-pair peaks shift monotonically and coherently across
  all three factors while both pair cells remain active. A non-monotonic peak,
  opposing population directions, or extinguished pair identifies no bounded
  calibration direction.
selection_rule: >-
  Report all arms in fixed ascending order and select no factor. A coherent
  direction may authorize a separately preregistered, globally retrained
  generation-two grid, but this diagnostic cannot select its endpoint.
stopping_rule: >-
  Execute exactly one fresh baseline training followed by exactly three
  downstream arms. Do not rerun, densify, interpolate, retrain per arm, alter
  individual compartment ratios, open generation two, or consult neuron-model
  and modern-anatomy variants before assessment.
