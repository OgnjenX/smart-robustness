schema_version: 1
name: phase-1-stochastic-gif-somatic-spike-generator-robustness
status: preregistered-before-any-gif-network-outcome
control_manifest: configs/baselines/classic_smart_calibrated_v1.yaml

arms:
  classic_control:
    model: classic_multicompartment_hh
    parameters: frozen-control
  gif_parameter_invariant:
    model: somatic_gif_literature
    parameters: configs/models/gif_parameter_invariant_v1.yaml
  gif_isolated_matched:
    model: somatic_gif_per_cell_class
    parameters: generated-and-frozen-only-after-isolated-promotion
    matching_protocol: configs/models/gif_isolated_match_protocol_v1.yaml

required_identity_checks:
  - population names, sizes, compartments, and receptor/input port records
  - projection source and target edge arrays
  - initial projection strengths and delays
  - learning equations and initial state
  - stimulus schedules, durations, analysis procedures, and non-GIF seeds

network_seed_ensemble:
  seeds:
    - 2026091001
    - 2026091002
    - 2026091003
    - 2026091004
    - 2026091005
    - 2026091006
    - 2026091007
    - 2026091008
    - 2026091009
    - 2026091010
    - 2026091011
    - 2026091012
    - 2026091013
    - 2026091014
    - 2026091015
    - 2026091016
    - 2026091017
    - 2026091018
    - 2026091019
    - 2026091020
  common_random_numbers_between_gif_arms: true
  report_every_replicate: true

execution_order:
  - register formulation, literature transfer, fit ranges, seeds, and gates
  - implement and unit-test GIF without observing a SMART network outcome
  - execute and seal isolated fitting and both holdouts
  - verify structural identity against the classic control
  - execute fresh Figure 6 learning for every registered seed and eligible arm
  - pass only each replicate's own valid learned state to downstream protocols
  - assess all outcomes with unchanged frozen gates and report attrition

figure6_progression_rule:
  trial_success: all six frozen Figure 6 gates pass in that seed
  minimum_successful_trials: 16
  total_trials: 20
  each_individual_gate_minimum_trials: 18
  no_seed_replacement: true

primary_art_core_endpoint:
  per_seed_conjunction:
    - Figure 6 learning and bidirectional activation gates pass
    - Figure 7 match/mismatch discrimination passes
    - Figure 14 match gamma exceeds mismatch gamma
    - Figure 10 intact causal reset passes
  family_success: at least 16 of 20 registered seeds pass the full conjunction

secondary_endpoints:
  - complete unchanged official gate vector per seed
  - distributions and confidence intervals of continuous differences from classic metrics
  - Figure 15 identifiable gamma phenotype and frozen failed numeric gate
  - Figure 16 higher-order band-ordering behavior

modern_anatomy_changes: prohibited-in-phase-1
network_level_parameter_rescue: prohibited-in-phase-1
post_network_gif_tuning: prohibited; any new hypothesis requires a new registration
