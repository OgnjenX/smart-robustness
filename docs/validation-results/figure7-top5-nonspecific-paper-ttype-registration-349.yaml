stopping_rule: >-
  Run one fresh complete Figure 6 and construct match only if every prerequisite
  passes. Do not run mismatch in this artifact. If match passes, independently
  verify the same candidate before registering one fixed mismatch. If either
  stage fails, close this population-specific source alternative without a
  hybrid kinetic interpolation.
