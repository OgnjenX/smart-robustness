factorization_findings:
  temporal_summation:
    result: >-
      Union and additive-continuous traces are identical through 10 Hz. At
      20 Hz their maximum gate difference is 1.7123569229227087e-10 and area
      difference is 3.6953371068513435e-09 ms.
    interpretation: >-
      With a 2-ms alpha kernel and at most 20-Hz input, changing only the
      summation rule is numerically negligible in this isolated protocol.
  depletion_timing:
    result: >-
      Emission-snapshot area is 1.84-1.92 times classic continuous-resource
      area, despite identical source depletion parameters.
    interpretation: >-
      Event/resource ordering is a large independent intervention and must be
      held fixed or represented as its own control in relay and network assays.
  type2_dynamics:
    result: >-
      First-event peak/area matching does not equalize full-train drive. Both
      type2 arms lose area progressively with frequency; at 20 Hz they retain
      approximately 43.8% and 44.6% of classic area.
    interpretation: >-
      Any later circuit effect could arise from reduced realized drive rather
      than the categorical label driver/depressing. Matched-input controls must
      measure residual drive rather than assume first-event matching suffices.

claims_not_supported:
