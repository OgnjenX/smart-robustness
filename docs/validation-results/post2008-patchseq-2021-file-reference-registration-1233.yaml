  - Preserve all unmatched catalog assets, unreferenced source rows, duplicates, unknowns and literal disagreements. Compare all candidates even when ambiguous.
  - Source checksum strings and URLs remain preserved in the typed source manifest. The catalog projection lacks checksums, so cross-source checksum agreement remains unknown, not pass.
  - Do not infer donor/path-subject equivalence from file subject agreement.
  - This is an external file reference comparison, not internal NWB identity, physiological validation or specimen eligibility.
