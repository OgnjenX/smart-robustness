schema_version: 1
name: projection022-distal002-fresh-figure7-match-v1
status: registered-before-execution
base_profile: configs/calibration/figure6_kinness_equation27_transition_v1.yaml
figure6_artifact: docs/validation-results/figure6-projection022-distal002-212.yaml
contiguous_pair_artifact: docs/validation-results/figure7-projection022-distal002-pair-214.yaml
rationale: >-
  Artifact 214 contains four expectation-only mismatch relay events at
  3.28--3.81 ms, earlier than the first current-driven layer-6II event at 3.03
  ms plus the archived 2-ms direct feedback delay. They therefore originate
  from dynamic state retained from immediately contiguous Figure 6 training.
  The paper describes learned expectations in later match/mismatch trials, not
  an unreported continuation of the training stimulus. Re-run Figure 6 to
  obtain learned weights, reconstruct a fresh identical network, and transfer
  only those weights. This removes state contamination without a fitted washout
  duration and changes no biological parameter.
detector: {arm_mV: -20.0, release_mV: -30.0}
runtime_overrides:
  projection_source_convention: paper_supplement_cross_checked
trn_to_relay_gaba:
  figure6_survivor_label: paper_supplement_projection022_distal_0_02
  scales:
    modeldb112923.projection.000: 0.01
    modeldb112923.projection.001: 0.01
    modeldb112923.projection.004: 0.02
protocol:
  condition: match
  learned_state_handoff: fresh_network_from_figure6_weights
  top_down_current_pA: 600.0
  top_down_cue_lead_ms: 0.0
  equilibration_ms: 0.0
  duration_ms: 100.0
  dt_ms: 0.01
  record_relay_diagnostics: true
match_gate:
  relay_active_indices: [38, 39, 40, 41, 42]
  minimum_relay_events_per_active_index: 1
  trn_events: '>0'
  sampled_trn_events_have_fresh_cycles: true
  finite: true
next_gate: >-
  Run the fresh-network mismatch only if match passes. Preserve the learned
  weights, source resolution, transfer scales, and simultaneous protocol.
locked_holdouts:
  - figure7_mismatch
  - figure10_reset
  - figure14_spectra
  - figure15_local_synchrony
  - figure16_long_range_synchrony
