notes:
  - The archived Figure 8 XML omits both leak density and specific capacitance.
  - Ordinary leak/capacitance candidates preserve the hyperpolarized transient burst but do not restore the published depolarized tonic train.
  - The source geometry conversion is supported for KInNeSS 1.2; Ca_rebound.xml uses the older version-1 libkinmaze schema, but interpreting its raw dimensions as millimeters is not sufficient to reproduce Figure 8.
  - A caption-literal KInNeSS voltage-input interpretation was also tested: no clamp in the top condition and a finite hyperpolarizing conductance maintained in the bottom condition. It produces no pulse-evoked events over 1-300 nS and rules out clamp release timing as a sufficient explanation.
  - The remaining discrepancy requires an unrecovered version-1 libkinmaze membrane, current-unit, or gate behavior; no candidate is promoted without source or independent behavioral support.
