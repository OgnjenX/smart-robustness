corrected_definition:
  name: source_clock_ticks_exact
  recorded_ticks: rint(recorded_source_times_ms / registered_dt_ms).astype(int64)
  expected_ticks: rint(registered_emission_times_ms / registered_dt_ms).astype(int64)
  pass_rule: >-
    Recorded and expected integer tick arrays must be exactly equal in shape,
    dtype and value, and source indices must all equal the registered source
    index zero. Event and delivery counts must still both equal five.
  raw_float_diagnostic:
    record_maximum_absolute_source_time_error_ms: true
    pass_threshold: none
  justification: >-
    SpikeGeneratorGroup operates on the simulator clock. Integer tick identity
    is therefore the exact event-scheduling invariant, whereas bitwise equality
    after converting dimensioned binary floats to decimal milliseconds is not.
    This definition has no empirical tolerance and is independent of the
    observed 1.42e-14-ms serialization offset.

regression_contracts:
  - the preserved result-991 source times map exactly to ticks [5000, 7000, 9000, 11000, 13000] at dt 0.01 ms
  - a source event displaced by one full clock tick fails
  - a nonzero source index fails
  - missing, duplicate or extra source or delivered events fail
  - all non-timing metrics reconstructed from the preserved trace remain unchanged

