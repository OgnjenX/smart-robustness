rules:
  - Execute only after terminal acquisition and independent verification of all retained receipts. Bind to the verified terminal manifest hash and all per-asset receipt hashes; no new requests.
  - Retain every catalog asset, including failed acquisitions. Failed or absent metadata is unknown evidence, not biological failure or an excluded cell.
  - Analyze the top-level and literal metadata-object projections separately. Never silently choose one branch as the authoritative recording metadata.
  - Compare present string asset_id and path to exact catalog values. Compare present positive integer size and contentSize to exact catalog byte size. Missing, null, Boolean, float or unexpected types remain unknown.
  - Preserve generic identifier snapshots; do not interpret a generic artifact identifier as a neuron, cell, donor or session ID.
  - Retain every participant identifier and schemaKey. Report literal string identifier equality to the path subject token as a metadata consistency diagnostic only; do not equate it with the annotation donor.
  - Retain every activity identifier and schemaKey. Compare to the path session token only when the activity has literal schemaKey Session and a string identifier. Processing activities and missing schemas remain unknown for this comparison.
  - Multiple participants or sessions remain multiple candidates; do not select a first candidate or promote an any-match aggregate to verified identity.
  - Preserve all digest algorithm names and values. Compare only dandi:sha2-256 to typed source sha256_checksum and dandi:md5 to typed source md5_checksum when both are literal, correctly sized hexadecimal strings.
  - Digest comparisons are literal and case-sensitive; no inferred hash, lowercasing or substitution. dandi-etag is never treated as MD5 or SHA256.
  - A matching reported digest is cross-source metadata agreement, not independent validation of downloaded NWB file content.
  - Raw digest/source values, actor candidates, missingness, unexpected types and contradictions remain visible. No specimen is qualified and no failed name-test outcome changes.
  - Independently reconstruct all evidence records and counters before designing bounded internal NWB acquisition and physiology protocols.
