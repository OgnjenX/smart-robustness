      - Preserve exact binary64 input/coefficient lifts, common explicit initial state and sample-held current boundaries.
      - Preserve RK4 expression order and native-grid output-before-update convention unless a separately declared backend experiment tests its own differences.
      - Carry the complete internal multiprecision state losslessly across chunks; exported binary64 state is not a valid restart state.
      - Retain accepted-substep gate checks, finite RK stages and every failure; do not clip or repair.
      - Retain full arrays and receipts for independent remeasurement; storage-format changes need lossless identity tests and an explicit evidence contract.
    tests: monolithic-versus-chunked-serial-versus-sharded-exact-repeat-current-edge-resume-and-corruption-failure-tests
    limitation: lower-orchestration-or-storage-overhead-is-not-proof-of-needed-arithmetic-throughput
