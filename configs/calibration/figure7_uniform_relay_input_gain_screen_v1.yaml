schema_version: 1
name: figure7_uniform_relay_input_gain_screen_v1
classification: behavioral-calibration-mechanism-screen-not-source-recovery
base_profile: configs/calibration/figure6_declared_interneuron_input_v1.yaml
protocol:
  duration_ms: 25.0
  dt_ms: 0.01
  top_down_current_pA: 800.0
  top_down_current_mode: until_cued_cell_first_event
  top_down_cue_lead_ms: 0.0
  uniform_relay_input_gains: [1.0, 0.75, 0.5, 0.25]
selection:
  order: strongest_gain_first
  required_gates:
    - match_horizontal_relay_set
    - mismatch_overlap_only
    - match_more_active_relay_cells
    - match_more_trn_events
boundaries:
  - The 25-ms screen tests pathway separation, not the official 100-ms 40/70-Hz rates.
  - The source value is 1.0; lower gains are calibrated effective-input sensitivities.
  - Do not combine a uniform gain with a learned-map comparator or alter projection weights.
  - A survivor must pass a fresh 100-ms match before one fixed mismatch is inspected.
