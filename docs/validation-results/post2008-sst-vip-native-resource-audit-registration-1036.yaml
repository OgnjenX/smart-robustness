audit_questions:
  - Resolve every configured dynamics and reset selector across all 227 GLIF parameter objects to inspected native definitions.
  - Distinguish grid and interpolated spikes, spike-cut intervals, numerical scheme, reference voltage, coefficient transforms and stimulus sampling rules.
  - Identify current-input versus conductance-input boundaries; do not assume current-clamp fits validate inhibitory synaptic responses.
  - Inventory every configured mechanism and setup dependency in all 25 biophysical parameter objects, including morphology, temperature and voltage corrections.
  - Identify training and held-out sweep provenance before registering native physiological validation; do not use model fit scores to choose winners.
  - Record whether model-specific spike-cut intervals create a sampling or refractory boundary for a future Brian2 translation.
  - Keep native-source parity, experimental physiological accuracy and SMART behavioral preservation as separate gates.

