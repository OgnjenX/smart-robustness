controls:
  - name: classic_union_continuous_resource
    temporal_summation: two-most-recent-probabilistic-union
    amplitude: continuously-sampled-classic-source-resource
  - name: additive_continuous_resource
    temporal_summation: all-event-addition
    amplitude: continuously-sampled-classic-source-resource
  - name: additive_emission_snapshot
    temporal_summation: all-event-addition
    amplitude: classic-resource-immediately-before-emission-depletion
  - name: type2_peak_matched
    temporal_summation: all-event-addition
    amplitude: type2-release-times-fixed-first-event-peak-match-gain
  - name: type2_area_matched
    temporal_summation: all-event-addition
    amplitude: type2-release-times-fixed-first-event-area-match-gain

readouts_per_control:
  - complete-time-and-gate-arrays
  - full-train-peak
  - full-train-trapezoidal-area-ms
  - finite-and-nonnegative-checks
numerical_contract:
  - two-fixed-time-steps-with-no-adaptive-refinement
  - exact-repeat-at-each-time-step-and-frequency
  - source-resource-reference-matches-Brian-event-scheduling-in-focused-tests
  - first-event-matching-reference-checked-by-independent-quadrature-and-optimization
  - no-output-dependent-parameter-change

interpretation_boundaries:
  - This assay does not contain a neuron, membrane voltage, current, spike or network.
  - Peak and area matching are separate sensitivity arms; neither is privileged after outcomes.
  - The long 0.5-Hz interval is retained rather than compressed or removed.
  - The final 100-ms tail captures 50 alpha time constants but is still a finite integral.
  - Type2 parameters remain model-derived and cross-species, not modern mouse measurements.
  - Passing this assay can authorize a separately sealed relay-voltage assay, never direct network promotion.

