schema_version: 1
name: adex-isolated-cell-match-generation2-v1
status: registered-before-generation2-candidate-execution
generation1_result: docs/validation-results/neuron-model-adex-isolated-fit-v3-890.yaml

scope:
  refit:
    - layer5_excitatory_v1
    - layer4_excitatory_v1
    - thalamic_interneuron
  retain_generation1_parameters_for_other_classes: true
  rationale_from_isolated_results_only:
    layer5_excitatory_v1: failed generation1 sealed holdout
    layer4_excitatory_v1: classic scan remained silent
    thalamic_interneuron: classic scan remained silent

common:
  pre_ms: 50.0
  step_ms: 200.0
  post_ms: 50.0
  dt_ms: 0.02
  voltage_recording_dt_ms: 0.1
  amplitude_rule: soma_g_leak_nS_times_voltage_offset_mV_equals_pA

layer5:
  generation1_scan_range_mV: [-100.0, 200.0]
  generation1_scan_increment_mV: 5.0
  training_scan_indices: [0, 29, 34, 39, 48, 53, 56]
  new_sealed_holdout_scan_indices: [31, 37, 44, 51, 59]
  note: >-
    All seven previously evaluated levels become generation2 training data.
    The five final holdout indices had classic targets but no AdEx candidate
    output evaluated in generation1.

previously_silent_classes:
  new_scan_offset_range_mV: [250.0, 2000.0]
  new_scan_increment_mV: 25.0
  selected_levels: 9
  training_positions: [0, 2, 4, 6, 8]
  new_sealed_holdout_positions: [1, 3, 5, 7]
  note: all amplitudes exceed the generation1 scan maximum and are candidate-unseen

candidate_generation:
  method: same-32-point-unscrambled-sobol-plus-literature-as-generation1
  parameter_bounds_changed: false
  peak_mV: 20.0
  refractory_ms: 2.0

selection:
  minimum_training_loss_only: true
  holdout_not_used_for_selection: true
  promotion:
    - finite selected training and holdout traces
    - training loss no worse than literature candidate
    - final sealed holdout loss no worse than literature candidate

known_before_registration:
  literature_adex_figure6_failed: true
  generation1_matched_network_outcomes: none
  generation2_design_uses_literature_network_failure: false

forbidden:
  - changing parameter bounds from network outcomes
  - using any Figure 6 or downstream metric in candidate selection
  - changing SMART topology, weights, delays, protocols, or analysis
