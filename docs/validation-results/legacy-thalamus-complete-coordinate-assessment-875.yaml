interpretation:
  - >-
    Shifting every driving potential and the detector onto the integrated
    internal-zero axis corrects the two decisive coordinate signatures. The
    normalized arms begin within 0.047 mV of the archived preinput mean and
    reach 112--113 mV, close to the archived 109.565 mV action-potential peak.
  - >-
    The remaining mismatch is dynamical rather than a voltage-origin error.
    Normalized tonic arms fire every 2.0--2.15 ms instead of every 15.05 ms and
    produce 1395--1516 events instead of 199. Rebound arms produce 12--13
    events instead of six and hyperpolarize 7.69--7.89 mV too far.
  - >-
    Neither integration method nor normalized input encoding passes the fixed
    joint gates, and literal raw input remains non-finite. Per Registration
    873, no arm, method, or input encoding is selected.
  - >-
    The 2004 XML does not serialize specific membrane capacitance, but a
    contemporaneous KInNeSS methods paper explicitly fixes CM at 1
    microfarad/cm2. That is the value already used here, so capacitance and an
    arbitrary global time scale are closed rather than fitted.
  - >-
    Even a future reproduction of this independent 2004 relay benchmark would
    validate only the shared KInNeSS cell kernel. It cannot reconstruct the
    missing 2008 Figure-8 clamp schedule or by itself prove original SMART.
