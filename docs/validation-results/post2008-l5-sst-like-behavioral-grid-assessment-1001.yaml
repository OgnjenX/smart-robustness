interpretation:
  - >-
    The preregistered L5 SST-like distal-feedback abstraction preserves every
    frozen Figure-7 match/mismatch gate at every tested nonzero coordinate.
  - >-
    Seven coordinates also preserve every conditional Figure-10 reset/search
    gate, but none is exactly equal to the legacy trajectory; these are robust
    changed survivals rather than invariance or fitted compensation.
  - >-
    Five coordinates fail deterministically and exclusively at the
    intact_replacement_winner Figure-10 gate. The disconnected control and all
    other retained Figure-10 gates pass, localizing the registered failure to
    winner replacement in the intact search cycle rather than to Figure-7
    resonance/mismatch organization.
  - >-
    Survival is nonmonotonic over the prospective delay-resource grid. The
    observed checkerboard cannot support interpolation, a monotone threshold,
    a preferred coordinate, or selection of one best SST-like parameter set.
  - >-
    Exact repeats establish deterministic reproducibility for this runtime and
    retained summaries. They are not independent seeds, biological replicates,
    or evidence that discarded time series are bitwise identical.
  - >-
    The route is a collapsed functional sensitivity test. It does not contain
    an explicit SST interneuron, subtype prevalence, intrinsic SST dynamics,
    fitted anatomy, plasticity of the added route, or developmental compensation.
  - >-
    The frozen classic SMART baseline, archived legacy control, learned
    Figure-6 weights, gates and all other modern-anatomy modules were unchanged.

