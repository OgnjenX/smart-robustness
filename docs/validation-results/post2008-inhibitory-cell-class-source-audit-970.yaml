missing_modern_motifs:
  - PV-like perisomatic target specificity is not explicit.
  - SST-like dendritic target specificity and weak SST-to-SST inhibition are not explicit.
  - VIP-to-SST disinhibition is absent.
  - Direct dLGN recruitment of L5 PV-like cells is absent.
  - Layer- and projection-subtype-specific inhibitory recruitment is absent.

translation_decision:
  strategy: staged-routing-first-then-intrinsic-diversity
  rationale:
    - Replacing all generic inhibitory cells at once would confound population count, intrinsic dynamics, subcellular targeting, long-range recruitment and recurrent inhibition.
    - No audited source supplies a complete set of SMART-compatible absolute parameters for such a replacement.
    - Source-cell name alone cannot determine synaptic sign because projection022 is AMPA-labeled.
  ordered_subphases:
    - exact-null-routing-scaffold-equivalence
    - isolated-target-location-and-interneuron-routing-controls-with-fixed-event-replay
    - one-layer-at-a-time PV-like network routing
    - one-layer-at-a-time SST-like dendritic routing
    - VIP-like disinhibitory routing only after an independently specified recruitment protocol
    - intrinsic PV-SST-VIP neuron-model differences only after routing effects are localized
    - cross-module interactions only after single-module results are sealed

conservation_requirements:
  - The null arm must reproduce the frozen baseline exactly before any biological arm is run.
  - Every routing-only comparison must hold presynaptic events, receptor kinetics, reversal potential, delay and total registered synaptic resource fixed unless the changed field is the preregistered factor.
  - Realized conductance/current and spike drive must be reported; equal nominal weight is not equal effective inhibition across compartments.
  - Population prevalence may not be converted into synaptic weights.
  - No observed SMART outcome may be used to choose a split fraction, target compartment or gain.

decision:
  source-supported_staged_preregistration_authorized: true
  immediate_full_PV_SST_VIP_replacement_authorized: false
  network_outcomes_authorized: false
  next_step: >-
    Implement and seal an exact-null inhibitory-routing scaffold. Its legacy
    aggregate mode must be structurally identical and behaviorally hash-equal
    to the frozen baseline before any PV-like, SST-like or VIP-like route is
    allowed to execute.
