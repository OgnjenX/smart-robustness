schema_version: 1
name: trn-gaba-compartment-source-endpoint-v1
status: registered-before-execution
base_profile: configs/calibration/figure6_kinness_equation27_transition_v1.yaml
uniform_pair_artifact: docs/validation-results/figure7-trn-gaba-transfer-pair-204.yaml
rationale: >-
  Artifact 204 rejects one common transfer scale. The three official inhibitory
  projections terminate on different relay compartments and can affect direct
  spike suppression versus dendritic T-current dynamics differently. Test the
  source-strength endpoint on one compartment at a time before admitting any
  additional intermediate behavior calibration.
detector: {arm_mV: -20.0, release_mV: -30.0}
baseline_scale: 0.01
source_scale: 1.0
profiles:
  - label: restore_soma_source
    scales:
      modeldb112923.projection.000: 1.0
      modeldb112923.projection.001: 0.01
      modeldb112923.projection.004: 0.01
  - label: restore_proximal_source
    scales:
      modeldb112923.projection.000: 0.01
      modeldb112923.projection.001: 1.0
      modeldb112923.projection.004: 0.01
  - label: restore_distal_source
    scales:
      modeldb112923.projection.000: 0.01
      modeldb112923.projection.001: 0.01
      modeldb112923.projection.004: 1.0
stage_1_protocol: {stimulus_ms: 55.0, dt_ms: 0.01}
stage_1_gate:
  relay_active_indices: [38, 39, 40, 41, 42]
  minimum_events_per_active_relay: 2
  trn_events: '>0'
stage_2_protocol: {stimulus_ms: 100.0, dt_ms: 0.01}
stage_2_gate:
  relay_event_count: 20
  relay_active_indices: [38, 39, 40, 41, 42]
  relay_events_per_active_index: 4
  relay_fresh_detector_cycles_per_active_index: 4
  feedforward_chain_complete: true
  causal_pair_in_learning_window: true
  bottom_up_horizontal_orientation: true
  minimum_top_down_horizontal_contrast: 0.01
next_gate: >-
  Advance a complete Figure 6 source-endpoint survivor to same-network match
  and mismatch. If none survives even the 55-ms relay-repeat gate, reject
  source-strength restoration by compartment before registering any bounded
  intermediate compartment grid.
locked_holdouts:
  - figure7_match
  - figure7_mismatch
  - figure10_reset
  - figure14_spectra
  - figure15_local_synchrony
  - figure16_long_range_synchrony
