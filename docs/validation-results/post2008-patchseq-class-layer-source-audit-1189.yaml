  provenance_limit: >-
    The source annotation feather path is an author's local filesystem path,
    not an accessible authoritative download endpoint. The notebook's published
    processed cohort is filtered, including removal of inconsistent calls and
    types with fewer than ten cells; it is not a complete raw annotation inventory.
    Do not copy its default np.select label to fill unknown confidence calls.
