design_implications:
  already_present:
    - a proximal L5 and distal L6 distinction at the higher-order relay
    - parallel direct cortical and indirect higher-order thalamic paths
  not_a_valid_modernization_claim: merely-adding-the-already-present-motifs
  next_evidence_needed:
    - visual-system primary measurements distinguishing driver and modulator transfer functions
    - target-resolved LP cortical termination layers and quantitative pathway efficacy
    - independent delay and short-term-dynamics sources or explicit bounds on missing measurements
    - executable source-defined visual and state/context inputs, not tuning to Figure16
  next_design_requirements:
    - choose and label one visual species/area stratum for the primary intervention
    - keep mouse source mapping distinct from macaque attention endpoints
    - preregister pathway-off, direct-only, indirect-only and matched-input controls
    - separate sensory encoding from state-dependent coordination readouts
    - preserve raw signals and preregister independent seeds and temporal windows
    - seal one anatomical modification at a time before network outcomes
  matched_input_caution: >-
    Equal initial weight or total conductance is not equal realized current or
    information. Register which quantity is matched and measure residual drive
    differences; an ablation alone cannot distinguish pathway coding from drive.

unresolved:
  - Short-term-plasticity parameters have not been independently sourced.
  - Absolute pathway strengths and delays have not been identified from these papers.
  - Target-specific AL/PM and behavioral-state inputs are absent from the current assay.
  - An additional driver/modulator source (PMC8665059) was located but full text access returned a browser check; no parameter claim relies on it.
  - Phase6 implementation, preregistration, experiments and synthesis remain uncompleted.
