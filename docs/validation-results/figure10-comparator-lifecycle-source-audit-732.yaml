decision_rule: >-
  Implement a default-preserving registration override that disables only the
  reconstructed top-five relay-input multiplier in Figure 10. Preregister one
  unchanged emission-snapshot intact/control pair with the full vertical input.
  Require fresh Figure 6, the pre-reset winner, and the upstream reset chain.
  Pass the Figure-10 endpoint only if intact suppresses the prior winner and
  releases more alternative layer-4 cells than control. Do not fit a release
  time, input gain, score, weight, delay, threshold, or kernel.
boundary: >-
  This audit authorizes implementation and one pair only. It does not select
  the rejected emission-snapshot convention, repair the locked Figure-7
  source/reconstruction discrepancy, reproduce gamma or beta, establish
  original SMART, promote the baseline, or freeze it.
