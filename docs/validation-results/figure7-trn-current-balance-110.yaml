interpretation:
  - Relay AMPA reaches the TRN proximal dendrite and axial inward current into the soma peaks near 3.282 nA, so the failure is not absent connectivity or complete electrical isolation of the soma.
  - Recurrent GABA is at most approximately 3.13 pA in the driven window, three orders of magnitude below relay and axial currents; it cannot account for the missing events.
  - The executable-source somatic intrinsic currents dominate the balance: calcium reaches 20.08 nA, sodium 47.49 nA, and outward potassium 74.58 nA. The soma peaks near +7.10 mV in both conditions and never arms the paper's +30 mV falling-phase event detector.
  - Match and mismatch rearrange relay AMPA spatially, but the intrinsic oscillation envelope and somatic voltage remain effectively coincident. This is consistent with five active relay cells in both conditions.
  - SMART.nml places 100 mS/cm2 reticular calcium in the soma and dendrites, whereas printed Table 3 omits somatic calcium and gives 10 mS/cm2 in each dendrite. That official-source conflict is now directly relevant to the dominant current balance, but prior whole-paper-profile tests were autonomous or failed Figure 7 and therefore do not justify selecting a hybrid cell.
  - No conductance or threshold is tuned. The next admissible discriminator must preserve one complete official intrinsic-cell source profile and address relay-count divergence before downstream TRN tuning.
