rules:
  - Require exactly one literal matching taxonomy-provenance row with the registered ID, description and reference.
  - Retain every July legacy accession/label pair, including empty strings and conflicting aliases for one accession.
  - Restrict candidate cell sets only by exact literal taxonomy_id equality to CCN201810310.
  - Require exact preferred-alias equality, not substring, prefix, case folding, whitespace repair or fuzzy matching.
  - Retain every candidate with source row number, exact reference accession, species and modality.
  - A name-based alignment requires one candidate with a nonempty literal accession unique within the reference, and an unambiguous nonempty legacy accession/label pair.
  - Report reference accession collisions and conflicting legacy accession labels without silently merging them.
  - Label every accepted correspondence as a provenance-constrained exact-name alignment, not direct accession equality or independently confirmed historical identifier equivalence.
  - Do not infer broad class, measured layer, mapping confidence, specimen independence or physiological eligibility.
  - Leave the earlier failed direct-accession lookup unchanged.
