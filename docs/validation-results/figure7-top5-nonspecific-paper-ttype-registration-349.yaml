rationale:
  - >-
    Artifact 348 localizes the remaining Figure 7 output deficit to a nonlinear
    interaction between compartment-resolved TRN inhibition and rebound in the
    nonspecific thalamic cell. It does not authorize choosing a synaptic gain.
  - >-
    The calibrated baseline already selects the paper Table 3 intrinsic cell
    for nonspecific thalamus, including 250 mS/cm2 dendritic T current, but its
    global calcium-kinetics convention still supplies the ModelDB executable
    Simple_Tau constants. Grossberg and Versace 2008 Equations 21--27 are the
    primary-paper alternative for T-current gating.
  - >-
    Apply that discrete paper alternative only to the causally localized
    nonspecific cell. Keep the validated ModelDB reticular kinetics in TRN and
    every relay/cortical convention fixed. This is a source discriminator, not
    a fitted continuous parameter and not a claim that the mixed-source
    reconstruction was the original simulator configuration.
registered_dimension:
  population: thalamic_nonspecific
  mechanism: T-type calcium activation/inactivation kinetics
  source_alternative: paper_2008
  candidate_count: 1
fixed:
  trn_calcium_kinetics: modeldb_reticular_112923
  relay_calcium_kinetics: modeldb_112923
  nonspecific_calcium_density_mS_cm2: 250
