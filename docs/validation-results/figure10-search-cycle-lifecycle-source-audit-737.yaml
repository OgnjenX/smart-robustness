independent_reset_marker:
  source_registration: docs/validation-results/figure10-layer6i-emission-target-voltage-registration-729.yaml
  source_result: docs/validation-results/figure10-layer6i-emission-target-voltage-pair-730.yaml
  direct_projection038_gate_threshold: 0.1
  direct_projection038_first_threshold_crossing_ms_from_mismatch: 61.880000000000024
  target_indices: [31, 49]
  interpretation: >-
    This is a preregistered, independently measured onset of the direct
    layer-6I reset signal at previously inactive alternatives under the fixed
    emission-snapshot candidate. It is not a time chosen from the proposed
    lifecycle experiment or from its behavioral output.
authorized_reconstruction:
  name: yoked_reset_marker_bottom_up_reinstatement
  before_marker:
    relay_input_transform: fixed top-five learned comparator
    purpose: retain the already validated previously inactive candidate pool
  at_marker:
    action: replace relay gain vector with identity all ones
    mismatch_time_ms: 61.880000000000024
  after_marker:
    relay_input_transform: identity all ones
  yoking:
    identical_transition_time_both_arms: true
    control_time_derived_from_intact_independent_audit: true
    reason: prevent reset disconnection from changing sensory availability
  unchanged:
  - model equations and intrinsic parameters
  - synaptic weights, delays, kinetics, topology, and depletion values
  - mismatch stimulus values outside the relay gain transform
  - top-down current state at the transition
  - 100-ms match plus 200-ms mismatch duration
  classification: calibrated-event-locked-search-cycle-reconstruction
implementation_constraint: >-
  Change only the active relay input values at the registered marker. Do not
  reapply or restart the top-down current, nonspecific input, matrix input, or
  mismatch epoch. The control receives the exact same sensory transition.
decision_rule: >-
  Preregister and execute one intact/control pair. Require fresh Figure 6,
  exact pre-reset winner identity, the intact reset chain, no alternative
  layer-4 events in either arm before the marker, and positive post-transition
  projection-035 delivery at all five vertical targets. Require intact prior-
  winner suppression. Reset-specific alternative release passes only if an
  intact previously inactive alternative emits before the first such control
  event; ties or silence fail. Report total alternative active counts and
  events but do not tune or define a post hoc counting window.
boundary: >-
  This audit authorizes implementation and one pair, not a numerical legacy-
  scheduler recovery claim. A pass would select a calibrated search-cycle
  reconstruction for further holdouts, not establish original SMART by itself.
  A failure closes this lifecycle endpoint without trying another marker,
  threshold, gain, transition waveform, or output score. No Figure-7 revision,
  gamma/beta claim, baseline promotion, freeze, neuron substitution, or modern
  anatomy variant is authorized here.
