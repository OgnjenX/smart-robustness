classification_rule: >-
  Compare ablated mismatch and match nonspecific event counts. Mismatch greater
  than match demonstrates latent TRN-mediated disinhibition when cortical
  excitation is absent; equality means the remaining inhibitory pathway has
  insufficient rate-discriminating capacity at this operating point; match
  greater than mismatch gives the wrong sign. This is an ablation diagnostic,
  not a candidate and not a parameter fit.
next_gate: >-
  Use the fixed causal classification to choose whether the next preregistered
  mechanism should rebalance cortical excitation against an intact latent
  disinhibition signal or revisit aggregate TRN-to-nonspecific transfer. Keep
  Figure 10 and spectral holdouts locked.
