      - Enable interpolation-error control explicitly; local header defaults it off.
      - Document the actual error norm acceptance factors order controller step caps and exact coefficient construction.
      - Test closed-form scalar and vector systems interior samples exact endpoints near-zero errors rejection and stiffness-budget failures.
      - Test native-time segmentation and deterministic-barrier restarts on manufactured inputs before any HH matrix.
