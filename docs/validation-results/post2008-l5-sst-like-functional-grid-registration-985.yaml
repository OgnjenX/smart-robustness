schema_version: 1
artifact_id: 985
artifact_type: pre-outcome-layer5-sst-like-functional-feedback-grid-registration
date: 2026-09-21
status: design-registered-before-implementation-and-network-outcomes
source_supplement: docs/validation-results/post2008-l5-sst-like-source-supplement-984.yaml
representation_audit: docs/validation-results/post2008-sst-like-routing-representation-audit-983.yaml
isolated_target_assessment: docs/validation-results/post2008-inhibitory-target-location-isolated-assessment-978.yaml
legacy_control_assessment: docs/validation-results/post2008-inhibitory-routing-null-assessment-974.yaml
network_execution_authorized: false
frozen_baseline_modified: false

question: >-
  Across a bounded, prospectively fixed region of collapsed recurrent delay
  and total GABA-A resource, where does an L5 SST-like distal feedback-gating
  abstraction preserve, change or disrupt the frozen SMART match/mismatch and
  reset behavior?

representation:
  kind: collapsed-disynaptic-functional-route
  source_events: layer5_excitatory_v1 spikes
  omitted_intermediate: L5 SST-like interneuron
  target: layer5_excitatory_v1.distal_dendrite
  source_target_mapping: same-spatial-index
  topology: one-to-one
  receptor: GABA_A
  reversal_mV: -70.0
  rise_ms: 1.0
  fall_ms: 7.0
  plastic: false
  biological_claim: >-
    Functional sensitivity test of delayed recurrent distal inhibition only;
    not an explicit SST population, subtype, prevalence or fitted circuit.

independent_parameter_region:
  resource_anchor:
    name: projection036-total-port-conductance
    value_nS: 193.28648801211204
    role: existing-SMART-unit-anchor-not-biological-SST-estimate
  resource_fractions: [0.125, 0.25, 0.5, 1.0]
  realized_total_conductance_nS: [24.160811001514005, 48.32162200302801, 96.64324400605602, 193.28648801211204]
  collapsed_delays_ms: [1.0, 3.0, 7.0]
  nonzero_grid_points: 12
  justification: >-
    The logarithmic-like resource range spans one eighth to one full existing
    SMART cortical inhibitory port resource, while the three delays expose
    fast, intermediate and slower collapsed feedback timing. These values are
    prospective computational coordinates, not estimates from network results
    or claims about biological SST distributions.

staged_execution:
  stage0_static_contracts:
    - module is opt-in and classic assembly code is unchanged
    - target cell and distal compartment exist
    - only registered receptor, target and same-index route are added
    - total conductance is normalized exactly to the registered nS value at every point
  stage1_exact_null:
    resource_fraction: 0.0
    delays_ms: [1.0, 3.0, 7.0]
    required_result: exact equality across delays, repeats and archived legacy summary
    repetitions_per_delay: 2
    promotion: all zero-resource runs must be exact before any nonzero point executes
  stage2_isolated_recruitment:
    purpose: >-
      Replay a fixed L5 source event train through every nonzero delay/resource
      point and verify event delivery, exact resource normalization, finite
      currents, numerical convergence and exact repeats without observing a
      SMART network outcome.
    required_dt_ms: [0.01, 0.005]
    repetitions_per_point_per_dt: 2
    promotion: all engineering and numerical gates must pass
  stage3_behavioral_grid:
    order: delay-major-then-resource-ascending
    repetitions_per_point: 2
    archived_control: results/inhibitory-routing-null-973.yaml
    learned_weights: results/direct-visual-thalamus-layer5-figure6-940.yaml ratio_0 exact weights
    figure7_for_every_point: true
    figure10_only_after_same-run-figure7-pass: true
    exact_repeat_required: true
    report_all_points: true
  stage4_learning_and_extended_progression:
    eligibility: only points passing stage3 without compensation
    rule: >-
      Run Figure-6 learning and later spectral/inter-area validators for every
      eligible point; do not select one point as the winner. Register and seal
      this stage separately after stage3 is assessed.

behavioral_gates:
  figure7: inherited-unchanged-from-frozen-calibrated-profile
  figure10: inherited-unchanged-from-sealed-search-cycle-runner
  exact_repeat: retained summaries must be exactly equal across two repetitions
  no_relaxed_gate: true

prospective_point_classification:
  exact_survival: all gates pass and retained summary exactly equals legacy
  robust_changed_survival: all gates and exact repeats pass but retained values differ from legacy
  failure: any behavioral gate or exact-repeat requirement fails
  engineering_stop: any seal, structural, event-delivery, normalization, finite-value or convergence gate fails

region_level_classification:
  invariant_region: all 12 nonzero points are exact_survival
  robust_region: at least one nonzero point survives and all 12 points are reported
  no_survival_in_registered_region: all 12 nonzero points are failures
  mixed_region: surviving and failing points coexist; report the prospective boundary without interpolation or point selection
  indeterminate: any point has an engineering_stop or incomplete exact repeat

fixed_fields:
  - frozen classic baseline and learned weights
  - all existing populations, projections, intrinsic equations and external inputs
  - L5 source spikes and same-index target mapping
  - receptor reversal and kinetics
  - Figure-7 and Figure-10 protocols, analyses and gates
  - parameter-grid values and execution order

forbidden:
  - fitting resource or delay to any SMART network outcome
  - claiming the grid is a biological SST parameter estimate
  - adding an explicit SST intrinsic neuron during this experiment
  - changing topology, lateral spread, target subtype or receptor within the grid
  - selecting only passing points for the region-level conclusion
  - combining this module with PV-like, VIP-like, apical, thalamic-L5 or pulvinar interventions
  - modifying the frozen classic baseline

next_step: >-
  Implement and test the opt-in collapsed route and exact-null runner, then
  hash-seal every dependency before observing the first zero-resource network
  outcome. Nonzero execution remains unauthorized until null and isolated
  recruitment stages are separately assessed.
