    cluster_cpp_sha256: 1b9fc9ff149c657e16df1d2478b813056f7b82a7fb9207b48ef4ec575a024403
  executable_findings:
    global_exchange: >-
      Every unit calculates against the published Outputs arrays; only after a
      barrier does each unit post its new signal, so connected-unit inputs are
      previous-step values.
    runge_kutta_form: >-
      Runge_Kutta(x, ext, coef, fun) computes four stages by varying x only.
      ext and coef are values passed into the helper and remain fixed across all
      stages. The returned increment is h*(k1+2*k2+2*k3+k4)/6.
    generic_equation_implication: >-
      When membrane voltage and channel gates are represented as separate
      SANNDRA equation units, each equation advances its own variable while
      voltage, gates, axial neighbors, and other-unit inputs remain at their
      beginning-of-step values.
current_brian_behavior:
  method: rk4
  semantics: >-
    Brian2 evaluates the complete differential state vector at each RK stage,
    so voltage and every gate receive stage-intermediate values together.
  exact_parity_with_predecessor_helper: false
