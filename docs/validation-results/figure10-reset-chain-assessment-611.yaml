interpretation: >-
  The intact reset arm delivers 2.76 times the projection-025 current integral
  and 8.95 times its peak to layer 6I, but both arms emit the same 30 events
  from the same five layer-6I cells. Their event times differ by no more than
  0.03 ms and their transmitter samples are effectively identical. Projection
  026 then transfers effectively identical excitation to layer-4 inhibitory
  cells, which emit the same 124 events from the same cells; projection 036
