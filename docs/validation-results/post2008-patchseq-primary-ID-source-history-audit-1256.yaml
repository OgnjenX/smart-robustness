decision: >-
  A separately registered common-cell-ID-linked annotation coherence ledger can
  preserve author-provided quality calls and compare source anatomy/class context
  without claiming RNA sample alias equivalence. Label its link evidence as
  canonical-cell-ID-only, carry both failed string flags, and leave recording
  identity, confidence assignment and eligibility gates unresolved. Do not turn
  an identifier analysis into an outcome-guided scientific cohort change.
