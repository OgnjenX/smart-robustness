interpretation: >-
  Intact layer-6I alternatives 31 and 49 first fire 54.95 ms after mismatch
  onset with transmitter 1.0, while the winner-aligned cells first fire with
  transmitter between 0.013729873566392605 and 0.014321458149130413. This is
  the qualitative resource contrast described for Figure 10d/e. In the
  current executable schedule, however, epsilon 1 resets transmitter to zero
  at the source event and the ongoing ligand gate is multiplied by the
  continuously recovering source value. At the one-millisecond p026/p038
  delivery only 0.0024968776025399153 availability has recovered. Consequently
  the previously inactive source's stored-resource advantage is not carried
  by the newly emitted event. The direct and indirect layer-6I reset outputs
  therefore cannot express the paper's stated habituative selection mechanism
  under this particular schedule.
closure: >-
  Close projection 036 as a depletion or weight fault. Its source population
  is non-depleting, and its observed timing only relays the upstream layer-6I
  phase. Do not tune a synaptic or intrinsic parameter from this result.
