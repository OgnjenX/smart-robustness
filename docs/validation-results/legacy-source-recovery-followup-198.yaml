    - The poster reports downloading SANNDRA 1.0.0 from the KInNeSS download area.
    - >-
      Compiler output names rates.h, internal.h, formulas.h, gates.h,
      channels.h, equations.h, fanlink.h, input.cpp, and unit.cpp.
    - >-
      The local path contains gross_Smart, but that directory name alone does
