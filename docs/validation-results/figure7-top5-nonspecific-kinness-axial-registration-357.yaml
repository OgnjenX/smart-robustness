rationale:
  - >-
    Artifact 348 localizes the remaining output deficit to nonlinear transfer
    among the nonspecific cell's soma, proximal dendrite, and distal dendrite.
    Axial coupling is therefore an intact membrane-transfer mechanism, unlike
    a detector reinterpretation or removal of a published contact.
  - >-
    The calibrated profile uses paper-literal axial coupling in nonspecific
    thalamus. The archived executable supplies KInNeSS serialized-edge
    coupling for the same three-compartment cell and is a discrete official
    source alternative.
  - >-
    Artifact 138 changed axial coupling in every thalamic population and failed
    Figure 6 after altering relay/TRN dynamics. It cannot identify the effect
    of nonspecific axial coupling alone. This test changes only that population
    and leaves the validated relay/TRN source choices fixed.
