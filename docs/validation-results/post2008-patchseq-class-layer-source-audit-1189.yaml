available_route:
  official_NeMO_directory: https://data.nemoarchive.org/other/AIBS/AIBS_patchseq/transcriptome/scell/SMARTseq/processed/analysis/20200611/
  finding: >-
    The public directory lists count, CPM, exon and intron archives and the June
    metadata archive. No separate mapping-confidence annotation file is listed.
    This directory inventory is not proof that no public confidence source exists.
decision: >-
  First inventory exact raw structural and taxonomy labels over all saved June
  records and the independently manifest-covered subset. Keep missingness and
  source coverage visible without deriving class, layer or confidence eligibility.
  Then trace authoritative per-cell confidence and anatomical correspondence
  before registering a qualified physiology cohort. Do not download processed
  physiological arrays or infer confidence from a nonempty type alias.
