schema_version: 1
name: figure7_receptor_prime_decomposition_v1
classification: causal-pathway-decomposition-not-source-recovery
base_profile: configs/calibration/figure6_declared_interneuron_input_v1.yaml
fixed_prime:
  source_index: 40
  arrival_time_ms_from_stimulus_onset: 0.0
  amplitude: 1.0
arms:
  relay_on_center_only:
    projection_ids:
      - modeldb112923.projection.003
      - modeldb112923.projection.005
      - modeldb112923.projection.006
      - modeldb112923.projection.007
  trn_off_surround_only:
    projection_ids:
      - modeldb112923.projection.009
      - modeldb112923.projection.012
protocol:
  duration_ms: 25.0
  dt_ms: 0.01
  top_down_current_pA: 800.0
  top_down_current_mode: until_cued_cell_first_event
  top_down_cue_lead_ms: 0.0
  uniform_relay_input_gain: 1.0
  projection_002_gain: 1.0
controls:
  no_prime: docs/validation-results/figure7-interneuron-gaba-gain-screen-443.yaml
  combined_prime: docs/validation-results/figure7-receptor-simultaneity-diagnostic-449.yaml
boundaries:
  - Both arms use the same unit arrival and sensory-onset time as the rejected combined prime.
  - This decomposition localizes causal dominance; neither arm is a candidate source reconstruction.
  - No amplitude/timing fit, current change, cue lead, comparator, learned headroom, scaling, calcium ablation, or equilibration is permitted.
  - No-prime and combined-prime controls are imported, not rerun.
  - An arm passing spatial gates would authorize a fresh 100-ms verification but would remain non-source calibration.
