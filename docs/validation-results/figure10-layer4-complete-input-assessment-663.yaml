interpretation: >-
  The unchanged recovery repeats every registered population count and all fresh
  Figure-6 gates. Before 70 ms the alternatives have essentially identical
  relay excitation and off-surround inhibition in both arms, no recurrent
  projection-037 current, and no events. Their first output difference occurs
  in the 70--80-ms bin: each control alternative emits one event while intact
  alternatives remain silent. Projection 037 also first becomes nonzero in
  that same coarse bin, so the ten-ms integrals cannot establish whether it
  precedes the first control spike or is recruited by that spike. The complete
  late totals show that recurrent excitation strongly amplifies control release
  after it begins, whereas intact alternatives never recruit it. The winner
  balance still opposes reset. No parameter is selected.
next_gate: >-
