    state and all other output projections unchanged. No override is implemented
    or authorized by this design.

first_event_reference:
  component: src/smart_robustness/models/pulvinar_matching.py
  initial_resource: 1.0
  emission_time_ms: 0.0
  time_coordinate: s-ms-after-arrival
  kernel: exp(1)*(s/tau)*exp(-s/tau)-for-s-nonnegative
  classic_resource: 1-epsilon*exp(-(s+delay)/T)
  static_event: r_first-times-kernel
  matching_rules:
    peak: classic-peak-divided-by-r_first
    area: classic-infinite-conductance-area-divided-by-r_first-and-static-kernel-area
  assumptions:
    - Continuous-time reference does not reproduce finite-step Brian event scheduling.
    - Resource is depleted at emission, before the delayed alpha response.
    - Peak and area gains are separate controls, not two simultaneous matching claims.
    - Conductance area does not equal charge unless the driving force is fixed.
    - Neither matching rule guarantees equal firing, information or train-integrated drive.

