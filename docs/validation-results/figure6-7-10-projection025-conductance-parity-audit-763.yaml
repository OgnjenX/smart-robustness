interpretation: >-
  Projection 025 is translated without a unit, area, targeting, weighting, or
  kinetics error. The source density and geometry imply 15.707963267948967 nS,
  and the compiled Brian2 port contains exactly that value. KInNeSS Equation 16
  keeps the dimensionless source weight separate; the source interpretation
  supplies exactly one weight-1 edge to each target. Therefore the previously
  explored eightfold scale cannot be explained by a missing density-to-area or
  weight factor. With both the variance-spread and conductance-scale routes
  already rejected, projection 025 is closed as a classic-source correction.
boundary: >-
  The available source-constrained and preregistered calibrated family has no
  endpoint that jointly passes Figures 6, 7, and 10. This does not prove that
  original SMART cannot be reproduced; it shows that another p025 adjustment is
  not a defensible route. Exact legacy scheduler/source recovery or an explicitly
  declared joint calibrated-reconstruction methodology is required before
  Figures 14--16, gamma/beta validation, baseline promotion, freezing, neuron
  substitutions, or modern-anatomy variants.
