conclusions:
  - Projection 031 is causal for layer-2/3 and layer-5 silence under the active reconstruction.
  - Its GABA conductance, weight, topology, kinetics, reversal, and delay agree between the supplement and ModelDB archive, so deleting or weakening it is not source faithful.
  - The remaining audit target is the relative event timing and ligand/receptor execution of projections 032, 039, and 031, not membrane capacitance or wholesale Table 3 substitution.
