static_findings:
  - Rested fitting returns no target if upstream shared latency is absent.
  - The source latency window is inherited shared latency plus or minus 100 microseconds.
  - IC initialization inherits aggregate PSP rise and decay when available.
  - Original rested contributors require response-sign-specific pulse QC, preceding rest greater than eight seconds and at least ten milliseconds of response data.
  - The source excludes pairs with simultaneously identified mono- and polysynapses from rested fitting.
  - Upstream latency and kinetics summarize manually QC-passed average fits, weighted by contributor counts.
  - The source warns against relying on rested fits when the all-pulse PSP kinetics failed upstream quality checks.
  - Therefore a rested-state-first selection is not evidence of independent measurement or absent upstream QC dependencies.
