    the archived tonic and burst event signatures.
  - Treating the PNG channel value literally as 250 makes both integrators
    non-finite, rejecting that encoding in the current conductance-input
    translation.
  - This negative result closes only the six registered arms. It neither
    invalidates T-type calcium as a mechanism nor identifies the missing 2008
    Figure-8 protocol.
  - The archived voltage files subsequently expose a distinct membrane-output
    coordinate from the physical-voltage coordinate used in this replay. That
    source-derived correction must be tested in a new preregistered replay; it
    is not selected post hoc in this result.
