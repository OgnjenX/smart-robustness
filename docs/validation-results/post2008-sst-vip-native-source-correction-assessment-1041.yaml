inspected_setup_requirements:
  - Native setup depends on NEURON, morphology import, hoc initialization and compiled channel mechanisms, not parameter JSON alone.
  - Perisomatic setup replaces reconstructed axons with two 30-micron segments of one-micron diameter; discretization uses an odd nseg determined by section length.
  - All-active setup selects a stub or legacy truncated-axon path from the model description, with distinct diameter and connection handling; these modes may not silently interchange.
  - The two setup classes apply passive and genome parameters differently, including capacitance and passive reversal assignment; they require separate parity controls.
  - Native initialization sets temperature, initial voltage and optional integration controls from conditions via HocUtils.
  - Current-clamp playback converts recorded current to NEURON units and uses distinct stimulus and simulation sampling controls.
  - Model-description axon_type, morphology, hoc files, channel files and recorded stimuli still need model-specific identity resolution.

