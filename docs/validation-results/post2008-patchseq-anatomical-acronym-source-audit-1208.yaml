claim_boundary: >-
  These authoritative records establish anatomical acronym semantics and common
  region ancestry. They do not independently verify each source specimen's
  tissue image, CCF placement, layer-boundary precision or annotation quality.
  Do not interpret ontology-tree depth or st_level as measured soma depth or
  cortical layer. Do not interpret bare VISp as L2/3 or L5, or include another
  visual area by a VIS prefix match. T-type layer enrichment is not an alternative
  source of per-cell layer assignment.
next_gate: >-
  A later sealed cohort may use exact author-provided structure labels with these
  definitions, retaining their source anatomical-provenance limits. Require
  source-supported class membership and independent recording identity before
  fitting; donor grouping, mapping confidence and source-coverage limitations
  remain distinct gates and must not be silently inferred from anatomy.
