interpretation: >-
  Both arms have exactly the same projection-026 source, weight, and arrival
  histories from mismatch onset through 23.6 ms. The last arrivals before the
  23.45-ms gate difference occur at 5.59 ms for targets 38/42 and 19.86 ms for
  target 40. A new delayed ligand arrival therefore does not initiate the gate
  contrast. In this implementation, however, the ongoing ligand waveform is
  multiplied by the source cell's current transmitter availability, and that
  resource depletes immediately when the source spikes, before its 1.0-ms
  delayed ligand update reaches the target. A source spike near 23.45 ms can
  therefore alter an existing target gate immediately while its corresponding
  arrival lies outside the 23.6-ms retention window.
closure: >-
  Exclude focal topology, compiled weights, delay, source selection, and source
  spike timing through 22.6 ms as causes of the first gate contrast. Do not
  select a transmitter, depletion, kinetics, or any numerical parameter.
next_gate: >-
