interpretation:
  - Projection delays and KInNeSS dual-exponential peaks execute within four integration steps of their analytic times; multiple near-synchronous sources explain the small shift.
  - Excitation depolarizes the proximal dendrite, but only 57 pA of axial current reaches the soma before the later inhibitory current dominates.
  - Halving the unreported capacitance does not recruit layer 2/3; reducing it to 0.1 uF/cm2 destabilizes the full network and still does not recruit the target.
  - Projection 031 cannot be weakened or removed merely to obtain the desired result because its parameters agree between the supplement and SMART.nml.
