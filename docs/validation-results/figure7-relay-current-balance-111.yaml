interpretation:
  - The learned expectation is executable and spatially selective, but expectation-only cells receive at most tens of picoamps of top-down current and remain below approximately -54.5 mV at the soma.
  - Directly driven image cells receive approximately 0.65 nA from the external input and generate full somatic action potentials. Thus the current implementation behaves as a five-location bottom-up selector in both conditions, not as the match-expanding relay field described by Figure 7.
  - TRN and interneuron inhibition are comparable to or larger than top-down current in expectation-only cells, but eliminating uncertainty in learned amplitude cannot solve the failure: placing both adaptive projections at every serialized maximum still recruits exactly the five bottom-up cells in each condition.
  - The official maximum-weight test raises each condition from 18 to 20 relay events but leaves TRN and nonspecific outputs identical. Missing Figure 6 learning amplitude is therefore excluded as the primary Figure 7 discrepancy.
  - No weight, inhibition, or spike threshold is tuned. Exact relay-clamp and source-profile alternatives are retained in earlier artifacts and also fail condition-dependent recruitment.
