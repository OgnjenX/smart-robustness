rationale: >-
  Artifact 205 rejects restoring any single inhibitory target compartment to
  the official 1.0 endpoint. Artifact 202 brackets the uniform transition
  between 0.01 (Figure 6 pass) and 0.03 (55-ms repeat failure). Test a finite
  one-axis-at-a-time intermediate grid around that transition. This is
  explicitly behavior calibration of unidentified legacy transfer semantics;
  no value is a source reconstruction.
