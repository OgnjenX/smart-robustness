stopping_rule: >-
  Reconstruct the exact registered runtime without simulating Figure 7 again.
  Inspect its executable scheduler and run one synthetic delayed-gate
  microprobe. If the gate becomes visible only on the integration step after
  its serialized arrival and the three early nonspecific events precede every
