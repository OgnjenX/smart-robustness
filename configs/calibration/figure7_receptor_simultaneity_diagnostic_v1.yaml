schema_version: 1
name: figure7_receptor_simultaneity_diagnostic_v1
classification: protocol-semantics-causal-diagnostic-not-source-recovery
base_profile: configs/calibration/figure6_declared_interneuron_input_v1.yaml
intervention:
  mode: prime_selected_category_arrival_at_stimulus_onset
  source_index: 40
  projection_ids:
    - modeldb112923.projection.003
    - modeldb112923.projection.005
    - modeldb112923.projection.006
    - modeldb112923.projection.007
    - modeldb112923.projection.009
    - modeldb112923.projection.012
protocol:
  duration_ms: 25.0
  dt_ms: 0.01
  top_down_current_pA: 800.0
  top_down_current_mode: until_cued_cell_first_event
  top_down_cue_lead_ms: 0.0
  uniform_relay_input_gain: 1.0
  projection_002_gain: 1.0
selection:
  required_gates:
    - match_horizontal_relay_set
    - mismatch_overlap_only
    - match_more_active_relay_cells
    - match_more_trn_events
    - all_six_expectation_records_primed
boundaries:
  - One selected-category arrival is initialized at all six corticothalamic receptor records exactly at sensory onset.
  - This collapses their first-event delay differences and is not a recovered legacy scheduler state.
  - The ordinary 800-pA category cue remains active so subsequent endogenous feedback is unchanged.
  - Actual fresh Figure 6 weights and the declared Relay_INT route are required.
  - No cue lead, current change, comparator, learned headroom, input/projection scaling, calcium ablation, or equilibration is permitted.
  - Failure closes receptor priming as a sufficient causal mechanism; success authorizes only a fresh 100-ms pair.
