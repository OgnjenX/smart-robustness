known_engineering_risks:
  - Stock Boost GBS dense output defaults control_interpolation to false and uses a separate acceptance factor10; neither may remain implicit.
  - Stock stepper controller fields are not a public lossless checkpoint format; serializing only five states is insufficient unless deterministic resets are part of every run.
  - Reinitializing a stock object may retain order history; a fresh-controller barrier must prove complete reset not just call a method named reset.
  - A high-order method can fail from stiffness interpolation error expensive arithmetic or growing trajectory errors; no speedup or convergence is assumed.
  - The independent high-precision forward route can dominate total cost and must be benchmarked on the same support.
  - Cached observations or unchanged event counts cannot replace whole-trajectory qualification.
  - Local CPU and memory limits were not successfully inventoried in this sandbox; do not invent worker counts or resource availability.
