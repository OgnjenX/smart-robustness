question: >-
  For every prospectively eligible Stage-3 L5 SST-like coordinate, does the
  route remain compatible with fresh expectation learning, post-learning
  match/mismatch and reset, match-versus-mismatch spectra, source-identifiable
  local gamma, and the higher-order inter-area low-frequency phenotype?

