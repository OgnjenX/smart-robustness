interpretation: >-
  The Figure-10-selected endpoint remains structurally and mechanistically
  coherent through learning and relay/TRN recognition. It reproduces the
  horizontal match, overlap-only mismatch, match-greater TRN activity, and
  match-greater effective inhibition of nonspecific thalamus. It does not
  reproduce the published Figure-7 rates: both conditions are one event low,
  at 3 versus the required 4 during match and 6 versus the required 7 during
  mismatch. Therefore the Figure-10 pass cannot be promoted as a jointly
  validated classic SMART baseline, and Figure 14 is not opened from this
  endpoint.
next_gate: >-
  Audit the provenance of every Figure-10 component carried into this pair
  before another simulation. In particular, projection-025 scale 8 was an
  effective isolated-cell diagnostic and its own connected endpoint was closed,
  not a recovered or selected SMART parameter. If that audit confirms the
  source/default projection-025 value is the only admissible correction, allow
  exactly one newly preregistered source-control cross that must jointly pass
  fresh Figure 6, fixed Figure 7, and the already fixed Figure-10 search-cycle
  gates. Do not fit a rate or interpolate projection 025.
boundary: >-
  The exact Figure-10 search-cycle result remains valid for its registered
  calibrated endpoint, but no single endpoint yet reproduces Figures 6, 7, and
  10 together. Official gamma/beta behavior, complete original SMART,
  promotion/freezing, neuron-model substitutions, and modern-anatomy variants
  remain incomplete and deferred.
