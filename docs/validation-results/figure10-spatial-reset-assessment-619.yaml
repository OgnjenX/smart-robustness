interpretation: >-
  The registered source-control identity repeats exactly. Nonspecific-thalamic
  input adds twelve peripheral layer-5 cells, but each emits only one event;
  the intact mismatch recruits 17 of 81 layer-5 cells rather than the paper's
  synchronized nonspecific wave. Projection 025 preserves this spatial support
  exactly and delivers finite current to all twelve peripheral layer-6I
  targets. Those dendrites remain between about -67 and -61 mV and their
  somata near -69 to -68 mV, so they generate neither dendritic nor somatic
  spikes. Only the five pre-existing winner-aligned layer-6I cells spike. This
  is genuine subthreshold filtering, not a missed event-detector crossing.
  The first missing spatial phenomenon is therefore broad sustained layer-5
  recruitment, followed by failure of its sparse one-event periphery to recruit
  layer 6I.
next_gate: >-
  Audit Figure 10's visible time axis and reset onset against the current
  100-ms pre-match plus 100-ms mismatch protocol. The published panel follows
  activity through 300 ms and depicts reset beginning around 175 ms, while the
  current assay stops at 200 ms total. If source-supported, preregister one
