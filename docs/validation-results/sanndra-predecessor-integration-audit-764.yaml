  release_scope: preserved 2001 predecessor, not SMART-era SANNDRA 1.2.0 RC2
  files:
    readme_sha256: 4ce81e7ecb728a96e2a1398c64e382a73c0340c2e3766846f1f67c5499396754
    sanndra_h_sha256: 82afaa9a28e8de8bf837b67237fafefacf6878fa08bb509a90eddf2a85408ca5
