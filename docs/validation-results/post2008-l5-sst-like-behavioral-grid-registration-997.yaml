execution_contract:
  figure7:
    required_for_every_repetition: true
    protocol_and_gates: inherited-unchanged-from-frozen-calibrated-profile
  figure10:
    required_only_if_same-repetition-figure7-passes: true
    protocol_and_gates: inherited-unchanged-from-sealed-search-cycle-runner
  exact_repeat:
    required: true
    definition: retained summaries after removing repetition index are exactly equal
  legacy_comparison:
    required_for_every_point: true
    reference: one exact normalized outcome from all four archived null-control outcomes
    definition: retained point summary after removing repetition index is exactly equal to reference
  reporting:
    report_all_12_points: true
    retain_gate_values: true
    retain_exact_differences_from_legacy: true
    no_point_selection: true

checkpoint_contract:
  atomic_write_after_every_repetition: true
  single_process_lock: true
  resume_identity_must_match_seal_and_runtime: true
  resume_order_must_match_registered_grid: true
  completed_points_may_not_be_recomputed: true
  incomplete_point_resumes_at_next_repetition: true
  completed_result_replay_must_be_noop: true
  checkpoint_does_not_authorize_unregistered_points: true

prospective_point_classification:
  exact_survival: >-
    Both repetitions pass Figure 7 and conditional Figure 10, are exact repeats,
    and the retained normalized summary is exactly equal to the archived legacy reference.
  robust_changed_survival: >-
    Both repetitions pass Figure 7 and conditional Figure 10 and are exact repeats,
    but at least one retained value differs from the archived legacy reference.
  failure: >-
    A required Figure-7 or Figure-10 gate fails in either repetition, or the two
    retained summaries are not exact repeats.
  engineering_stop: >-
    A seal, identity, construction, finite-value, checkpoint, or registered-order
    requirement fails. An engineering stop makes the region result indeterminate.

prospective_region_classification:
  invariant_region: all 12 points are exact_survival
  robust_region: all 12 points survive and at least one is robust_changed_survival
  mixed_region: at least one point survives and at least one point is failure
  no_survival_in_registered_region: all 12 points are failure
  indeterminate: any point is incomplete or has an engineering_stop

fixed_fields:
  - frozen classic baseline, profile and learned weights
  - existing populations, projections, intrinsic equations and external inputs
  - source population, target population, distal compartment and same-index topology
  - receptor reversal, rise and fall kinetics
  - all 12 resource-delay coordinates and their execution order
  - Figure-7 and Figure-10 protocols, analyses and gates
  - exact-repeat and legacy-comparison definitions

forbidden:
  - changing any resource, delay, gate or protocol after observing an outcome
  - stopping after a behavioral failure or reporting only surviving points
  - ranking or selecting a preferred point from network outcomes
  - interpreting coordinates as estimates of biological SST parameters
  - adding an explicit SST intrinsic neuron or another post-2008 intervention
  - combining PV-like, VIP-like, apical, thalamic-L5 or pulvinar modules
  - changing or overwriting the frozen classic baseline or archived controls

promotion_rule: >-
  Commit and test the checkpoint-resumable runner without executing a nonzero
  SMART outcome, then create and commit a separate cryptographic seal covering
  the runner, route implementation, registrations, controls, learned weights,
  baseline and relevant tests. Only that seal may authorize result 1000.

