interpretation:
  - Applying the variance interpretation globally, rather than selectively strengthening the two off-surround projections, preserves all five bottom-up relay cells in both conditions.
  - Both conditions retain the same 81-cell TRN startup volley and 60-Hz nonspecific output. The broader source-supported Gaussian interpretation therefore does not recover the two-against-one mismatch operation.
