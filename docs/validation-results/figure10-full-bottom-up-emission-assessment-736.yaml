  interpretation: >-
    The full sensory pattern recruits every vertical alternative in both arms
    before reset-specific competition can distinguish them. The intact pathway
    weakly suppresses the prior winner, but also reduces alternative output
    from 64 to 60 events and therefore supplies broad inhibition rather than a
    selective switch to a new winner.
source_interpretation:
  paper_constraint: >-
    Figure 10d/e and Section 2.7 require a previously active winner, previously
    inactive or weak alternatives with less-depleted layer-6I-to-4 resources,
    and a later reset wave that changes the competition in their favor.
  observed_static_top5_problem: >-
    The reconstructed top-five input mask keeps the orthogonal sensory features
    unavailable for the entire mismatch, so they cannot be reinstated.
  observed_identity_input_problem: >-
    Removing the mask from mismatch onset activates alternative layer-6I
    on-center output in both arms in the 10--20-ms bin and all four layer-4
    alternatives in the 20--30-ms bin. Thus those candidates are no longer a
    reset-specific inactive pool.
  resolved_conclusion: >-
    Neither permanent masking nor immediate full-pattern delivery expresses
    the source-described search-cycle ordering. The missing boundary is the
    lifecycle that keeps alternatives weak during the failed recognition state
    and reinstates bottom-up support after the reset eliminates that state.
  caution: >-
    The paper and recovered SMART.nml do not provide a numerical external-input
    release time or runnable simulation scheduler. A time or gain must not be
    fitted from this failed result.
