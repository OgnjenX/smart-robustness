inventory_contract: >-
  Read every row from the four explicitly whitelisted metadata projections,
  without filtering on class, region, layer, synaptic signs or availability of
  response records. Retain raw values and nulls. Reconstruct cell-to-experiment,
  experiment-to-slice and measured-location joins; reject duplicate primary
  IDs, retain missing parents, orphan locations and multiple locations as
  unresolved rather than selecting the first. Inventory exact joint label
  tuples without assigning biological eligibility or collapsing mixed labels.
  Cell target_layer is a separate placeholder, not a measured layer fallback.
execution_contract: >-
  Hash-check source and parent manifest first. SQLite read-only immutable and
  query_only; an exact table/column authorizer rejects all unlisted reads and
  mutations. Exclusive output directory prevents duplicate or overwritten
  snapshots. Preserve metadata failures without changing the source database.
next_gate: >-
  Independently verify all projected rows, joins, counts and joint labels.
  Then register exact species/area/class/layer interpretation and QC fields
  before outcome access; source fields alone cannot establish biological
  conductance validation or replace isolated VIP intrinsic physiology.
