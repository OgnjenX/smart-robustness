schema_version: 1
name: radial-annulus-gaba-gain-figure6-v1
status: registered-before-execution-exploratory-behavior-calibration
registration_artifact: docs/validation-results/radial-annulus-gaba-gain-registration-253.yaml
base_profile: configs/calibration/figure6_kinness_equation27_transition_v1.yaml
rationale: >-
  Artifact 250 shows the historical center-excluded Gaussian supplies the wrong
  pre-event inhibitory spatial ordering, while Artifact 252 shows that scalar
  TRN-to-relay gain cannot create overlap selection within that geometry. Cross
  the sole previously defined parameter-free annular geometry with a finite
  common gain on the existing nonuniform transfer scales, but consult Figure 6
  only. This is exploratory behavior calibration after closure of the original
  two-member source sensitivity; it is not recovered KInNeSS behavior.
fixed_detector: {arm_mV: -20.0, release_mV: -30.0}
runtime_overrides:
  projection_source_convention: paper_supplement_cross_checked
  ring_kernel_convention: radial_annulus
baseline_projection_scales:
  modeldb112923.projection.000: 0.01
  modeldb112923.projection.001: 0.01
  modeldb112923.projection.004: 0.03
scaled_projection_ids:
  - modeldb112923.projection.000
  - modeldb112923.projection.001
  - modeldb112923.projection.004
dimension:
  name: common_gain_on_nonuniform_trn_to_relay_scales
  control_gain: 1.0
  control_artifact: docs/validation-results/figure6-ring-kernel-radial-annulus-222.yaml
  grid: [1.125, 1.25, 1.5, 2.0, 3.0]
stage_1_protocol: {stimulus_ms: 55.0, dt_ms: 0.01, source_value: 120.0, category_source_value: 70.0}
stage_1_gate:
  relay_active_indices: [38, 39, 40, 41, 42]
  minimum_events_per_active_relay: 2
  trn_events: '>0'
stage_2_protocol: {stimulus_ms: 100.0, dt_ms: 0.01, source_value: 120.0, category_source_value: 70.0}
stage_2_gate:
  relay_event_count: 20
  relay_active_indices: [38, 39, 40, 41, 42]
  relay_events_per_active_index: 4
  relay_fresh_detector_cycles_per_active_index: 4
  feedforward_chain_complete: true
  causal_pair_in_learning_window: true
  bottom_up_horizontal_orientation: true
  minimum_top_down_horizontal_contrast: 0.01
selection_rule: lowest registered gain passing every Figure 6 gate; do not consult Figure 7 during selection
next_gate: >-
  If Figure 6 has a survivor, independently verify that sole selected endpoint
  and register a fresh aligned Figure 7 match. If none survives, reject this
  annular-transfer interaction without consulting Figure 7.
locked_holdouts:
  - figure7_match
  - figure7_mismatch
  - figure10_reset
  - figure14_spectra
  - figure15_local_synchrony
  - figure16_long_range_synchrony

