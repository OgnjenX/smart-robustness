methods:
  - The methods explicitly use the Gouwens et al. 2020 reference-taxonomy mapping-quality procedure.
  - Mapping uses a mouse VISp neuronal reference, hierarchical assignment and bootstrap sampling of cells and markers.
  - Inconsistent quality is defined by KL divergence greater than two or expression correlation less than 0.5.
  - Highly consistent quality requires the two highest mapping probabilities to sum above 70 percent and their ratio to exceed two; otherwise remaining calls are moderately consistent.
