interpretation: >-
  The exact Artifact-811 spike train and registered 53.026513-Hz estimate
  reproduce. Every preregistered source-plausible analysis remains between
  52.63 and 55 Hz. The high peak is therefore not caused by choosing the full
  rather than displayed correlogram, Hamming rather than boxcar taper, a
  correlogram periodogram rather than direct cross-spectrum, or the explicit
  200-ms Methods-4.10 segmentation. Analysis ambiguity does not rescue the
  graphical 44-Hz value. At the same time, all methods robustly reproduce the
  source-identifiable local gamma phenotype.
decision: >-
