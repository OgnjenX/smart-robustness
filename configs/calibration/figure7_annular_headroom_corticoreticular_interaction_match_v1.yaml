selection_rule: >-
  Retain every exact match survivor. Prefer the lowest headroom fraction, then
  the lowest common gain, for independent detector-cycle verification.
next_gate: >-
  Independently verify the lexicographically lowest exact match survivor with
  full TRN detector diagnostics. Register one fresh mismatch only if that
  verification passes; otherwise close this finite interaction surface.
