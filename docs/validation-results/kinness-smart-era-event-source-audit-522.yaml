  conclusion: >-
    The primary documentation makes an invented population-specific
    nonspecific detector less plausible: SMART.nml serializes no such
    population-level setting, and KInNeSS documents one axonal conversion from
    somatic potential to binary events. However, the exact SMART-era RC2 source
    archives and the spikeevents.h body were not preserved, so universality of
    the relay-derived falling -20-mV crossing cannot be claimed as proven.
