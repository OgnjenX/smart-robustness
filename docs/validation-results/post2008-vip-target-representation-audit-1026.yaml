  citation: Pfeffer CK, Xue M, He M, Huang ZJ, Scanziani M (2013). Inhibition of inhibition in visual cortex.
  doi: 10.1038/nn.3446
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3729586/
  inspected_section: Interneurons targeted by VIP cells; Figure 6
  preparation: mouse-visual-cortex-layers-2-3-and-5
  supported:
    - VIP preferentially inhibits SST cells among the tested classes.
    - VIP-to-SST inhibition is stronger in L2/3 than in L5 in this preparation.
  limits:
    - Postsynaptic charge and normalized individual contributions do not identify a SMART conductance, delay or population size.
    - The connectivity experiment does not identify a unique SST recruitment or intrinsic model.
    - Preferential targeting does not imply exclusive targeting or one universal VIP circuit.

