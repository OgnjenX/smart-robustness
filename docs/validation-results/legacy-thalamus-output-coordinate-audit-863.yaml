  confidence: strong
  rationale: >-
    The burst file begins and remains near +0.24 mV for more than one second
    without applied input even though the XML serializes E_leak=-70 mV. The
    monitored state is therefore not an absolute physical membrane voltage;
    it is the KInNeSS internal coordinate whose zero denotes rest. The XML
    Na/K offsets are expressed on that internal axis, while the relay T-type
    sigmoids retain absolute-voltage offsets near -63 and -83.5 mV and must be
    evaluated after adding the serialized leak value.
