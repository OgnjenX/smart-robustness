decision: >-
  The compiled conductance, area conversion, topology weights, and shared
  transmitter application match the recoverable source equations. The only
  untested, discrete source ambiguity directly affecting the localized
  inhibitory route is whether projection 036's serialized 1.5 spread is the
  variance named by KInNeSS Section 4.9 or the standard deviation suggested by
  the XML field name. Authorize exactly one projection-036-only variance cross
  under the otherwise unchanged event-locked lifecycle and pre-depletion
  emission candidate. This is a mixed-source sensitivity because a global
  variance interpretation previously failed Figure 6.
stopping_rule: >-
  Preregister one intact/control pair. Require every fresh Figure-6 gate,
  identical nonempty pre-reset states, no alternative event before the fixed
  marker, full post-marker input delivery, reset-chain recruitment, winner
  suppression, and strictly earlier intact alternative activation. A failure
  closes projection-036 spread without interpolation, weight compensation,
  global variance promotion, or another topology change.
boundary: >-
  This audit changes no executable quantity and recovers no legacy ring code.
  Even a behavioral pass would select only a calibrated mixed-source
  reconstruction for further holdouts; it would not prove exact KInNeSS
  recovery, original SMART, gamma/beta behavior, or authorize baseline freeze,
  neuron-model comparisons, or modern-anatomy variants.
