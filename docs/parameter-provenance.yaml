reference:
  citation: Grossberg and Versace (2008), Brain Research 1218:278-312
  doi: 10.1016/j.brainres.2008.04.024
  pdf: https://sites.bu.edu/steveg/files/2016/06/GroVer2008BR.pdf

status_definitions:
  published: copied from the primary paper or its supplement
  derived: algebraically derived from published quantities
  calibrated: fitted during an explicitly documented replication step
  exploratory: selected only to exercise software or formulate a hypothesis

parameters:
  model.network.first_order_structural_counts:
    value: 812 cells and 1950 compartments
    status: official-executable-source-and-paper-internal-derivation
    source: ModelDB 112923 SMART.nml; Methods 4.1; Table 3
    note: Methods 4.2 separately prints incompatible totals of 732 cells and 2106 compartments; those totals are preserved as a publication anomaly and do not control construction
  model.table3.catalog:
    value: 12 cell classes and 30 compartments
    status: published
    source: Main article Table 3
  model.intrinsic_cell_source:
    value: modeldb_112923 or paper_table3; must be selected explicitly
    status: official-source discriminator
    source: Main article Table 3 compared with ModelDB 112923 SMART.nml
    note: the sources differ in multiple dimensions, leaks, Na/K/Ca densities, and ionic reversals; selecting the paper profile replaces the whole cell specification and paper-wide E_Na=50, E_K=-90, E_Ca=180 rather than patching individual conductances
  model.table3.surface_area:
    value: pi * diameter * length
    status: published-simulator-convention
    source: Main article Methods 4.2 receptor-density expression; expanded KInNeSS manuscript Equations 2 and 9
    note: both KInNeSS equations divide by cylindrical lateral area pi*D*L; compartment end caps are excluded
  model.table3.specific_capacitance:
    value: required positive runtime parameter; current Figure 8 candidate uses 1 uF/cm2
    status: exploratory
    source: Main article and recovered XML do not state a numeric value
    note: an isolated recovered-TRN sweep from 0.2 through 50 uF/cm2 found no stable input-selective soma event; exact isolated projection-032 drive recruits layer 2/3 at 0.1 through 2 uF/cm2, ruling capacitance out as the cause of full-network cortical silence; see trn-capacitance-recruitment-056.yaml and figure6-cortical-ei-070.yaml
  model.table3.total_conductance:
    value: channel density * cylindrical lateral membrane area
    status: published-simulator-convention
    source: Main article Table 3 and Methods 4.2; expanded KInNeSS manuscript Equations 2 and 9
  model.calcium_density_rule:
    value: table3 or methods_global_250; must be selected explicitly
    status: conflicting-published-source
    source: Main article Table 3 compared with Methods 4.6 after Eq. 27
    note: Table 3 prints compartment-specific values including 10 mS/cm2 in relay and TRN dendrites, while Methods 4.6 states 250 mS/cm2 for every neuron with calcium current
  model.table3.leak_runtime_convention:
    value: use each cell compartment's Table 3 E_L as its leak reversal
    status: derived
    source: Table 3 caption; Methods 4.5 Eq. 20 has an unresolved E_leak=0 convention ambiguity
  model.classic_hh.e_na:
    value: 50 mV
    status: published
    source: Methods 4.5, equation discussion after Eq. 18
  model.classic_hh.e_k:
    value: -90 mV
    status: published
    source: Methods 4.5, equation discussion after Eq. 18
  model.classic_hh.spike_threshold:
    value: emit below 0 mV after the soma has exceeded +30 mV
    status: published
    source: Methods 4.4, Eq. 8 discussion
    note: artifacts 194--195 show that the apparent fresh-network TRN startup output is a pre-stimulus latched arm released by the sensory perturbation, not a new in-trial +30-mV crossing. It no longer supports promotion of the latched rule; the exact legacy detector remains unresolved and every startup-derived event must be labeled separately from stimulus-evoked output
  model.classic_hh.spike_event_coordinate:
    value: absolute_physical; relative_to_soma_leak and shifted_67_mV retained as rejected audit alternatives
    status: unresolved-source-coordinate
    source: Grossberg and Versace 2008 Equation 8; archived KInNeSS manual voltage-output convention and Soma editor
    note: shifted_67_mV maps the printed +30/0 thresholds to physical -37/-67 mV but emits no recovered TRN event under measured Figure 7 receptor drive; the manual independently fixes the source compartment to soma
  model.learning.postsynaptic_voltage_coordinate:
    value: absolute_physical +30 mV, absolute_physical 0/-20 mV, and leak-relative 0 mV retained as explicit alternatives
    status: unresolved-source-coordinate-rejected-as-figure6-explanation
    source: Grossberg and Versace 2008 Equations 1, 6, and 8; Versace et al. 2008 KInNeSS Equation 18
    note: artifacts 142--145 and 152 separate Equation 6's learning threshold from Equation 8's output event; absolute 0/-20 mV peaks at 0.15232/0.16854, leak-relative 0 mV peaks at 0.52741 but causes 58 relay events, and leak-relative +30 mV preserves confinement but peaks at only 0.18606; none reproduces Figure 6c's approximately 2.5 peak with confined 40-Hz bar recruitment
  model.learning.corticothalamic_gating_rule:
    value: serialized presynaptic gating; Methods 4.3 dual-AND retained as a rejected official-source alternative
    status: conflicting-official-source-tested
    source: Figure 6c caption and SMART.nml projections 005/007 versus Grossberg and Versace 2008 Methods 4.3
    note: artifact 146 shows dual-AND with absolute voltage peaks at 0.19319; artifact 147 crosses dual-AND with leak-relative voltage and peaks at 0.96876 but recruits 58 events across 43 relay cells; neither reaches the 2.0 gate with spatial confinement
  model.learning.postsynaptic_spike_timestamp:
    value: Equation 8 falling-phase emitted event; upward +30-mV crossing retained as a rejected Equation 6 alternative
    status: source-timing-ambiguity-tested
    source: Grossberg and Versace 2008 Equations 6 and 8
    note: artifact 151 timestamps Equation 6 at upward threshold while retaining falling-phase axonal emission; all population counts remain unchanged, but the combined peak falls from 0.11853 to 0.10750 because the depression tail starts earlier
  model.classic_hh.kinness_spike_threshold:
    value: framework alternative with V_theta=-20 mV and event release below 0 mV
    status: published-executable-framework-alternative
    source: Versace et al. 2008 KInNeSS expanded manuscript, Equation 14
    note: Grossberg and Versace 2008 instead prints +30 mV; SMART.nml does not serialize the simulator-wide event threshold; literal and hysteretic implementations are rejected by isolated recovered-TRN assays
  model.classic_hh.spike_event_rule:
    value: latched_peak_then_zero, literal_previous_sample, or hysteretic_threshold_then_zero; must be selected explicitly
    status: source-ambiguity
    source: Grossberg and Versace 2008 Equation 8; Versace et al. 2008 KInNeSS Equation 14; SANNDRA spikeevents.h revision history
    note: visual inspection confirms the literal rule uses current V(t)<0 after immediately preceding V(t-dt)>V_theta; the 2008 detector source body is unavailable, and SANNDRA revision 1.2 only records that proper spike detecting was fixed
  model.classic_hh.integration_timestep:
    value: 0.01 ms project default; must remain protocol-explicit
    status: source-unreported-numerically-audited
    source: Grossberg and Versace 2008 Methods 4.4, 4.9, and 4.12; archived KInNeSS Computational Preferences manual
    note: the paper reports epoch lengths but no integration step, and KInNeSS stores it as a user preference rather than in SMART.nml; literal +30-mV detection yields no event at every finite tested step from 0.005 through 0.05 ms
  model.classic_hh.trn_t_type_calcium:
    value: activation exponent 2; m_inf V0=-52/B=7.4; h_inf V0=-80/B=-5; Reticular_Tau parameter sets (1,0.33,27,102,10,-15) and (28.3,0.33,48,407,4,-50)
    status: official-executable-source
    source: ModelDB 112923 SMART.nml and Versace et al. 2008 KInNeSS Table 2
    note: distinct from the relay/matrix/nonspecific exponent-3 Simple_Tau family
  model.classic_hh.calcium_kinetics_source:
    value: modeldb_112923 or paper_2008; must be selected explicitly
    status: conflicting-official-source
    source: ModelDB 112923 SMART.nml compared with Methods 4.6 Equations 21-27
    note: SMART.nml gives TRN a distinct exponent-2 Reticular_Tau family, while the paper applies one exponent-3 family to matrix, relay, TRN, and nonspecific cells
  model.classic_hh.reticular_gate_initialization_coordinate:
    value: absolute membrane voltage
    status: official-executable-source
    source: ModelDB 112923 SMART.nml uses absolute-voltage Sigmoid and Reticular_Tau equations during runtime; initialization must evaluate the same equations in the same coordinate
  model.classic_hh.e_leak:
    value: cell-specific; M0 cortical reference uses -65 mV
    status: published
    source: Table 3; M0 corresponds to cortical excitatory cell classes
  model.classic_hh.rate_voltage_shift:
    value: V_rate = V_membrane - E_leak for the executable KInNeSS baseline; fixed +67 mV retained as a paper-audit alternative
    status: derived
    source: contemporaneous KInNeSS 0.3.2 documentation defines zero voltage as intracellular resting potential; XML Na/K offsets use this coordinate
  model.multicompartment.nak_rate_convention:
    value: printed_smart or standard_traub_miles; must be selected explicitly
    status: derived
    source: Methods 4.5 Eqs. 15 and 18 compared with the standard Traub-Miles form
  model.multicompartment.t_type_gate_convention:
    value: modeldb_112923, printed_literal, or reciprocal; must be selected explicitly
    status: derived
    source: ModelDB 112923 resolves m_inf/tau roles; Methods 4.6 remains an audit alternative
  model.multicompartment.gate_initialization:
    value: steady_state_at_initial_voltage; zero retained as an audit alternative
    status: archived-simulator-cvs executable convention
    source: SANNDRA CVS revision history for gates.h revision 1.17 and unit.cpp revision 1.29 states that TGate.init resets to resting potential; Methods 4.9 initializes membrane compartments at Table 3 values, while the KInNeSS manual warns that voltage-gated channels shift actual rest away from the configured leak equilibrium
    note: steady-state occupancy at the initialized Table 3 voltage is the current executable interpretation of the surviving revision message; direct source for TGate.init remains unavailable. Artifacts 194--195 show that a cold network can preserve a detector arm across equilibration and release it only after stimulation, whereas a same-network Figure 6 episode consumes the latch and leaves TRN stimulus-silent. Initialization-latch releases are excluded from behavioral resonance evidence
  model.multicompartment.membrane_initialization_coordinate:
    value: physical_leak_voltage or kinness_internal_zero; must be selected explicitly
    status: source-ambiguity
    source: Methods 4.9, Table 3, and KInNeSS output-voltage footnote 12
    note: the internal-zero alternative is retained for audit but fails the Figure 7 network discriminator
  model.multicompartment.calcium_voltage_coordinate:
    value: integrated_voltage or internal_zero_plus_serialized_leak; must be selected explicitly
    status: source-ambiguity
    source: ModelDB 112923 absolute-voltage T-current parameters compared with KInNeSS output-voltage footnote 12
    note: separates the voltage used by T-current kinetics from the membrane-coordinate driving force; the split-coordinate alternative fails the Figure 7 network discriminator
  model.multicompartment.axial_convention:
    value: population-resolved source pairing (archived relay uses kinness_serialized_edge; paper Table 3 populations use paper_literal Equation 2)
    status: paper/archive composite executable convention
    source: SMART.nml relay compartment edges; Grossberg and Versace 2008 Equation 2 and Table 3
    note: the pairing reproduces four events per active relay, the complete cortical chain, and the orientation shape of both Figure 6 maps; artifact 196 confirms that each relay event has its own +30-to-0-mV arm/release cycle and that an unstimulated control remains unarmed. Artifact 193 retracts the former absolute-amplitude gate because the paper provides no numeric Figure 6c matrix and the colorbar endpoint is not an observed map value. The later Equation-27 transition candidate reaches an approximately 0.893 combined adaptive peak, but only normalized shape is source-verifiable. Applying paper_literal globally overdrives relay cells to seven events each, while applying KInNeSS globally prevents the cortical chain
  model.connectivity.gaussian_weight_convention:
    value: source_peak with resulting-weight cutoff at 0.001
    status: archived-simulator-manual executable convention
    source: archived 2008 KInNeSS User Manual, Network Manipulations / Connect from many
    note: the manual says Weight is the Gaussian peak and shoulders below 0.001 are cut; normalized_density is retained only as the superseded Figure 6b inference
  model.connectivity.gaussian_spread_convention:
    value: standard_deviation or variance; must be selected explicitly
    status: source-ambiguity
    source: SMART.nml sigma_x/sigma_y field names versus KInNeSS Section 4.9 variance wording
    note: the variance alternative creates a causal Figure 6 pair but fails the cortical-chain and Figure 6c contrast gates; standard_deviation remains active
  model.connectivity.ring_kernel_convention:
    value: center_excluded_gaussian historical control or radial_annulus sensitivity
    status: source-ambiguity-preregistered-sensitivity
    source: archived KInNeSS User Manual and Artifact 220 source-recovery audit
    note: >-
      The manual and recovered examples do not define ring=true. The historical
      project convention removes only the colocated Gaussian sample. The sole
      new candidate uses u*exp(1-u), with u fixed by serialized sigmas and no
      fitted radius. Neither convention is represented as recovered legacy
      behavior; Artifact 221 fixes the two-member family and stopping rule.
      Artifact 222 rejects radial_annulus before Figure 7: it produces five
      emitted events in each of the correct five relay cells, rather than four,
      and fails both the event-count and fresh-detector-cycle Figure 6 gates.
      No third geometry or fitted ring radius is authorized.
  model.learning.gaussian_bounds_convention:
    value: Figure 6 pathway-specific (bottom-up projection-level baseline; corticothalamic Gaussian-scaled baseline with projection-level maximum)
    status: paper-supported executable convention
    source: KInNeSS Sections 4.9 and 4.10; Grossberg and Versace 2008 Figure 6b
    note: Figure 6b initializes the bottom-up map at the serialized maximum, while Figure 6c's approximately 0--0.3 before-learning scale identifies Gaussian-scaled 0.05 baselines for both adaptive corticothalamic AMPA fields; their upper bounds remain projection-level
  model.multicompartment.zero_sensitivity_input_convention:
    value: framework_resting_leak or omit_all_zero; must be selected explicitly
    status: exploratory
    source: expanded KInNeSS Eqs. 5-7 state that an inactive input acts as extra leakage, but archived SMART contains large all-zero input channels whose executable legacy treatment is unavailable
  model.multicompartment.trn_soma_potassium_density_calibration:
    value: optional explicit density; registered rejected grid 20--80 mS/cm2
    status: rejected-behavior-calibration
    source: Table 3 specifies 100 mS/cm2 and SMART.nml specifies 80 mS/cm2; artifact 197 tests lower values only as a legacy-runtime hypothesis
    note: all controls are post-startup quiet and all driven trials are finite, but none emits under the registered peak-held Figure 7 receptor-gate assay; no below-source value is promoted, and conductance-drive nonmonotonicity prevents extending this result to every transient waveform
  model.multicompartment.trn_soma_sodium_density_calibration:
    value: optional explicit density; registered rejected grid 100--400 mS/cm2
    status: rejected-behavior-calibration
    source: Table 3 and SMART.nml both specify 100 mS/cm2; any alternative is a legacy-runtime sensitivity hypothesis rather than a published SMART value
    note: all controls are post-startup quiet and all 36 density-by-drive trials are finite, but the best soma peak is approximately +14.65 mV and no trial completes a +30-to-0-mV detector cycle; no alternative advances to a connected test
  model.multicompartment.trn_spike_event_release_voltage_calibration:
    value: optional TRN-specific release voltage; published pair +30/0 mV plus registered arm/release probes -35/-45 through +30/+20 mV
    status: rejected-behavior-calibration
    source: Grossberg and Versace 2008 Methods 4.3 specifies event detection after a +30-mV peak and return to 0 mV; artifact 200 tests alternatives only because the legacy spikeevents.h implementation remains unavailable
    note: the published +30/0-mV pair produces no fresh isolated cycle in the registered peak-held assay; four non-source pairs (-35/-45, -30/-40, -25/-35, and -20/-30 mV) survive the isolated gate, but all fail the mandatory Figure 6 prerequisite by reducing the five active relay cells from four events each to one and recruiting 489--525 TRN events. No alternative is promoted or tested on Figure 7
  model.connectivity.trn_to_relay_gaba_transfer_calibration:
    value: optional common scale on ModelDB projections 000, 001, and 004; registered grid 0.001--1.0, Figure 6 survivor 0.01
    status: rejected-uniform-behavior-calibration
    source: Grossberg and Versace 2008 Supplementary Table 3 and SMART.nml agree on the unscaled projection values; no surviving source identifies a lower gain
    note: with the calibrated -20/-30-mV TRN detector, 0.01 is the sole registered uniform scale that preserves the source-supported Figure 6 relay train, genuine relay detector cycles, cortical chain, causal learning pair, and oriented maps. Same-network match passes, but mismatch retains all five vertical relay cells and produces more rather than fewer TRN events, so the uniform transfer mechanism is rejected and not promoted
  model.connectivity.trn_to_relay_gaba_compartment_source_endpoints:
    value: restore one of soma, proximal-dendrite, or distal-dendrite projection scales to source value 1.0 while holding the other two at calibrated 0.01
    status: rejected-source-endpoint-discriminator
    source: SMART.nml projections 000, 001, and 004; Grossberg and Versace 2008 Supplementary Table 3
    note: every one-at-a-time source restoration yields five relay and 392 TRN events in the 55-ms Figure 6 prerequisite, so none advances to a full learning episode or Figure 7
  model.connectivity.trn_to_relay_gaba_compartment_intermediate_calibration:
    value: somatic 0.01, proximal 0.01, distal 0.015 times the published ModelDB projection weights
    status: rejected-behavior-calibration
    source: preregistered artifact 206 grid over projections 000, 001, and 004; no surviving source identifies these scales
    note: distal 0.015 is the sole registered complete Figure 6 survivor and passes same-network match, but mismatch retains all five vertical relay cells, increases TRN output from 558 to 566 events, and decreases nonspecific output from 9 to 8 events. It is rejected by the official Figure 7 directional contract and is not promoted
  model.connectivity.projection022_source_resolution:
    value: layer23_excitatory_v1 to layer6ii_excitatory_v1 distal dendrite, one-to-one
    status: source-resolution-figure6-supported
    source: Grossberg and Versace 2008 Supplementary Table 3 and the SMART.nml channel name AMPA 2/3, contrasted with the archived layer4_inhibitory_v1 presynaptic endpoint
    note: the supplementary endpoint preserves every calibrated Figure 6 gate. Its apparent Figure 7 TRN-order correction in the contiguous protocol was caused by residual training state; after a fresh learned-weight handoff, match/mismatch TRN output is 559/567 and the complete Figure 7 candidate fails. Retain the source resolution for Figure 6, but do not claim a Figure 7 mechanism
  model.connectivity.projection022_distal002_interaction:
    value: Supplementary projection-022 endpoint with distal TRN-to-relay GABA scale 0.02 and somatic/proximal scales 0.01
    status: rejected-contiguous-state-figure7-candidate
    source: discrete cross of the source-resolved endpoint with the already registered Artifact 206 distal-0.02 candidate
    note: Artifact 212 passes every Figure 6 gate, and Figure 7 retains match-greater TRN output at 522 versus 520 events, but mismatch activates the nine-cell union and nonspecific output is 5 versus 5. The four expectation-only mismatch spikes precede causal feedback arrival and expose residual Figure 6 dynamic state; this contiguous-state candidate is rejected and further distal interpolation is closed
  protocol.figure7.learned_state_handoff:
    value: reproduce Figure 6 learning, rebuild a fresh identical network, and transfer only the required learned projection weights
    status: promoted-protocol-correction
    source: Figure 6 and Figure 7 are distinct published protocols; causal arrival audit of Artifact 214 proves that contiguous-state expectation-only events precede possible recognition feedback
    note: fresh handoff removes all four contaminated horizontal mismatch-arm events. Artifact 216 cleanly localizes the remaining failure to four repeated events in every vertical bottom-up relay cell, with mismatch TRN and nonspecific directions still wrong
  protocol.figure7.receptor_arrival_alignment:
    value: 7.85-ms one-event cue lead aligns the first archived layer-6II-to-relay NMDA arrival with bottom-up stimulus onset
    status: source-derived-protocol-candidate-rejected-at-match
    source: Grossberg and Versace 2008 Section 2.3 and Figure 7; SMART.nml projection 003 delay; Artifact 237 preregistration
    note: Artifact 238 records one selected-category event at 5.85 ms with no cue-lead relay event, but the matched bar is over-suppressed to two events per relay cell and nonspecific output rises to 60 Hz; mismatch remains locked
  protocol.figure7.aligned_learned_on_center_headroom:
    value: source-40 projection-005/007 weights scaled shape-preservingly toward the first serialized adaptive bound
    status: bounded-match-survivor-awaiting-diagnostic-verification
    source: unpublished numeric Figure 6c state; SMART.nml adaptive maxima; Artifacts 239--240
    note: registered fractions 0.25/0.5/0.75 retain 60-Hz nonspecific output, while the hard-bound factor 3.366392 yields the exact 40-Hz match with three events in each horizontal relay cell; Artifact 241 locks mismatch pending a full detector-cycle rerun
  model.connectivity.projection022_distal003_interaction:
    value: Supplementary projection-022 endpoint with distal TRN-to-relay GABA scale 0.03 and somatic/proximal scales 0.01
    status: rejected-behavior-calibration
    source: final exact endpoint of the grid registered in Artifact 206 before the clean Figure 7 result
    note: Artifact 217 passes every Figure 6 gate and Artifact 218 passes clean match. In Artifact 219, match/mismatch each produce 20 relay events in five cells; all five vertical mismatch cells emit four times. The TRN direction becomes correct at 558 versus 534 events, but nonspecific output remains wrong at 6 versus 5. The complete distal family is closed with no stronger or interpolated value authorized
  model.multicompartment.exact_voltage_clamp:
    value: optional fixed compartment voltage, separate from finite-conductance XML input
    status: published-protocol alternative
    source: Methods 4.9 calls the relay stimulus a fixed -12 mV voltage clamp; KInNeSS Table 1 distinguishes finite input conductance from its infinite-conductance clamp limit
  model.multicompartment.ahp_convention:
    value: paper_text or modeldb_112923; must be selected explicitly
    status: derived
    source: Methods 4.7 compared with ModelDB 112923 Layer_5_and_Maynert_AHP_ACh.nml
  source.modeldb112923.archive:
    value: sha256 5fc6e0042ef093665ad2f1c24c87f9cc0d796629c896ee8a4efe34827a4462c5
    status: published
    source: https://modeldb.science/download/112923
  model.multicompartment.ahp_max_conductance:
    value: required runtime calibration parameter for layer-5 cells
    status: calibrated
    source: Methods 4.7 reports waveform time constants but no unique maximal conductance
  validation.figure8.first_candidate:
    value: tonic pass, burst fail (29 versus 28 spikes in the 300 ms pulse)
    status: exploratory
    source: predeclared Figure 8 harness; candidate run retained as a negative result
  validation.figure8.modeldb_candidate:
    value: tonic fail, burst pass (1 versus 2 qualifying spikes in the 300 ms pulse)
    status: exploratory
    source: ModelDB source-specific cell, corrected absolute-voltage T-gate initialization, predeclared scorer
  synapse.shape:
    value: normalized dual exponential
    status: published
    source: Methods 4.2, Eq. 3
  synapse.resource_target:
    value: 1
    status: published
    source: Methods 4.4, Eq. 7; Versace et al. (2008) KInNeSS expanded manuscript, Equation 17
  synapse.resource_spike_jump:
    value: z_after = z_before * (1 - epsilon)
    status: published-simulator-convention
    source: Versace et al. (2008) KInNeSS expanded manuscript, Equation 17 and its explanatory paragraph
    note: the prose states that transmitter depletes by -epsilon*z at every spike; therefore epsilon=1 fully depletes the resource. The exponential impulse solution z*exp(-epsilon) is not the stated KInNeSS event update.
  protocol.match_mismatch.top_down_current:
    value: required explicit pA amplitude applied to one central layer 6II soma
    status: not-identifiable
    source: Methods 4.9 specifies somatic current injection but reports no amplitude; Figure 7 fixes a horizontal learned expectation for both conditions
    note: the archived blue=70 TD INPUT is subthreshold in the isolated source-profile cell; Artifact 225 reopens the unchanged registered 600/800/1000-pA grid because the upstream candidate now has source-resolved category feedback, fresh learned-state handoff, and condition-dependent genuine TRN output. Only 800 pA passes complete clean match with exactly 4 nonspecific events (40 Hz); 600 and 1000 pA each produce 6. Artifact 227 rejects the fixed 800-pA pair: mismatch produces 5 rather than 7 nonspecific events, retains all five vertical relay cells, and has 559 TRN events just like match. No interpolation or expansion is authorized
  protocol.match_mismatch.top_down_current_mode:
    value: sustained_epoch historical control or until_cued_cell_first_event sensitivity
    status: source-ambiguity-preregistered-sensitivity
    source: Methods 4.9 leaves current duration unspecified; Figure 9a explicitly stimulates the central layer-6II cell until one spike in a related complete-module protocol
    note: Artifact 228 registers one parameter-free match-only sensitivity at the already selected 800 pA. Artifact 229 clears the current at the first cell-40 event (5.85 ms) and passes exact match with 25 relay, 570 genuine-cycle TRN, and 4 nonspecific events. Artifact 231 rejects the fixed pair: mismatch has 20 relay events across all five vertical cells, 557 TRN events, and 4 nonspecific events. The waveform corrects TRN ordering but not overlap selection or 70-Hz disinhibition; this family is closed. Figure 9a is source-adjacent rather than proof of the Figure 7 waveform
  protocol.match_mismatch.selected_category_relay_output_mask:
    value: optional diagnostic source-index mask on projections 003, 005, 006, and 007
    status: causal-diagnostic-not-source-reconstruction
    source: Artifact 231 trace plus Figure 7's conceptual selected top-down expectation
    note: Artifact 232 preregisters only source cell 40 as a causal intervention after nonselected vertical layer-6II cells were observed to reactivate the same mismatch relay cells. Artifact 233 passes the exact match prerequisite with 25 relay, 570 genuine-cycle TRN, and 4 nonspecific events. Artifact 235 rejects the fixed mismatch with 20 relay events across all five vertical cells, 555 TRN events, and 4 nonspecific events; the mask is not sufficient and is closed without promotion
  validation.figure7.rate_tolerance:
    value: exact 100-ms targets of 40 Hz match and 70 Hz mismatch; zero event-count tolerance
    status: published-rendered-figure
    source: Grossberg and Versace 2008 Figure 7c; rendered-page audit Artifact 223
    note: the labels are embedded in the figure and absent from caption text; four and seven visible spikes make the deterministic event-count targets explicit
  benchmark.population_sizes:
    value: see configs/*.yaml
    status: exploratory
    source: reduced software benchmark; not a paper parameter
  model.classic_hh.reference_soma_totals:
    value: C=78.54 pF, gNa=3927 nS, gK=2356 nS, gL=3.93 nS
    status: derived
    source: Table 3 layer 2/3 excitatory soma dimensions and channel densities; cylindrical area pi*D*L
  benchmark.connection_weights:
    value: see configs/*.yaml
    status: exploratory
    source: reduced software benchmark; not a paper parameter
  supplement.first_order_connections:
    value: recovered; transcription into executable projection specs pending
    status: published
    source: Elsevier attachment 1-s2.0-S0006899308008883-mmc1.doc
