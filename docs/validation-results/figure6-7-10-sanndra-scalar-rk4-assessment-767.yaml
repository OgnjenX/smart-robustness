interpretation: >-
  Per-equation frozen-state RK4 materially changes the connected dynamics, so
  simulator semantics are not irrelevant. It does not provide a jointly valid
  reconstruction: match gains two nonspecific events while mismatch remains at
  six, the required match-greater-than-mismatch TRN-GABA relation reverses, and
  the reset pathway increases rather than suppresses winner output. Exact
  rates and reset therefore cannot be recovered by replacing coupled RK4 with
  this source-adjacent endpoint.
decision: >-
  Reject and close sanndra_scalar_rk4 as a classic-baseline endpoint. Keep the
  implementation default-off as a documented robustness comparator. Do not
  average, interpolate, or tune between integration methods. The unavailable
  SANNDRA 1.2.0 RC2 source remains an epistemic limitation, not a license to
  label this predecessor behavior as official SMART.
next_gate: >-
  Source recovery and one-at-a-time bounded source alternatives have not
  produced a joint Figure-6/7/10 survivor. Proceed only through an explicitly
  declared joint calibrated-reconstruction phase that keeps the official
  qualitative/quantitative targets fixed, separates calibration from holdout
  figures, and reports every departure from released source values. Figures
  14--16 remain unopened holdouts until a joint first-order candidate passes.
