interpretation: >-
  The unchanged source-control pair passes all fresh Figure-6 gates and exactly
  reproduces every registered Artifact-622 population count. Peripheral cell
  0 receives no projection-023 relay input and no projection-024 layer-2/3
  input in either arm. The intact reset path adds one projection-025 envelope
  with a 541-pA peak and 3,014-pA-ms integral; it depolarizes the proximal
  dendrite by only 3.00 mV and the soma by 1.43 mV. The soma still peaks at
  -68.52 mV, leaving 48.52 mV of headroom to the -20-mV event threshold. The
  1.26-ms dendritic and 3.68-ms somatic lags after peak projection-025 current
  are ordinary membrane integration, not evidence of a missed local
  coincidence: there are no other local synaptic inputs with which to
  coincide. Active cells 31 and 40 instead receive one to two orders of
  magnitude more integrated drive from projections 023/024, and changing
  projection 025 between causal arms changes neither one's event count. The
  Figure-10 failure is therefore localized to insufficient isolated
  layer-5-to-layer-6I drive at peripheral targets in this reconstruction, not
  a small threshold miss or downstream reset transfer. No effective value is
  selected from this observational result.
next_gate: >-
  Implement a default-off, lossless layer-6I replay capture for intact
  peripheral cell 0 at mismatch onset, including all intrinsic dynamic state
  and the integrator-visible projection-023/024/025 gate histories. First
  prove that an isolated source-control cell reproduces the captured voltage
  and event train exactly. Only after that identity gate passes may a separate
  preregistration define a powers-of-two projection-025 gate/weight-equivalent
  scale bracket to locate the first-spike transfer boundary. Keep event
  multiplicity versus synaptic-strength interpretations distinct, and do not
  alter the connected network yet.
