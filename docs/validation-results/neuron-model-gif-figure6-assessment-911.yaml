  interpretation: >-
    The fixed literature transfer and the network-blind current-step-matched
    stochastic GIF both fail to preserve the frozen SMART learning
    prerequisite in every registered seed. Current-step matching substantially
    restores downstream activity and usually produces positive top-down
    contrast, but not the source-selective repeated relay volleys, layer-4-led
    cortical chain, or causal learning pair needed for a valid learned state.
    This is evidence about the two registered GIF parameter arms, not proof
    that no GIF formulation can support ART behavior.
