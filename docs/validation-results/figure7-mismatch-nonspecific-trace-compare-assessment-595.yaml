interpretation: >-
  Both independently learned arms repeat every registered Figure 6 and mismatch
  identity gate. At the comparable third late detector maximum, dendritic
  T-type calcium, direct input, and layer-6II excitation are nearly identical.
  The repaired-TRN arm instead receives substantially stronger TRN GABA in all
  three nonspecific compartments and never develops the control arm's fourth
  late positive detector maximum. The missing seventh event is therefore best
  localized to the corrected inhibitory envelope, not a primary failure of
  intrinsic T-current recovery. This is a causal-routing diagnostic, not a
  parameter fit; both candidates remain closed and unfrozen.
