rationale:
  - >-
    Source-constrained calibration reproduces Figure 7 match twice but gives
    every orthogonal mismatch arm the same three relay events; scalar
    inhibitory capacity and source-derived ring geometries do not restore
    overlap-only recruitment.
  - >-
    Exact legacy spike-event and ring transfer semantics are unavailable. The
    next admissible step is therefore an explicitly labeled mesoscopic
    reconstruction, kept separate from recovered SMART equations.
  - >-
    The reconstructed signal is local coincidence support derived solely from
    the selected source row of learned adaptive projections 005 and 007. It
    receives no condition, orientation, overlap, or target-count label.
registered_dimension:
  comparator_floor_grid: [0.0, 0.25, 0.5, 0.75]
  uniform_control_floor: 1.0
  candidate_count: 4
  selection_rule: highest exact-match survivor minimizes intervention
equation: gain[target] = floor + (1-floor) * learned_support[target]/max(learned_support)
scope_boundary:
  classification: calibrated-reconstruction-not-recovered-source
  affects: active bottom-up relay pixels during Figure 7 recognition only
  leaves_unchanged:
