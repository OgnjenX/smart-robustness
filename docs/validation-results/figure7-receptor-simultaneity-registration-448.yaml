  The bounded category-current family fails because learned feedback reaches
  LGN after the first relay volley. The primary paper defines the match
  mechanism at the receptor level: matched LGN cells receive sufficiently
  large simultaneous bottom-up and top-down excitation while the TRN supplies
  the off-surround. Priming one selected-category arrival at all six archived
  on-center/off-surround receptors at sensory onset tests whether that missing
  receptor-level simultaneity is causally sufficient.
