source_evidence:
  paper: Grossberg and Versace 2008, Figure 7 and Section 2.3
  constraint: >-
    The comparison requires sufficiently large simultaneous bottom-up and
    learned top-down excitation at matched LGN cells against TRN inhibition.
  underidentification: >-
    The public NML and supplement specify projection records but not a complete
    executable protocol state that makes the learned vote causal before the
    first sensory relay event; exact KInNeSS ring semantics also remain absent.
prior_evidence_disclosed: >-
  Artifact 321 showed that the same five-target learned-field transform gives
  the correct qualitative relay/TRN ordering but 4/5 rather than 4/7 output in
  an earlier runtime. Artifacts 535--543 independently selected effective T
  scale 0.1875 from match and then showed that it cannot create spatial
  comparison without a comparator. The present cross is therefore confirmatory
  only with respect to their interaction, not an independent holdout.
acceptance_rule: >-
  The fresh Figure 6 handoff must pass all fixed gates. Match must activate
  exactly relay cells 38--42 for 20 events and emit four nonspecific events.
  Mismatch must activate only overlap cell 40, produce fewer relay and TRN
  events than match, and emit exactly seven nonspecific events. Every condition
  uses the identical registered runtime and transform.
failure_rule: >-
  Any failed gate closes this cross. Do not interpolate T density, alter the
  comparator cardinality, change event thresholds, or retune from mismatch.
classification_boundary: >-
  A pass is calibrated Figure 7 behavioral reproduction under an explicit
  mesoscopic learned-coincidence reconstruction. It is not recovered original
  SMART source, does not authorize the original-baseline label, and only
  permits separately preregistered downstream behavior tests.
