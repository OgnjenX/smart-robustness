point_and_region_classification:
  complete_progression_survival: all four substages pass at the point
  bounded_partial_survival: stage4a passes but one or more later phenotype substages fail
  learning_or_first_order_failure: stage4a fails regardless of later characterization
  engineering_stop: identity, seal, construction, finite-value, checkpoint or exact-repeat requirement fails
  region_rule: >-
    Report all seven point classifications and the complete joint pattern. Do
    not interpolate, rank, average, rescue, or reduce the region to one point.

fixed_fields:
  - frozen classic baseline, runtime conventions, projection scales and comparator
  - all seven Stage-3-eligible delay-resource coordinates and their order
  - intervention topology, receptor, kinetics, target compartment and nonplastic status
  - Figure-6, Figure-7, Figure-10, Figure-14, Figure-15 and Figure-16 protocols and gates
  - Figure-15 pair, estimator, source-identifiable gamma band and retained 44-Hz diagnostic
  - Figure-16 geometry, bands, delay, field reduction and complete-network catalog
  - two exact repetitions per point per substage

forbidden:
  - selecting only one or a subset of the seven eligible points
  - changing a delay, resource, route, learning rule, gate, protocol, pair, band or geometry after an outcome
  - dropping a point from later substages because an earlier substage failed
  - treating a later pass as compensation for an earlier failure
  - adding an explicit SST neuron, VIP-like route, intrinsic-class replacement or another modern module
  - combining the route with direct thalamic-L5, active-apical or updated-pulvinar interventions
  - modifying or overwriting the frozen classic baseline or prior results

promotion_rule: >-
  Implement Stage 4A with zero-outcome tests, commit it, and create a separate
  hash seal before executing result 1004. Assess all seven Stage-4A points
  before implementing Stage 4B. Repeat this implementation/seal/assessment
  boundary for Stages 4B, 4C and 4D.

next_step:
  - Implement only the checkpoint-resumable Stage-4A runner and its contract tests.
  - Verify all source, identity, ordering and no-selection invariants without executing a Stage-4A network outcome.
  - Commit the implementation and create a separate pre-outcome execution seal.
