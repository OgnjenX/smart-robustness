interpretation: >-
  Sensory excitation and adaptive top-down excitation terminate on different
  dendritic compartments, while TRN inhibition targets all three compartments.
  A sum of all TRN gate variables is not a local membrane current balance.
  Over this explicitly post-hoc two-ms reference window, cell22 has higher
  TRN-gate endpoints at its positive soma crossing, whereas cell31 has lower
  endpoints. A universal description of all unwanted events as immediate
  inhibitory-conductance decay is therefore unsupported by these endpoints.
  This does not exclude an earlier trough, a transient within the window, or
  a role for inhibitory timing in either cell. The sampled crossing occurs on
  the action-potential rise and does not identify its initiation mechanism.
