  - Whole-archive sizes and candidate subclass counts are not acquisition or eligibility commitments.
  - Public availability and correct species/area are prerequisites, not successful physiological validation.
  - The existing failing and inconclusive native VIP models and insufficient synaptic strata remain immutable.
