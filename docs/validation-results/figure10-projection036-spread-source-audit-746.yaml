  visually_audited_pdf_pages: [24, 25, 26]
  evidence:
  - Figure 10d defines a layer-6I-to-4 on-center/off-surround circuit whose
    reset favors previously inactive cells with less-depleted transmitter.
  - Section 2.7 states that the layer-6I excitatory path to layer 4 and the
    layer-6I path through layer-4 inhibitory interneurons are both scaled by
    activity-dependent transmitter.
  - The paper supplies no explicit Gaussian formula or ring=true semantics.
kinness_framework:
  path: tmp/kinness-framework-expanded.pdf
  sha256: 15a7f9166e301c9740e7cff4258810d315bd95b196ea5dff3419c5cc2879f177
  sections: ['4.4 Synaptic channels', '4.9 Connectivity']
  evidence:
  - Equation 16 defines chemical current as channel conductance density times
    ligand gate, cell-specific weight, source transmitter, and driving force.
  - Section 4.9 says the many-to-one Gaussian has variances set by Spread X
    and Spread Y.
  - The archived interface manual independently fixes Weight as the Gaussian
    peak and drops resulting connection weights below 0.001.
