interpretation: >-
  The fixed calibrated model establishes the same five-cell horizontal
  pre-reset assembly in both arms. Its sequential history produces four
  nonspecific events during match and seven during mismatch, unlike the six
  events in the separately initialized Figure 7 mismatch. Disconnecting
  projections 017/018 only at mismatch leaves nonspecific output unchanged but
  reduces layer-5 events from 70 to 55, proving causal transmission into layer
  5. That difference produces no change in layer-6I or layer-4 events. The
  published reset therefore fails because the causal effect stops after layer
  5, not because the mismatch burst or its layer-5 input is absent.
