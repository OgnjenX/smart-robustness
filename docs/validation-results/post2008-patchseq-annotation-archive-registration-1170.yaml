archive_contract:
  - Exactly one verified-TLS GET with If-Match and no redirects or retries.
  - Stream length and SHA256 with at most expected bytes plus one failure-detection byte.
  - Retain any failed object and transport evidence in an exclusive output directory.
  - Inspect only uncompressed TAR metadata; never extract to disk or execute source content.
  - Reject links, devices, FIFOs, absolute paths, traversal names and ambiguous CSV candidates.
  - At most twenty regular-file or directory members and at most 2097152 declared member bytes.
  - CSV candidates are the declared filename at root or its same-named directory; exactly one required.
  - Read only the first bounded CSV header line, at most 65536 bytes and 256 columns, with duplicate/empty names rejected.
  - Additional safe member names remain inventory entries, not permission to interpret their contents.
  - Row data and numerical features remain uninterpreted source bytes; no specimens or classes are selected.
