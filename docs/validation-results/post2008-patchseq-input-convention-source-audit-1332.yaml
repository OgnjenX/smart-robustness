decision: >-
  Keep the existing as-recorded command/voltage analysis convention: it matches
  the official general loader's scaling and does not add an unknown holding
  current. Do not multiply stored bias_current by 1e12 because of the historical
  schema's amperes label, do not infer amperes from the dataset name, and do not
  add or subtract that scalar from the command. Treat the MIES-specific leak/unit
  handling as a conditional source convention pending per-file exporter evidence,
  not proof that all 48 files were generated by that exporter/version.
boundaries:
  - These are pinned contemporary analysis code paths, not recovered historical exporter execution.
  - A loader convention supports analysis reproducibility but does not establish physical total injected current or amplifier health.
  - Missing or undefined instrument metadata stays unknown; no historical QC status or zero bias is imputed.
  - Stored scalars, original QC outcomes and frozen partitions remain unchanged.
  - No reclassification, threshold change, model fit or network execution is authorized by this audit.
