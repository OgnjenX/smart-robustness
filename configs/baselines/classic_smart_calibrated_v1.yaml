limitations:
  figure8: >-
    The released 2008 material does not preserve the original clamp/input
    schedule or exact SMART-era runtime. The independent 2004 relay archive
    cannot supply those missing Figure-8 details, and its exact normalized
    8-bit input reconstruction fails the registered tonic/burst gates.
  figure15: >-
    Nearby layer-4 gamma synchrony is reproduced, but the fixed reconstruction
    peaks at 53.0265 Hz rather than the paper panel's graphical 44 Hz. The
    original cells, spike arrays, estimator, and confidence procedure are not
    available, and the failed numeric holdout remains part of the frozen record.
  source_runtime: >-
    KInNeSS 0.3.4 RC2 and SANNDRA 1.2.0 RC2 source bodies have not been recovered.

