source_facts:
  - The framework manuscript defines compartment membrane potential as V and
    writes every current as maximal conductance times gates times V_eq minus V.
  - Its voltage-gate table defines exponential, sigmoid, linoid, Simple_Tau,
    and Reticular_Tau dependencies directly as functions of that same V; it
    specifies no channel-family-specific addition of E_leak.
  - The relay XML assigns both Na/K and T-type channels to voltage-dependent
    gates but serializes no per-gate voltage-coordinate transform.
  - The archived burst monitor establishes that the simulator V is near zero
    at rest even though the compartment serializes E_leak=-70 mV.
resolved_inference:
  membrane_state_coordinate: kinness_internal_zero
  all_voltage_gate_coordinate: integrated_internal_membrane_voltage
  calcium_voltage_coordinate: integrated_voltage
  confidence: strong-source-composite
rejected_inference:
  calcium_voltage_coordinate: internal_zero_plus_serialized_leak
  reason: >-
    That split coordinate is absent from the contemporaneous simulator
    equations and produces a 21.7 mV preinput mean error with no tonic or burst
    events in replay 865.
authorized_next_test:
