limits:
  - The inspected source uses internal feather inputs and a cell-subset CSV; those internal resources were not acquired or executed.
  - The source does not contain the export writer for metadata_mouse.csv or directly define every raw methods cell_id and sample_id value.
  - Specimen-based selection and RNA-row alignment are distinct operations; no equivalence of PS-prefixed and plate-style sample strings is established.
  - The analysis is source code evidence, not verification that every manuscript row was generated by this exact historical execution.
  - No per-cell physiology, clinical fields, RNA expression matrix or numerical cohort outcomes were read.
decision: >-
  Preserve both literal name-test failures. Do not make equality of unrelated
  row-name strings a hidden prerequisite for every independently justified
  recording-to-specimen route. Separately register an author-manifest-anchored
  external cell association for the same checksum-verified recording, requiring
  unique source cell/session references and the independently read internal
  session. Label that evidence external-author-cell-association, not internal
  cell-ID proof or RNA alias equivalence. Confidence assignment, donor
  independence and physiological qualification remain separate unresolved gates.
