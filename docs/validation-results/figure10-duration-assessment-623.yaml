interpretation: >-
  The sole source-visible duration endpoint passes every fresh Figure-6 gate
  and exactly repeats the registered first 100 ms of mismatch. During the
  added interval, the intact nonspecific pathway recruits all 81 layer-5
  cells, so the prior 200-ms assay was too short to observe the complete
  layer-5 reset wave. Projection 025 transfers that support to all 81 layer-6I
  targets and carries 4.68 times the integrated current of the disconnected
  control. Nevertheless, both arms produce the same 42 late layer-6I events
  from the same seven cells and the same 49 late layer-4 events. There is no
  causal winner suppression or alternative release. Duration therefore
  repairs the upstream spatial wave but does not reproduce Figure 10; the
  remaining failure is the conversion of broad layer-5 input into broad
  layer-6I recruitment. The duration family is closed and no parameter is
  selected.
next_gate: >-
  Audit projection 025's connectFromMany Gaussian spread semantics against
  SMART.nml and the archived KInNeSS manual. The serialized fields are named
  sigma_x/sigma_y, while the manual calls Spread X/Y variances. Under the
  active standard-deviation interpretation, a 0.2 spread is effectively
  one-to-one after the documented 0.001 cutoff. Decide whether one
  projection-specific, source-discrete variance interpretation is admissible;
  preregister it before execution and retain Figure 6 plus the 300-ms causal
  reset gates without fitting a spread value.
