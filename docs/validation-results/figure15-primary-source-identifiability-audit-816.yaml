decision: >-
  Preserve Assessment 812 as a failed preregistered repository holdout; do not
  change its pair, analysis, target, or tolerance after observing 53.03 Hz.
  Also correct the epistemic claim: that gate is not an exact reconstruction of
  a fully specified official test because the source does not identify the cell
  pair, binning, frequency estimator, confidence procedure, or tolerance. The
  candidate reproduces the source-identifiable Figure-15 behavior of local
  layer-4 gamma synchrony, but it does not reproduce the graphically labeled
  44-Hz value under the registered reconstruction analysis. No conductance,
  pair, analysis method, or acceptance boundary is selected by this audit.
next_action: >-
  Do not tune the model to Figure 15. Either recover original spike arrays or
  analysis code, or define a transparent freeze category that distinguishes a
  calibrated classic-SMART behavioral reconstruction from exact numerical
  recovery. Any freeze must retain the 53.03-versus-44-Hz discrepancy and the
  failed preregistered gate as a first-class limitation. Neuron-model and
  modern-anatomy experiments remain separate and unopened.
