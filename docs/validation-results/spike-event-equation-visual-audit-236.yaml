interpretation:
  - The literal rule checks the current sample below zero and the immediately preceding sample above threshold; it is not a preceding-sample-below-zero or upward-crossing test.
  - With a -20-mV threshold, every immediately adjacent sample in the interval (-20, 0) can satisfy the printed expression. The recovered network therefore produces an event storm rather than one clean event per action potential.
  - The surviving PDFs determine the printed formula but do not reveal whether the missing 2008 spikeevents implementation latched, debounced, or otherwise transformed it.
  - This source correction changes documentation only. It does not select a new detector, alter a model parameter, or establish official SMART behavior.
