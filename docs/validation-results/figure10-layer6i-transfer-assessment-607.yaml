interpretation: >-
  The run repeats every Artifact-602 event count and active-cell identity. The
  intact reset pathway delivers 2.52 times the projection-025 gate integral,
  2.76 times its current integral, and 8.95 times its peak current to layer 6I.
  Relay input is effectively unchanged and layer-2/3 input differs only
  slightly. Despite this large selective layer-5 signal, layer 6I still emits
  30 events in both arms and layer 4 remains unchanged. Layer-5 transmitter
  transfer is therefore not the blocker; the signal is masked or saturated
  within layer 6I, or its event timing/resource state makes the downstream
  projection ineffective.
