conclusions:
  - The archived blue=70 input is a subthreshold category prime, not an independent category spike generator.
  - Projection 032 delivers strong proximal dendritic excitation, but the active KInNeSS axial interpretation transfers too little voltage to the layer-2/3 soma to recruit it.
  - The paper-literal directional axial equation recruits the cortical chain but still fails Figure 6c and over-recruits off-bar layer-6II cells.
  - KInNeSS Equations 8a-9 explicitly support symmetric total edge current with compartment-size-dependent voltage effects, so the paper-literal candidate is not promoted merely for increasing recruitment.

