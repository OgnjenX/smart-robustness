claims_boundary: >-
  A simulator-wide variance interpretation would be more internally
  consistent with the KInNeSS manual, but that registered interpretation has
  already failed Figure 6. Applying variance only to projection 025 is
  therefore an explicitly behaviorally motivated mixed-source sensitivity,
  not recovery of the original KInNeSS implementation. Even if it reproduces
  Figure 10, it cannot by itself establish a faithful original SMART baseline.
stopping_rule: >-
  Execute this endpoint once. Require all fresh Figure-6 gates before
  interpreting the 300-ms causal pair. Close the projection-specific spread
  family after the result; do not vary spread, cutoff, weight, delay, receptor
  kinetics, layer-6I intrinsic parameters, duration, or reset scoring.
