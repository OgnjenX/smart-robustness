rules:
  - Read only three registered raw identifier fields from the exact verified July CSV schema; retain every source row, missing value and noncanonical cell ID.
  - Reconcile cell_specimen_id and transcriptomics_sample_id with the previously verified July projection at the same source row. Any discrepancy is a source-integrity failure.
  - Independently index methods by canonical cell_id and nonempty literal sample_id; retain all cell and specimen-name candidates.
  - A name bridge requires unique cell and specimen-name candidates referencing the same methods source row, with a nonempty exact methods sample_id equal to July cell_specimen_name.
  - Preserve the separate literal methods sample_id versus July transcriptomics_sample_id flag. Do not overwrite or retroactively reinterpret the failed strict test.
  - Retain ambiguous names, unmatched rows, conflicting source-row associations and all raw IDs. No trimming, case folding, prefix inference or approximate strings.
  - Report bridge counts and raw source mapping-quality categories only for unique name bridges; no mapping confidence or eligibility is assigned.
  - Unknown or inconsistent mapping quality is not removed. This test does not infer donor identity, validate internal NWB metadata or read physiological arrays.
  - Independently reconstruct all new raw fields and name comparisons before considering the bridge as evidence for a separate confidence-annotation ledger.
