conclusions:
  - Equation 28 intentionally multiplies the Equation 25 Xpre*Xpost term by the Table 3 gate; the presynaptically gated rule therefore contains Xpre squared.
  - The paper explicitly describes one 100-ms presentation, so repeating the episode is not a source-faithful repair.
  - Archived learning rate, asymptotic weight, maximum weight, delay, and depotentiation window are already represented literally.
  - The immediate failure is temporal reachability: no relay spike follows the delayed category spike, so the intended causal corticothalamic STDP pairing cannot occur.
  - Correcting the projection-022 endpoint alone does not restore the category spike and is rejected as a Figure 6 fix.

