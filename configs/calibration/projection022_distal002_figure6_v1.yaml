rationale: >-
  Artifact 211 shows that resolving projection 022 restores the official
  match-greater-than-mismatch TRN direction but leaves both expectation-only
  and input-only relay arms active. Before that source resolution, distal scale
  0.02 was already a registered Figure 6 candidate and missed the exact gate by
  one overlap-cell event. Test that same pre-existing stronger distal endpoint,
  without interpolation, under the now source-corrected category pathway.
  Figure 6 remains mandatory and Figure 7 remains locked unless it passes.
detector: {arm_mV: -20.0, release_mV: -30.0}
runtime_overrides:
  projection_source_convention: paper_supplement_cross_checked
profiles:
  - label: paper_supplement_projection022_distal_0_02
    scales:
      modeldb112923.projection.000: 0.01
      modeldb112923.projection.001: 0.01
      modeldb112923.projection.004: 0.02
stage_1_protocol: {stimulus_ms: 55.0, dt_ms: 0.01}
stage_1_gate:
  relay_active_indices: [38, 39, 40, 41, 42]
  minimum_events_per_active_relay: 2
  trn_events: '>0'
stage_2_protocol: {stimulus_ms: 100.0, dt_ms: 0.01}
stage_2_gate:
  relay_event_count: 20
  relay_active_indices: [38, 39, 40, 41, 42]
  relay_events_per_active_index: 4
  relay_fresh_detector_cycles_per_active_index: 4
  feedforward_chain_complete: true
  causal_pair_in_learning_window: true
  bottom_up_horizontal_orientation: true
  minimum_top_down_horizontal_contrast: 0.01
next_gate: >-
  Only if every Figure 6 gate passes, register and run one unchanged
  same-network Figure 7 pair. If it fails, reject this existing endpoint under
  the source-resolved pathway and do not interpolate another distal value from
  the Figure 7 result.
