fixed_choices:
  trn_calcium_source_convention: modeldb_reversal
  trn_soma_calcium_channel: absent_as_in_table3
  trn_dendritic_calcium_density_mS_cm2: 100.0
  trn_distal_proximal_axial_conductance_scale: 1.0
dimension:
  name: trn_soma_proximal_axial_conductance_scale
  grid: [1.0, 1.25, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 16.0]
  interpretation: >-
    Multiplicative behavior calibration of both directional conductances on
    only the source-fixed soma--proximal edge. It is not a recovered original
    SMART parameter. The linear topology, proximal--distal edge, and every
    intrinsic and synaptic parameter remain fixed.
stage_1_gate:
  protocol: 20-ms equilibration followed by a 10-ms top-down-only diagnostic lead
  source_category_event_required: true
  off_source_category_events: 0
  trn_events_during_lead: 0
  relay_events_during_lead: 0
stage_2a_gate:
  protocol: 50-ms simultaneous-onset match after 20-ms equilibration
  active_relay_indices: [38, 39, 40, 41, 42]
  trn_events: '>0'
stage_2b_gate:
  protocol: simultaneous bottom-up/top-down match and mismatch
  match_relay_indices: [38, 39, 40, 41, 42]
  mismatch_relay_indices_must_be_subset_of: [40]
  trn_output_order: match_greater_than_mismatch
  nonspecific_output_order: mismatch_greater_than_match
locked_parameters:
