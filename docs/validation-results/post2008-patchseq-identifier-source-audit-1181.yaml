sources:
  - url: https://github.com/AllenInstitute/ipfx/blob/c607a36e25618a6bb8ba5438c1cd945fb429e659/docs/download_data.rst
    finding: >-
      Official instructions define archive_uri as the file location and
      cell_specimen_id as the corresponding cell, with intracellular_electrophysiology
      identified by the technique column. Metadata selection is then joined to
      the file manifest. The prose calls the metadata key specimen_id, so the
      actual header must remain authoritative rather than silently renamed.
  - url: https://github.com/AllenInstitute/ipfx/blob/c607a36e25618a6bb8ba5438c1cd945fb429e659/ipfx/data_access.py
    finding: >-
      ARCHIVE_INFO pairs mouse DANDI 000020 with
      2020-06-26_mouse_file_manifest.csv and 20200625_patchseq_metadata_mouse.csv.
  - url: https://github.com/AllenInstitute/ipfx/issues/547
    finding: >-
      The 2022 issue documents distinct DANDI ephys-session and cell-specimen
      identifiers. It does not define the numerical subject-to-donor mapping.
  - url: https://dandi.readthedocs.io/en/latest/cmdline/organize.html
    finding: >-
      DANDI organization derives sub from NWB subject_id and ses from session_id.
      This general naming rule does not establish that subject_id is the donor_id
      column used in the separate Allen annotations.
  - url: https://github.com/AllenInstitute/ipfx/blob/c607a36e25618a6bb8ba5438c1cd945fb429e659/ipfx/attach_metadata/sink/nwb2_sink.py
    finding: >-
      Metadata attachment writes supplied subject_id and session_id into NWB.
      The sink alone does not identify the upstream source of subject_id.
