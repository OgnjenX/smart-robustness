cross-study_synthesis:
  exact_gate_robustness: >-
    No registered alternative neuron family completed the full frozen SMART
    behavioral hierarchy. Three morphology/mechanism interventions reached
    Figure 7 after exact Figure 6 survival, but each changed at least one
    calibrated match/mismatch gate.
  qualitative_art_robustness: >-
    The point-HH collapse, distal Na/K ablation, and branched layer-5 expansion
    all preserve broad relay match, overlap-only relay mismatch, and greater
    nonspecific output for mismatch than match. Coarse ART-like recognition
    dynamics are therefore more robust than exact event-count phenotypes.
  layer5_localization: >-
    Removing distal layer-5 Na/K increases mismatch nonspecific events from 7
    to 8, whereas the conserved branched expansion decreases them from 7 to 6.
    This bidirectional bracketing localizes the exact mismatch count as
    sensitive to layer-5 dendritic excitability, axial topology, and receptor
    location under otherwise frozen circuitry.
  family_inference_boundary: >-
    These finite preregistered searches reject specific parameterizations and
    transformations. They do not establish that HH kinetics are necessary for
    ART, that AdEx/GIF cannot support ART after an independent system-level
    construction, or that biological branching is incompatible with SMART.

