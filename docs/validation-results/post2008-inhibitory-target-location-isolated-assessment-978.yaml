interpretation:
  - Equal total GABA-A resource produces measurably different compartmental and somatic responses when routed to soma, proximal dendrite or distal dendrite.
  - The target-location effect is exact across repeats and closely converged between 0.01 and 0.005 ms.
  - The archived projection-036 reversal is -70 mV, while the free cell is below -71 mV around the first arrival. The registered events are therefore depolarizing and shunting in this isolated state, not conventionally hyperpolarizing.
  - The pv_like_somatic and sst_like_distal labels describe source-supported routing abstractions only. No PV or SST intrinsic cell model, recruitment pattern, population prevalence or connection matrix was tested.
  - This result establishes that subcellular targeting is a non-null mechanistic factor worth carrying into a one-layer network design. It does not establish which route improves, preserves or disrupts SMART resonance/reset behavior.
  - No parameter or threshold was selected from these outcomes, and the immutable classic baseline remains unchanged.

prohibited_actions:
  - Do not call the observed voltage shift hyperpolarizing inhibition under this resting-state protocol.
  - Do not infer PV-versus-SST efficacy generally from one L5 pyramidal cell and one fixed event train.
  - Do not combine PV-like, SST-like and VIP-like routes in one first network experiment.
  - Do not tune compartment-specific gains to equalize free-membrane effects.
  - Do not execute a network route until its layer, source population, projection transformation, conservation rule and behavioral gates are separately preregistered and sealed.
  - Do not modify the frozen baseline or overwrite raw traces.

next_step:
  - Audit candidate one-layer routes against represented SMART compartments and source-supported anatomy.
  - Preregister the first PV-like somatic-routing network comparison as a single projection transformation with an exact legacy control and conserved total nominal resource.
  - Run SST-like dendritic routing later as a separate sealed experiment; do not force it onto a SMART population that lacks a distal compartment.
  - Defer VIP-like disinhibition until an independently specified recruitment protocol and SST target population exist.
