amendment:
  date: 2026-09-11
  reason: invalid-classic-sentinel-after-replicate-seed-was-applied-before-construction
  invalid_attempted_selective_outcomes_observed: true
  invalid_attempted_outcomes_used_for_inference_or_fitting: false
  corrected_selective_outcomes_observed_at_amendment: false
  corrected_seed_semantics: >-
    Preserve the frozen deterministic construction for classic and AdEx. Apply
    each stochastic GIF seed only after the identical sector is constructed.
  deterministic_repetitions_reduced_to_one: true
  scientific_rationale: >-
    Repeating a deterministic arm with arbitrary seeds is neither a sample nor
    a valid robustness test and changed the frozen control. One exact sentinel
    is required; stochastic GIF retains all 20 preregistered replicates.

interpretation: >-
  The experiment can identify where the existing AdEx/GIF substitutions first
  break or preserve the calibrated SMART learning prerequisite. It cannot by
  itself prove that a mathematical neuron family is universally incapable of
  ART behavior.
