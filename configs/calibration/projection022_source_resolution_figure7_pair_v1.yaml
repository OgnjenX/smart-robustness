schema_version: 1
name: projection022-source-resolution-figure7-pair-v1
status: registered-before-execution
base_profile: configs/calibration/figure6_kinness_equation27_transition_v1.yaml
figure6_artifact: docs/validation-results/figure6-projection022-source-resolution-209.yaml
match_artifact: docs/validation-results/figure7-projection022-source-resolution-match-210.yaml
rationale: >-
  If Artifact 210 passes match, run one fresh same-network mismatch with the
  identical Supplementary Table 3 projection-022 endpoint and all other
  settings fixed. Apply the published directional contract without fitting to
  mismatch.
detector: {arm_mV: -20.0, release_mV: -30.0}
runtime_overrides:
  projection_source_convention: paper_supplement_cross_checked
trn_to_relay_gaba:
  scales:
    modeldb112923.projection.000: 0.01
    modeldb112923.projection.001: 0.01
    modeldb112923.projection.004: 0.015
protocol:
  condition: mismatch
  pretrain_with_figure6_episode: true
  top_down_current_pA: 600.0
  top_down_cue_lead_ms: 0.0
  equilibration_ms: 0.0
  duration_ms: 100.0
  dt_ms: 0.01
  record_relay_diagnostics: true
official_directional_gate:
  match_relay_indices: [38, 39, 40, 41, 42]
  mismatch_relay_indices_must_be_subset_of: [40]
  relay_active_cell_order: match_greater_than_mismatch
  trn_event_order: match_greater_than_mismatch
  nonspecific_event_order: mismatch_greater_than_match
  sampled_mismatch_trn_events_have_fresh_cycles: true
next_gate: >-
  If every Figure 7 gate passes, advance the unchanged source-resolved candidate
  to Figure 10 reset and locked spectral/synchrony holdouts. If it fails,
  preserve the exact failure and reopen only a preregistered source mechanism.
locked_holdouts:
  - figure10_reset
  - figure14_spectra
  - figure15_local_synchrony
  - figure16_long_range_synchrony
