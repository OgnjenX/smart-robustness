interpretation:
  - Agreement of two inspected implementations on formula and defaults is useful provenance, not proof of the release-generation environment.
  - Preserve missing ic_latency and the separate shared-latency composite; this audit does not recover a rested xoffset.
  - Reconstructing a normalized PSP component is not reconstructing the full average waveform or identifying a unique synaptic conductance.
  - Missing baseline exponential and constant-offset terms must not be silently set to zero for full-waveform comparisons.
  - Actual recording baselines, their dispersion and experimental eligibility still require independently verified selected-release reconciliation and a separate baseline-join registration.
  - Do not apply a numerical ratio cap to repair source kinetics; invalid or unresolved domains must be retained as failures under a future explicit contract.
  - A future fit must declare its waveform semantics and numerical inverse explicitly rather than claiming historical optimizer parity.
next_steps:
  - Finish and independently verify the registered medium acquisition without duplicate downloads.
  - Publish the acquisition assessment and seal selected-summary reconciliation before real medium row queries.
  - Register original-pulse-to-recording baseline reconstruction without nominal-holding substitution.
  - Only then seal a source-semantic forward-model fitting protocol, including component versus full-waveform endpoints and uncertainty.
