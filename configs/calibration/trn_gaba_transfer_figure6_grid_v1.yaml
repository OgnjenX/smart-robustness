predecessor_artifact: docs/validation-results/figure6-trn-detector-hysteresis-prerequisite-201.yaml
rationale: >-
  Artifact 201 shows that the closest isolated detector survivor recruits
  dynamic TRN output but the three intact TRN-to-relay GABA projections then
  suppress every relay event after the first. The paper supplement and
  SMART.nml agree on those projection values, so this is explicitly a bounded
  behavior calibration of unidentified legacy inhibitory-transfer semantics,
  not a source parameter reconstruction.
