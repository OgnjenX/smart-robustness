execution_contract: >-
  Inspect every original selected synapse; preserve raw blobs separately with
  hashes, lengths and decoded IDs. Null/empty, oversized, malformed, duplicate,
  noninteger or object arrays are recorded failures, never repaired. Bound and
  validate NPY headers and dimensions before allocation, then decode with
  allow_pickle=False. Count only id columns in the four metadata tables to
  verify whether the small release contains rows; no response or baseline
  values are read. Use read-only immutable SQLite with exact column guard.
next_step: >-
  If original pulse IDs are available but recording tables are absent, register
  bounded medium-release acquisition and summary-ID reconciliation before
  measured-baseline reconstruction. Preserve original experiment partitions
  and failed gates; no full-release fallback or automatic download is authorized.
