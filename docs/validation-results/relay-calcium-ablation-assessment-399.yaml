interpretation: >-
  In this calibrated network, the offending nonoverlap cells can fire during
  the sensory epoch with both relay dendritic T-type conductances set to zero.
  Their firing during that epoch therefore does not require ongoing relay
  T-type current under this intervention. Calcium nonetheless affects event
  timing and recurrent TRN/nonspecific output; it is not generally irrelevant.
  Training and cue-period calcium histories were retained. Network feedback
  is allowed to change, so this is not a cell-autonomous current-clamp assay or
  a statement about all calcium-dependent mechanisms in original SMART.
