schema_version: 1
name: adex-relay-inhibitory-transfer-match-v1
status: registered-before-candidate-execution
classification: exploratory-network-blind-isolated-transfer-fit
predecessor: configs/models/adex_relay_external_transfer_protocol_v2.yaml

scope:
  cell_class: thalamic_relay
  input_record_id: modeldb112923.external.002
  channel: green
  pre_ms: 50.0
  step_ms: 100.0
  post_ms: 20.0
  dt_ms: 0.02
  source_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240]
  training_positions: [0, 2, 4, 6, 8, 10, 12]
  sealed_holdout_positions: [1, 3, 5, 7, 9, 11]

retained_current_step_target:
  source: results/adex-isolated-fit-v3-890.yaml
  training_positions: [0, 2, 4, 6]
  sealed_holdout_positions: [1, 3, 5]

inhibitory_context:
  pre_ms: 50.0
  step_ms: 100.0
  post_ms: 20.0
  dt_ms: 0.02
  gate_baselines:
    modeldb112923.projection.000: 0.0019
    modeldb112923.projection.001: 0.0018
    modeldb112923.projection.004: 0.0057
  gate_basis: frozen projection weights after registered control scales
  conditions:
    - {source_value: 0, inhibition_scale: 0.0}
    - {source_value: 0, inhibition_scale: 0.5}
    - {source_value: 0, inhibition_scale: 1.0}
    - {source_value: 0, inhibition_scale: 1.5}
    - {source_value: 0, inhibition_scale: 2.0}
    - {source_value: 120, inhibition_scale: 0.0}
    - {source_value: 120, inhibition_scale: 0.5}
    - {source_value: 120, inhibition_scale: 1.0}
    - {source_value: 120, inhibition_scale: 1.5}
    - {source_value: 120, inhibition_scale: 2.0}
  training_positions: [0, 2, 4, 5, 7, 9]
  sealed_holdout_positions: [1, 3, 6, 8]

candidate_generation:
  method: scipy-qmc-sobol-unscrambled
  candidates: 256
  append_literature_candidate: true
  append_frozen_current_step_candidate: true
  bounds:
    threshold_offset_mV: [0.0, 30.0]
    slope_factor_mV: [0.25, 5.0]
    reset_offset_mV: [-20.0, 5.0]
    subthreshold_adaptation_nS: [0.0, 20.0]
    spike_adaptation_pA: [0.0, 200.0]
    adaptation_time_constant_ms: [20.0, 400.0]
    effective_leak_offset_mV: [-30.0, 10.0]
  fixed: {peak_mV: 20.0, refractory_ms: 2.0}

selection:
  training_objective: equal sum of current, external, and inhibitory-context losses
  include_model_specific_peak: false
  holdout_not_used_for_selection: true
  promotion:
    - all selected traces are finite
    - combined training loss is lower than the frozen relay-transfer candidate
    - combined sealed-holdout loss is lower than the frozen relay-transfer candidate

forbidden_fit_inputs:
  - Figure 6 relay event count, active indices, or any other network output
  - learned weights or downstream ART metrics
