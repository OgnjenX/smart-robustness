interpretation: >-
  Scale 1 exactly repeats Artifact 638, and all seven isolated trials remain
  finite. Scales 1, 2, and 4 produce no peripheral event; scale 8 produces one
  event 108.35 ms after mismatch onset, and larger endpoints produce one or two.
  The first-event boundary is therefore coarsely bracketed between greater than
  4 and at most 8 times the reconstructed projection-025 maximal conductance.
  This large factor agrees with Artifact 635's localization of a substantial
  amplitude deficit rather than a near-threshold timing miss. It is an effective
  reconstruction sensitivity, not evidence that the original SMART parameter
  was eightfold larger, and no value is selected from the isolated cell alone.
