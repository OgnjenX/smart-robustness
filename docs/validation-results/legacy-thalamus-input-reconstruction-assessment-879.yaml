interpretation:
  - >-
    The two numerical methods agree on the voltage-selected values and on the
    negative held-out result. The selected tonic value is subthreshold, while
    the next coarse grid value enters a much faster repetitive-spiking regime;
    the archived voltage mean lies near this transition and was not resolved
    by the coarse screen.
  - >-
    The selected burst value reduces the hyperpolarized mean error from the
    7.69--7.89 mV seen in Replay 874 to 0.57 mV and preserves the preinput mean,
    but it yields four rebound events rather than the archived six. Thus drive
    amplitude explains the steady-voltage discrepancy but not the full event
    pattern at the registered resolution.
  - >-
    This negative result rejects promotion of either coarse-grid arm. It does
    not prove that no source-permitted 8-bit input value can pass, because the
    tonic transition lies inside one registered interval.
  - >-
    This remains an independent 2004 single-cell benchmark. Even a future
    calibrated pass cannot reconstruct the unpreserved 2008 Figure-8 clamp
    schedule or alone establish an exact original-SMART reproduction.
next_action:
  action: >-
