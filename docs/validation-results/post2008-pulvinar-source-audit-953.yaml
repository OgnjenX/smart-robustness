primary_evidence:
  - citation: Blot et al. (2021), Neuron 109, 1996-2008.e6
    doi: 10.1016/j.neuron.2021.04.017
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8221812/
    preparation: mouse-visual-V1-LP-AL-PM
    supported:
      - LP projections to AL and PM are largely segregated populations.
      - Their inputs include V1 L5, higher visual areas and superior colliculus.
      - Direct V1 and LP routes carry distinct visual and locomotor-context signals.
    translation_limits:
      - AL and PM are not interchangeable with a single generic SMART V2 sector.
      - Bouton calcium signals do not directly specify conductance or axonal delay.
      - Tracing cell counts are not measurements of synaptic weights.
      - The existing static bar stimulus cannot test visuo-motor signal differences.
  - citation: Saalmann et al. (2012), Science 337, 753-756
    doi: 10.1126/science.1223082
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3714098/
    preparation: macaque-pulvinar-V4-TEO-spatial-attention
    supported:
      - Attention-associated inter-area coherence includes 8-15 Hz and 30-60 Hz bands.
      - Pulvinar, V4 and TEO were recorded during a cued attention task.
    translation_limits:
      - These species, areas and behavioral epochs differ from mouse V1-LP-AL/PM.
      - Coherence is not the existing Figure16 peak cross-correlation statistic.
      - Spectral association does not determine an executable connection delay or weight.
      - Do not substitute these bands for the frozen classic gates after observing results.

