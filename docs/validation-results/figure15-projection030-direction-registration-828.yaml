classification_rule: >-
  A scale has interpretable frequency evidence only if both fixed excitatory
  cells have at least two spikes. Classify projection 030 as frequency-causal
  only if the three-arm sequence shows a coherent monotonic peak shift and the
  inhibitory readouts verify target engagement. Classify it as rate- or
  engagement-only when inhibitory or excitatory counts change without a peak
  direction. Classify it as non-causal in this range if neither changes
  materially. Report all 5-Hz bins and ISI summaries without interpolation.
selection_rule: >-
  Report every arm in fixed ascending order. Select no scale. The diagnostic
  can identify a direction only and cannot alter the failed 1000-ms holdout.
stopping_rule: >-
  Execute exactly one fresh training followed by exactly three downstream arms.
  Do not rerun, densify, interpolate, retrain per arm, change the pair or epoch,
  inspect another projection, or consult neuron-model or modern-anatomy variants
  before the result is assessed.
