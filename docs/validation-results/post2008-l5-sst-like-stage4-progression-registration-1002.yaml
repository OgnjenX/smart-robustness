  ranking_or_refinement_allowed: false

fixed_intervention:
  route: post2008.l5_sst_like.collapsed_feedback.v1
  source_population: layer5_excitatory_v1
  target_population: layer5_excitatory_v1
  target_compartment: distal_dendrite
  source_target_mapping: same-spatial-index
  receptor: GABA_A
  reversal_mV: -70.0
  rise_ms: 1.0
  fall_ms: 7.0
  plastic: false
  biological_scope: collapsed-functional-distal-feedback-sensitivity-test

execution_design:
  substage_order: [stage4a_learning_first_order, stage4b_figure14, stage4c_figure15, stage4d_figure16]
  repetitions_per_point_per_substage: 2
  exact_repeat_required: true
  execute_all_seven_points_in_every_substage: true
  no_point_dropped_after_a_failed_substage: true
  failed_earlier_substage_cannot_be_compensated_by_later_pass: true
  checkpoint_after_every_repetition: true
  single_process_lock_per_result: true
  separate_implementation_commit_and_pre_outcome_seal_per_substage: true
  assess_complete_substage_before_implementing_next_substage: true
  result_guided_parameter_or_analysis_changes: forbidden

stage4a_learning_first_order:
  purpose: >-
    Test each route during fresh Figure-6 expectation learning, then use that
    same repetition's learned weights for the frozen Figure-7 and Figure-10
    progression rather than importing the route-free learned snapshot.
  execution_per_repetition:
    - fresh_figure6_learning_with_route_present
    - figure7_match_with_same_learned_weights
    - figure7_mismatch_with_same_learned_weights
    - figure10_intact_and_disconnected_control_if_same-repetition-figure7-passes
  figure6_gates:
    - relay_active_indices
    - relay_events_per_active_index
    - relay_events
    - cortical_chain_complete
    - causal_learning_pair
    - top_down_horizontal_contrast
  figure7_gates: inherited-unchanged-from-frozen-calibrated-profile
  figure10_gates: inherited-unchanged-from-sealed-search-cycle-runner
  retained_learning_state:
    - bottom_up_weights
    - top_down_wide_weights
    - top_down_narrow_weights
  point_pass_rule: >-
    Both repetitions are exact; every Figure-6 and Figure-7 gate passes; and,
    when run under the inherited conditional rule, every Figure-10 gate passes.
  result_target: results/l5-sst-like-stage4a-learning-first-order-1004.yaml

