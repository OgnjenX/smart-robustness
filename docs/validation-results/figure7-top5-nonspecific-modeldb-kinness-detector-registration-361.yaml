    Artifact 360 shows that the recovered nonspecific intrinsic cell preserves
    Figure 6 and upstream match but peaks at 28.14 mV, narrowly below the
    Grossberg and Versace Equation-8 +30-mV arm. Its zero events therefore do
    not by themselves reject the complete recovered simulator configuration.
  - >-
    The contemporaneous KInNeSS framework specifies V_theta=-20 mV for its
    somatic event detector. Pair that discrete published simulator threshold
    with the complete recovered INTRALAMINAR intrinsic cell. The value is not
    derived from Figure 7 and is not fitted to the observed 28.14-mV peak.
  - >-
    Keep the calibrated peak-latch/release implementation because the 2008
    spikeevents source body is unavailable; this test resolves cell/threshold
    source coherence, not the independently unresolved temporal-handler body.
