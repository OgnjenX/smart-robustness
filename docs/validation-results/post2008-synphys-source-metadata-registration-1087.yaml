output_directory: results/synphys-source-metadata-1088
source_freeze: archive-exact-bytes-final-URL-status-length-SHA256-and-fetch-UTC-before-future-database-use
inspection_scope:
  - Read documentation only, including database table/field definitions.
  - Read one bounded S3 root delimiter listing of resource names, sizes, timestamps and prefixes.
  - Report truncation and unknown version/schema availability rather than claiming a full resource inventory.
  - Do not execute source modules, install aisynphys, query numerical result tables or download SQLite/NWB files.
future_gate_requirements:
  - Separate mouse visual-cortex evidence from human MTG or other cortical areas.
  - Resolve actual layer and subtype identifiers; target_layer placeholders are not confirmed histological layers.
  - Use source nonsynaptic cell-class metadata for connectivity selection; do not condition class membership on observed currents.
  - Distinguish PSP/PSC observations from conductance estimates and from suprathreshold recruitment.
  - No peak-PSP-to-conductance point conversion without justified voltage, reversal, units and passive/dendritic transfer assumptions.
  - Specify source QC, experimental conditions, data partition, uncertainty and biological gates before reading numerical synaptic outcomes.
  - Different source cells cannot be claimed to be recordings from our two passing SST specimens without an explicit identity link.
