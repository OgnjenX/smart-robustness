interpretation: >-
  Removing both recurrent chemical TRN GABA pathways releases nearly uniform,
  high-rate firing across the 9-by-9 TRN sheet and destroys the calibrated
  4-versus-7 nonspecific result. It reduces the global inversion from 35 to 20
  events but does not reverse it: mismatch still exceeds match at 2028 versus
  2008, and the remaining 72 cells retain all of that difference. Recurrent
  GABA is therefore essential for network stability and the calibrated output,
  but it is not the sole generator of the incorrect global ordering.
next_gate: >-
  Preregister one recognition-only ablation of projection 013 TRN distal gap
  junctions while retaining recurrent GABA projections 008/011, every afferent
  and output pathway, and the fixed learned-coincidence/effective-T pair. This
  tests whether electrical spatial coupling organizes the residual peripheral
  mismatch-wide volleys. It cannot select a replacement coupling or become a
  baseline candidate.
