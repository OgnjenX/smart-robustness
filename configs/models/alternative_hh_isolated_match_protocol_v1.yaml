schema_version: 1
name: pospischil-hh-isolated-cell-match-protocol-v1
status: preregistered-before-implementation-fitting-and-network-outcomes
control_manifest: configs/baselines/classic_smart_calibrated_v1.yaml
decision_record: docs/adr/0005-controlled-alternative-hh-substitution.md

source_family:
  citation: Pospischil et al. 2008, Biological Cybernetics 99, 427-441
  doi: 10.1007/s00422-008-0263-8
  modeldb_accession: 123623
  temperature_C: 36.0
  currents: [modified-Traub-Miles Na, delayed-rectifier K, optional M-type K]
  note: >-
    The equations are source-backed, while the final per-SMART-class values are
    independently fit to classic isolated targets and are not published values.

scope:
  cell_classes:
    - layer4_excitatory_v1
    - layer23_excitatory_v1
    - layer5_excitatory_v1
    - layer6i_excitatory_v1
    - layer6ii_excitatory_v1
    - layer4_inhibitory_v1
    - layer23_inhibitory_v1
  excluded: [all thalamic cell classes]
  reason_thalamic_excluded: classic relay failed registered source-port rebound target

classic_target_scan:
  pre_ms: 50.0
  step_ms: 200.0
  post_ms: 50.0
  dt_ms: 0.02
  voltage_recording_dt_ms: 0.1
  passive_voltage_offset_range_mV: [-100.0, 200.0]
  passive_voltage_offset_increment_mV: 5.0
  amplitude_rule: soma_g_leak_nS_times_voltage_offset_mV_equals_pA
  vectorized_current_levels: 61

sealed_level_selection:
  levels_per_cell_class: 7
  rule: reuse-adex-v3-classic-only-even-firing-rate-selection
  training_positions: [0, 2, 4, 6]
  sealed_holdout_positions: [1, 3, 5]
  alternative_outputs_used_to_select_levels: false

candidate_generation:
  method: scipy-qmc-sobol-unscrambled
  candidates_per_cell_class: 256
  dimensions:
    threshold_mV: [-75.0, -45.0]
    sodium_density_mS_cm2: [20.0, 70.0]
    potassium_density_mS_cm2: [1.0, 12.0]
    m_current_density_mS_cm2: [0.0, 0.25]
    m_current_tau_max_ms: [400.0, 2500.0]
  include_literature_seeds:
    regular_spiking_mean:
      threshold_mV: -61.5
      sodium_density_mS_cm2: 50.0
      potassium_density_mS_cm2: 4.8
      m_current_density_mS_cm2: 0.13
      m_current_tau_max_ms: 1123.5
    fast_spiking_mean:
      threshold_mV: -61.84
      sodium_density_mS_cm2: 46.0
      potassium_density_mS_cm2: 5.1
      m_current_density_mS_cm2: 0.07
      m_current_tau_max_ms: 824.5

selection:
  training_features:
    - resting voltage
    - spike count and firing rate
    - first-spike latency
    - first-to-last interspike-interval adaptation ratio
  primary: minimum normalized squared training loss
  normalization:
    resting_voltage_mV: 2.0
    firing_rate_hz: 5.0
    first_spike_latency_ms: 10.0
    adaptation_ratio: 0.25
  missing_required_feature_penalty: 1000.0
  deterministic_tie_break: ascending-parameter-tuple
  holdout_not_used_for_selection: true

promotion_gates:
  apply_to: all training and sealed holdout levels
  finite: true
  resting_voltage_absolute_error_mV_max: 2.0
  classic_silent_level_requires_zero_alternative_spikes: true
  spike_count_absolute_error_max: 1
  first_spike_latency_absolute_error_ms_max: 10.0
  adaptation_ratio_absolute_error_max: 0.25
  adaptation_gate_applies_when_classic_has_at_least_spikes: 3
  every_cortical_class_must_pass: true

held_fixed:
  - SMART morphology, capacitance, and leak
  - axial coupling and receptor placement
  - dendritic voltage-gated currents
  - thalamic T-current and layer-5 AHP/ACh
  - network topology, weights, delays, stimuli, learning, and analysis

forbidden_fit_inputs:
  - all full-network outcomes
  - Figure 6 learning outcomes
  - Figure 7 match or mismatch outcomes
  - Figure 10 reset outcomes
  - Figure 14, 15, or 16 spectral and synchrony outcomes

