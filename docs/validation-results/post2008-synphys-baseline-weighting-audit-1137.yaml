interpretation:
  - Pulse-response weighting can differ from a unique-recording mean; repeating a recording baseline is not accidental duplication in this source statistic.
  - Pulse counts do not become independent experiment counts; preserve the original global experiment partitions and operational unit gates.
  - A finite-only diagnostic mean does not repair missing baselines or establish source-complete state coverage.
  - SQLite nulls cannot be assumed to preserve the pre-serialization distinction between absent values and numeric NaN.
  - A reconstructed baseline for a record absent from the conductance table would be a new labelled artifact, not a repaired historical conductance record.
  - Comparison to the 51 available source means requires a separately sealed numerical contract before outcomes, while all 41 missing source rows remain missing.
  - Dispersion is descriptive until a separate fitting/validation protocol fixes how experimental-state uncertainty enters the loss and eligibility gates.
