schema_version: 1
name: figure7-learned-coincidence-effective-t-pair-v1
status: registered-before-execution-fixed-cross
training_profile: configs/calibration/figure6_legacy_detector_paper_nonspecific_paper_kinetics_v1.yaml
source_audit:
  primary_reference: Grossberg and Versace 2008, Figure 7 and Section 2.3
  source_statement: >-
    Matched LGN cells receive sufficiently large simultaneous bottom-up and
    top-down excitation and overcome TRN inhibition (two-against-one).
  translation_boundary: >-
    The public files do not identify a legacy scheduler/protocol state that
    places the learned cortical vote at the relay before its first bottom-up
    event. The learned coincidence transform is therefore an explicit
    mesoscopic reconstruction, not a recovered SMART source equation.
runtime_overrides:
  nonspecific_dendritic_calcium_density_scale: 0.1875
effective_density_mS_cm2: 46.875
source_density_mS_cm2: 250.0
comparator:
  transform: top_k_binary
  source_index: 40
  target_count: 5
  justification: >-
    The five-pixel cardinality is fixed by the archived horizontal training
    image. Targets are selected only from the learned Figure 6 weight field;
    condition labels and mismatch geometry are not consulted.
protocol:
  duration_ms: 100.0
  dt_ms: 0.01
  equilibration_ms: 0.0
  top_down_current_pA: 800.0
  top_down_current_mode: until_cued_cell_first_event
  top_down_cue_lead_ms: 0.0
  receptor_prime: none
figure6_gates:
  relay_active_indices: [38, 39, 40, 41, 42]
  relay_events_per_active_index: 4
  relay_events: 20
  cortical_chain_complete: true
  causal_learning_pair: true
  top_down_horizontal_contrast: '>0'
figure7_gates:
  match_relay_active_indices: [38, 39, 40, 41, 42]
  match_relay_events: 20
  mismatch_relay_allowed_indices: [40]
  match_more_active_relay_cells: true
  match_more_trn_events: true
  match_nonspecific_events: 4
  mismatch_nonspecific_events: 7
  duration_ms: 100.0
selection_rule: >-
  Execute this one fixed cross without a parameter grid. It passes only if the
  fresh Figure 6 handoff and every Figure 7 pathway and numeric gate pass.
  Otherwise close the cross without interpolation, threshold changes, or
  mismatch-driven retuning.
classification_boundary: >-
  Even a complete behavioral pass would establish a calibrated reproduction
  of Figure 7 under an explicit learned-coincidence reconstruction. It would
  not establish a bit-faithful recovery of the unavailable KInNeSS comparison
  implementation and would not by itself freeze original SMART.
