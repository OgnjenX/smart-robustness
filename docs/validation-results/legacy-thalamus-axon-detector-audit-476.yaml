    morphology: accelerando-decelerando high-frequency transient
detector_alignment:
  method: >-
    Convert the archived soma trace from the KInNeSS leak-relative display to
    physical voltage using the serialized -70-mV leak value. For every binary
    axon event, identify the preceding action-potential peak and its first
    downward threshold crossing, then subtract that crossing time from the
    axon event time.
  event_count_checked: 205
  falling_minus20_mV:
    tonic_delay_counts_ms: {1.95: 119, 2.0: 80}
    burst_delay_counts_ms: {1.95: 3, 2.0: 3}
    maximum_absolute_error_from_serialized_delay_ms: 0.05
  falling_zero_mV:
    tonic_delay_range_ms: [2.05, 2.1]
    burst_delay_range_ms: [2.05, 2.1]
  falling_minus30_mV:
    tonic_delay_range_ms: [1.9, 1.95]
    burst_delay_range_ms: [1.9, 1.95]
  falling_plus30_mV:
    tonic_delay_range_ms: [2.2, 2.25]
    burst_delay_range_ms: [2.2, 2.25]
inference:
  recovered_rule: >-
    Emit one somatic event on a downward crossing of physical -20 mV, then
    deliver the binary axon pulse after the serialized axonal delay.
  distinct_from_existing_literal_rule: >-
    The existing literal_previous_sample implementation combines a previous
    sample above an arm threshold with a current sample below a separate
    release threshold. Setting its arm to -20 mV and release to 0 mV creates an
    overlap region and event storm. The executable benchmark instead uses -20
    mV as the crossing level on both sides of the comparison.
  source_scope: >-
    This directly recovers behavior of an author-produced 2004 KInNeSS relay
    example and independently agrees with the contemporaneous KInNeSS -20-mV
    threshold. It is stronger than an unconstrained behavior fit but does not
    prove that the unrecovered 2008 KInNeSS 0.3.4-RC2 handler was bit-identical.
  paper_conflict: >-
    Grossberg and Versace 2008 Equation 8 prints a +30-mV/0-mV temporal form.
    Preserve that paper rule as a separately named convention; do not silently
    replace it when evaluating source profiles.
assessment:
  falling_minus20_detector_implementation_authorized: true
  source_parameter_fitted_from_figure7: false
  original_smart_reproduced: false
  baseline_promoted: false
next_step: >-
