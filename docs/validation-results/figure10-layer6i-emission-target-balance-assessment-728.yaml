interpretation: >-
  The paired run repeats every registered population identity and causal gate.
  The emission snapshot now delivers substantial projection-038 excitation to
  the two strongest previously inactive alternatives, but it also drives the
  indirect projection-026-to-layer-4I-to-projection-036 route. During the first
  60--70-ms pulse, the extra off-surround inhibition more than cancels the
  direct excitation. During 70--80 ms the intact four-port balance becomes
  more depolarizing than control, yet neither alternative spikes and recurrent
  projection 037 remains silent. The registered artifact accidentally omitted
  the target-timing monitor needed to retain somatic voltage, so current
  balance is localized but the membrane-state causal order is not resolved.
  No topology or parameter is selected, and the rejected scheduling candidate
  remains default-off.
