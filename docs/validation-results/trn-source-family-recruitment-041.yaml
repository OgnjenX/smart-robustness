notes:
  - Holding gates constant is a deliberately stronger test than their decaying network waveforms.
  - The paper-rate variants remain silent even at 128 times both observed gate peaks, excluding ordinary receptor-strength uncertainty as the cause.
  - The executable-rate variants are intrinsically rhythmic, so advancing their first event with excitation does not establish match-dependent recruitment.
  - The paper and executable Na/K equations differ materially: SMART.nml uses sodium activation A=0.32 and inactivation V0=17, while the paper prints 0.032 and 27 respectively.
  - A complete Methods 4.5 zero-leak coordinate with zero membrane initialization and the printed ionic reversals is also silent through 128x drive; in the reciprocal-calcium case the 0-mV excitatory reversal pulls the positive resting soma toward zero.
  - No unpublished conductance, capacitance, threshold, or weight was fitted or promoted.
