  bounds: [0.4, 0.5]
  grid: [0.4, 0.42, 0.44, 0.46, 0.48, 0.49, 0.5]
  rationale: >-
    The registered coarse grid places a no-output value at 0.4 and the first
    event-producing value at 0.5. Arrival alignment makes match TRN events up
    to approximately 0.1 ms earlier than mismatch but saturates both at 81
    events at 0.5. This finite local screen tests whether the transition
    contains a nonsaturated condition-selective regime. It is not an inferred
    SMART parameter.
