schema_version: 1
name: adex-relay-external-transfer-match-v2
status: registered-before-candidate-execution
classification: exploratory-network-blind-isolated-transfer-fit
predecessor: configs/models/adex_relay_external_transfer_protocol_v1.yaml
amendment_reason: docs/validation-results/neuron-model-adex-relay-transfer-fit-899.yaml

scope:
  cell_class: thalamic_relay
  input_record_id: modeldb112923.external.002
  channel: green
  pre_ms: 50.0
  step_ms: 100.0
  post_ms: 20.0
  dt_ms: 0.02
  source_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240]
  training_positions: [0, 2, 4, 6, 8, 10, 12]
  sealed_holdout_positions: [1, 3, 5, 7, 9, 11]

retained_current_step_target:
  source: results/adex-isolated-fit-v3-890.yaml
  training_positions: [0, 2, 4, 6]
  sealed_holdout_positions: [1, 3, 5]

candidate_generation:
  method: scipy-qmc-sobol-unscrambled
  candidates: 256
  append_literature_candidate: true
  append_frozen_current_step_candidate: true
  bounds:
    threshold_offset_mV: [0.0, 30.0]
    slope_factor_mV: [0.25, 5.0]
    reset_offset_mV: [-20.0, 5.0]
    subthreshold_adaptation_nS: [0.0, 20.0]
    spike_adaptation_pA: [0.0, 200.0]
    adaptation_time_constant_ms: [20.0, 400.0]
    effective_leak_offset_mV: [-30.0, 10.0]
  fixed:
    peak_mV: 20.0
    refractory_ms: 2.0

selection:
  training_objective: equal sum of current-step loss and external-transfer loss
  shared_external_observables:
    - resting voltage
    - spike count and firing rate
    - first-spike latency
    - mean voltage during input
  include_model_specific_peak: false
  holdout_not_used_for_selection: true
  deterministic_tie_break: ascending-parameter-tuple
  promotion:
    - selected current-step and external-transfer traces are finite
    - selected combined training loss is lower than the frozen current-step candidate
    - selected combined sealed-holdout loss is lower than the frozen current-step candidate

intervention_contract:
  fitted_adex_standard_parameter: effective resting-potential offset
  held_fixed:
    - SMART leak conductance and capacitance
    - morphology and axial coupling
    - T-type calcium
    - every input port, network edge, weight, delay, stimulus, and analysis gate
  interpretation: >-
    This is an extended AdEx calibration arm, distinct from the stricter
    parameter-invariant and current-step-only arms.

network_policy:
  candidate_parameters_frozen_before_any_new_network_execution: true
  a_promoted_candidate_may_enter_a_new_figure6_arm: true
  downstream_only_after_valid_figure6_learned_state: true
  network_level_parameter_rescue: prohibited
