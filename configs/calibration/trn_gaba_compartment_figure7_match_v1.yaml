schema_version: 1
name: trn-gaba-compartment-figure7-match-v1
status: registered-before-execution
base_profile: configs/calibration/figure6_kinness_equation27_transition_v1.yaml
figure6_artifact: docs/validation-results/figure6-trn-gaba-compartment-intermediate-grid-206.yaml
rationale: >-
  Artifact 206 identifies distal_0_015 as the sole registered compartment-
  specific transfer profile that preserves every Figure 6 gate. Test match in
  the same network that performs that training episode, without changing any
  detector, transfer, current, or timing parameter after viewing Figure 7.
detector: {arm_mV: -20.0, release_mV: -30.0}
trn_to_relay_gaba:
  figure6_survivor_label: distal_0_015
  scales:
    modeldb112923.projection.000: 0.01
    modeldb112923.projection.001: 0.01
    modeldb112923.projection.004: 0.015
protocol:
  condition: match
  pretrain_with_figure6_episode: true
  top_down_current_pA: 600.0
  top_down_cue_lead_ms: 0.0
  equilibration_ms: 0.0
  duration_ms: 100.0
  dt_ms: 0.01
  record_relay_diagnostics: true
match_gate:
  relay_active_indices: [38, 39, 40, 41, 42]
  minimum_relay_events_per_active_index: 1
  trn_events: '>0'
  sampled_trn_events_have_fresh_cycles: true
  finite: true
next_gate: >-
  Run a fresh same-network mismatch only if match remains confined to the five
  horizontal relay cells and every sampled TRN event is supported by a fresh
  detector arm/release cycle. Score the unchanged pair against the published
  directional contract without interpolation or parameter refinement.
locked_holdouts:
  - figure7_mismatch
  - figure10_reset
  - figure14_spectra
  - figure15_local_synchrony
  - figure16_long_range_synchrony
