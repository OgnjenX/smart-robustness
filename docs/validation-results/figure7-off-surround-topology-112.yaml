interpretation:
  - Under the only executable ring candidate recoverable without inventing a radius, the horizontal category cell sends no off-surround excitation to the overlap relay/TRN location 40 and maximal excitation to nearby nonoverlap TRN cells.
  - The measured AMPA/NMDA gates and receptor currents preserve this topology exactly. The missing mismatch suppression is therefore not caused by absent projection 009/012 connectivity, an accidentally included center, or failed ligand delivery.
  - Exact legacy ring geometry remains unverified because neither the manual nor recovered source indexes expose its stencil. This uncertainty cannot explain complete TRN event silence: earlier isolated tests apply the largest measured layer-6II gates continuously through 128 times strength without finding a quiescent, selectively recruitable official-source TRN profile.
  - No ring radius, weight, or conductance is fitted or promoted.
