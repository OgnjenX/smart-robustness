claim_boundaries:
  - This is a retrospective metadata preflight and pinned-source audit, not a new experimental registration.
  - No wider-cohort numerical database values or waveforms were queried.
  - VC QC cannot silently substitute for IC PSP quality, or missing aggregate kinetics be declared harmless.
  - Shared source fitting dependencies do not invalidate the original experiment-level split, but preclude an independent-source or unseen-historical-fit claim.
  - The previously tested lineage helper retains raw QC flags; it does not verify historical response duration or complete original waveform selection.
  - Pinned source code establishes implementation intent, not the actual historical release-generation environment.
  - Current-injection VIP fitting and source synaptic-recruitment qualification remain separate prerequisites.
next_gate: >-
  Use nonsynaptic metadata to define any distinct candidate cohort, preserve
  exact species, area, measured layer and project boundaries, and fix upstream
  QC dependencies and response-state completeness before new numerical reads.
  Keep the original failed cohort and sample minimums intact. A new source
  inventory may assess availability but cannot authorize model fitting until
  adequate independent units, waveform semantics, baselines and physiological
  acceptance are independently established. Continue external primary-source
  assessment rather than promote a broader cohort solely to meet a count.
