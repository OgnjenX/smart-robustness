interpretation:
  - The failure is no longer attributable to absent or isotropic learned layer-6II-to-relay AMPA delivery.
  - Match and mismatch distal relay voltages differ, but the soma event output remains at four spikes for every bottom-up-driven relay.
  - The next discriminator is distal-to-soma coupling and spike-threshold efficacy, not downstream TRN-to-nonspecific tuning.
  - A 10 ms active-expectation lead proves that cue timing can alter which relay cells fire, but relay/TRN totals still fail to distinguish match from mismatch.
  - A 30 ms lead allows the initial TRN burst to finish but exposes widespread relay startup spikes; both zero and steady-state gate initialization candidates are non-quiescent at the serialized resting voltages.
  - The exact KInNeSS ring-kernel stencil remains unresolved and is not changed by this assay.
  - The contemporaneous KInNeSS manuscript's -20 mV event threshold conflicts with SMART Methods +30 mV and is behaviorally incompatible with the printed preceding-sample-below-zero rule.
