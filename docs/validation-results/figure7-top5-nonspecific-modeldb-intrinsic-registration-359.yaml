rationale:
  - >-
    The remaining Figure 7 deficit is localized to the nonspecific cell's
    compartmental rebound. Paper-only T-current kinetics overdrive match while
    archived axial coupling abolishes somatic output, leaving the intrinsic
    cell catalog as an untested discrete official-source choice.
  - >-
    Grossberg and Versace Table 3 gives the nonspecific soma 100 mS/cm2 sodium
    and 100 mS/cm2 potassium. The recovered SMART executable gives the same
    geometry, leak, and dendritic 250-mS/cm2 T current, but 50 mS/cm2 sodium
    and 30 mS/cm2 potassium in the soma.
  - >-
    Select the complete archived nonspecific intrinsic cell as one unit. Do not
    fit either conductance separately. Keep paper-literal nonspecific axial
    coupling, executable calcium kinetics, every synapse, and all upstream
    population source choices fixed.
