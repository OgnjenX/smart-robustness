decision: >-
  Admit exactly one default-off joint Figure-6/7/10 cross that changes only the
  integration method from coupled Brian2 RK4 to sanndra_scalar_rk4. Retain the
  source projection-025 scale and every predeclared gate. If Figure 6 fails,
  stop without Figure 7 or 10. If it passes, execute the registered joint cross
  once and assess all gates conjunctively. Do not interpolate between methods.
