  justification: >-
    The original Patch-seq paper uses the Tasic 2018 taxonomy and a VISp neuronal
    subset. The official CCN provenance row identifies its mouse VISp+ALM source
    as Tasic 2018. Therefore this reference restriction is specified from source
    provenance, not from neuronal or network outcome performance.
