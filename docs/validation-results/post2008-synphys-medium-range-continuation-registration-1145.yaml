  - Reject short bodies, changed object identity, compressed bodies, duplicate identity headers and nonzero client exits.
  - Append only fully validated ranges, retaining unsuccessful bytes separately and stopping on first failure.
  - Enforce the total monotonic time budget, including copying, and do not exceed fifteen requests.
  - Record each accepted range and its prefix boundary; failure retains all evidence without automatic restart.
