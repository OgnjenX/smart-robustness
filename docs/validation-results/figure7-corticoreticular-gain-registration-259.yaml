  approximately 12--18. Scalar TRN-to-relay gain, annular geometry, cue-event
  count, and source-delay alignment have all failed their registered gates.
  Test whether restoring top-down control over TRN is mechanistically possible
  by scaling only the two corticoreticular projections in fresh match networks.
