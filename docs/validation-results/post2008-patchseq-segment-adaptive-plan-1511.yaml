      - Pin integer rational construction and explicit rounding; distinguish solver coefficients from unchanged neuron coefficient lifts.
      - Reject implicit double conversions in arithmetic time controller or error-norm calculations.
      - Test arithmetic and precision against an independent mpmath oracle without biological data or neuron benchmarking.
