interpretation:
  - Moving only the represented layer-4 inhibitory projection from the proximal dendrite to the soma changes the calibrated SMART Figure-7 trajectory enough to cross three preregistered gates.
  - The directional match-versus-mismatch organization remains visible: match recruits the registered five relay cells, mismatch remains centered on relay cell 40, and match exceeds mismatch in relay count, TRN events and integrated TRN-to-nonspecific GABA.
  - Nevertheless, preservation of qualitative ordering is insufficient for the registered classic-behavior baseline because the absolute relay and nonspecific event gates fail exactly in both repetitions.
  - The result localizes a deterministic sensitivity to the target location of projection 036 under fixed conductance density and exactly conserved total receptor conductance.
  - This routing-only abstraction does not include PV intrinsic dynamics, PV prevalence, cell-type-specific connectivity, modern thalamic recruitment or compensatory development. It therefore does not establish that biological PV circuitry is incompatible with ART or SMART.
  - Figure 10 is missing by design rather than failed: the sealed protocol forbids running it after a same-repetition Figure-7 failure.
  - No parameter was selected or adjusted from these outcomes, and the immutable classic baseline remains unchanged.

prohibited_actions:
  - Do not retune projection 036 or run a result-guided rescue under this registration.
  - Do not reinterpret preserved directional ordering as a registered behavioral pass.
  - Do not generalize this one-route target-location failure to PV cells as a biological class.
  - Do not combine this failed route with SST-like, VIP-like or other post-2008 modules before their isolated experiments are complete.
  - Do not modify the frozen classic baseline or commit the ignored raw result.

