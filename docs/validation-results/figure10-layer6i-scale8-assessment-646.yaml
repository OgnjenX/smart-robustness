interpretation: >-
  Two executions of the registered endpoint agree on every visible population
  count and reset gate; the second used only a bounded serialization filter
  after simulation because the first complete output exceeded terminal
  retention. Scale 8 repairs the previously missing broad wave: all 81 layer-5
  and all 81 layer-6I cells participate in the intact mismatch, versus 11 in
  each control population. Layer-6I emits 153 versus 76 events and projection
  026 delivers 2.12 times the integrated and 8.59 times the peak excitation to
  layer-4 inhibitory cells. Nevertheless those inhibitory cells emit fewer
  events intact (218 versus 232), and projection-036 inhibitory-current
  magnitude onto layer-4 excitatory cells is 10.2% lower. The intact winner
  increases to 78 versus 76 control events and releases zero alternatives
  versus two. Projection-025 amplitude was therefore sufficient to restore
  broad layer-6I recruitment but not the required downstream reset sign. Scale
  8 closes as a diagnostic endpoint; it is not selected or source-recovered.
next_gate: >-
  Audit the layer-6I-to-layer-4 on-center/off-surround path under the unchanged
  scale-8 endpoint before changing another parameter. Add default-off,
  time-resolved readouts for projection 026 excitation of layer-4 inhibitory
  cells, projection 036 inhibition of layer-4 excitatory cells, and the omitted
  projection 038 direct layer-6I-to-layer-4-excitatory AMPA path. Resolve event
  and current timing around the 208.36-ms broad layer-6I wave and compare intact
