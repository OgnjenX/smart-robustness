join_contract:
  - Read only the independently verified CSV member and exact previously verified header.
  - Project only whitelisted fields; discard irrelevant and sensitive source columns without interpretation.
  - Preserve raw strings, source row numbers, empty and malformed IDs without repairing or normalizing them.
  - Join only canonical positive ASCII decimal ephys-session IDs to the exact matching session token in the catalog path.
  - Require repeated path subject tokens to agree and preserve unknown path shapes as unresolved.
  - Retain all annotation candidates for each asset; never choose the first or most complete record.
  - Require unique source row, canonical specimen and donor IDs, unique specimen and session references, and matching donor/path-subject tokens for a structural consistency flag.
  - A structurally consistent path/annotation join is not confirmed internal NWB identity or biological eligibility.
  - Report unmatched source rows, unmapped assets, duplicates and donor conflicts without outcome-based exclusion.
  - Report raw canonical specimen-ID equality with all prior and previously included cells; do not infer overlap or independence solely from subject IDs.
  - Genetic aliases and structure values remain raw annotations, with no derived molecular class or measured-layer assignment.
  - Preserve the June revision and unresolved agreement with final July annotations.
next_gate: >-
  Independently reconstruct all projected rows, joins, missingness, conflicts,
  counts and overlap references. Then establish source meanings and internal
  recording identity before separately registering a qualified cohort. No
  genotype, transcriptomic enrichment or depth proxy may substitute for
