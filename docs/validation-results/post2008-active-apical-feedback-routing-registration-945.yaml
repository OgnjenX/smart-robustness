hypothesis: >-
  Retinotopically offset redistribution of the existing distal V2-to-V1 L5
  feedback path will preserve the calibrated Figure-16 lower-frequency
  inter-area coordination phenotype over at least one nonzero route fraction
  when each source cell's total available feedback weight is conserved.

independent_variable:
  name: offset-route-fraction
  values: [0.0, 0.25, 0.5, 0.75, 1.0]
  arm_order:
    - offset_0
    - offset_0p25
    - offset_0p5
    - offset_0p75
    - offset_1
  selection: fixed-uniform-sensitivity-grid-not-fitted

structural_contract:
  changed_projection: modeldb112923.projection.016
  unchanged_fields:
    - source and target population
    - distal target compartment
    - AMPA-like channel and reversal potential
    - rise and fall kinetics
    - delay
    - projection weight and plasticity rule
  changed_field: topology-factor-matrix-only
  matched_input_rule: every-source-row-sum-equals-offset-0-control
  offset_kernel: parameter-free-radial-annulus-using-serialized-sigma-and-wrap

first_order_boundary:
  statement: >-
    Figure 6, 7, 10, 14, and 15 networks have no V2 source population, so the
    intervention is structurally absent from those protocols.
  prerequisite: fresh-six-gate-Figure6-pass-before-every-run
  interpretation: unchanged-sentinel-not-an-intervention-outcome

figure16_protocol:
  network: complete-recovered-v1-pulvinar-v2-catalog
  stimulus: horizontal-five-cell-bar-to-v1
  prestimulus_ms: 1000.0
  recording_ms: 1000.0
  integration_dt_ms: 0.01
  recording_sample_ms: 1.0
  inter_area_delay_ms: 10.0
  frequency_bands_hz:
    - [2.0, 4.0]
    - [4.0, 8.0]
    - [8.0, 12.0]
    - [12.0, 20.0]
    - [20.0, 100.0]
  higher_area_signal: mean-v2-inferior-300um-electrode-tips
  lower_area_signal: mean-v1-superior-300um-electrode-tips
  geometry_seed_v1: 16
  geometry_seed_v2: 17
  exact_repetitions_per_arm: 2

gates:
  structural:
    source_row_sums_equal_control: required
    center_factor_monotonic_nonincrease: required
    nearest_surround_factor_monotonic_nondecrease: required
    only_projection016_overridden: required
  figure16:
    exactly_1000_recording_samples: required
    v1_and_v2_fields_finite: required
    lower_frequency_stronger_than_gamma: required
    strongest_band_2_4_hz: required
  exact_repeat: required-per-arm

stopping_rules:
  - run and verify two contemporaneous offset-0 repetitions first
  - stop the study if the offset-0 control fails any Figure-16 gate or exact repeat
  - after control passage, run every nonzero fraction regardless of preceding results
  - checkpoint after every repetition and never run two copies concurrently
  - do not alter the grid, topology, metrics, or gates after opening outcomes
  - do not run the NMDA sensitivity arm until this result is hash-pinned and assessed

