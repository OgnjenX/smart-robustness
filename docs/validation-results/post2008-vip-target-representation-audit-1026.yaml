  route: same-index-delayed-collapsed-inhibitory-feedback
  explicit_sst_membrane_or_population: false
  explicit_vip_population: false
  sst_recruitment_transfer_function: absent
  consequence: >-
    There is no represented SST membrane, recruitment state or spike generator
    for a VIP inhibitory current to target. Scaling the distal GABA port would
    alter effective inhibition directly, not implement an interneuron-to-
    interneuron circuit or establish biological cell-class specificity.

decision:
  direct_vip_network_execution_authorized: false
  reinterpret_collapsed_route_as_explicit_sst_authorized: false
  source_audit_and_network_blind_recruitment_design_authorized: true
  required_next_preregistration:
    - Specify an explicit functional SST recruitment representation and its independent parameter source or bounded sensitivity region.
    - Specify VIP recruitment separately from SST output strength and SMART behavioral outcomes.
    - Establish fixed-event isolated recruitment, inhibitory sign, timing, convergence and disinhibition controls before network promotion.
    - Include the existing collapsed route as an unchanged reference and an SST-only explicit-representation control.
    - Register matched-input and nominal-resource controls; report realized conductance, current and spike drive rather than assuming equality.
    - Keep biological intrinsic-class claims separate from functional routing abstractions.
    - Seal all gates and runners before any new network outcome, retaining every tested point and failure.
  prohibited:
    - Choosing only the two observed SST survivors as representation-calibration targets.
    - Fitting SST or VIP recruitment to network resonance or reset outcomes.
    - Changing the frozen classic baseline or reclassifying previous failures.
    - Calling a direct reduction of distal inhibition a validated biological VIP-to-SST circuit.

