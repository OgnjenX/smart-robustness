      - No silent mixed precision, interpolation, fast-math, solver swap or lower-precision time interval.
      - Initially retain the full existing precision/refinement comparison matrix; any changed scope must be explicit and prospective.
    synthetic_verification:
      - An independently implemented high-precision forward oracle, not just the primary kernel measured by a second feature extractor.
      - Actual precision probes, singularity limits, passive analytic solutions, active large excursions and threshold-sensitive observables.
      - Full-length synthetic current commands spanning observed metadata lengths, warmup and release; fixed before execution.
      - No biological loss or network outcome used to choose a backend, step policy, search bounds or favorable failure handling.
    failure_policy: a-disagreement-blocks-the-hypothesis-no-tolerance-relaxation-or-automatic-replacement-another-hypothesis-needs-a-new-seal
