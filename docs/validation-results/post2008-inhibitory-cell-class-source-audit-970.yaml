scientific_question: >-
  Does the frozen classic SMART match-resonance and mismatch/reset behavior
  survive when its aggregate cortical inhibitory populations are replaced in
  controlled stages by source-supported PV-like, SST-like and VIP-like routing
  motifs while total drive is explicitly accounted for?

primary_evidence:
  - citation: >-
      Ji X, Zingg B, Mesik L, Xiao Z, Zhang LI, Tao HW (2016).
      Thalamocortical Innervation Pattern in Mouse Auditory and Visual Cortex:
      Laminar and Cell-Type Specificity. Cerebral Cortex 26:2612-2625.
    doi: 10.1093/cercor/bhv099
    pmid: 25979090
    pmcid: PMC4869808
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4869808/
    preparation: mouse-primary-visual-cortex-slices-with-dLGN-ChR2-expression
    supported:
      - PV cells received direct dLGN input across L2/3 through L6, strongest in L4.
      - V1 response incidence was 11/14 L2/3, 13/13 L4, 15/15 L5 and 8/8 L6 PV cells.
      - V1 L5 adjusted response amplitude was 426 +/- 130 for PV cells and 195 +/- 58 for pyramidal cells in the reported table.
      - SOM and VIP cells were essentially not directly innervated outside L4; L4 incidence was 5/14 SOM and 6/16 VIP and responses were weak.
      - Onset latencies were similar across tested V1 cell groups.
    translation_limits:
      - Optogenetic response amplitudes are not SMART conductance densities or projection weights.
      - Cell response incidence is not a population-size ratio.
      - The measurements do not specify the PV-to-pyramidal synaptic strength, target compartment or spatial kernel.
      - The preparation does not justify collapsing all PV, SST or VIP subtypes into one intrinsic neuron model.

  - citation: >-
      Pfeffer CK, Xue M, He M, Huang ZJ, Scanziani M (2013).
      Inhibition of inhibition in visual cortex: the logic of connections
      between molecularly distinct interneurons. Nature Neuroscience 16:1068-1076.
    doi: 10.1038/nn.3446
    url: https://www.gatsby.ucl.ac.uk/tea/tea_archive/attached_files/Pfeffer2013jz.pdf
    preparation: mouse-primary-visual-cortex-layers-2-3-and-5
    supported:
      - PV, SST and VIP are large, substantially non-overlapping interneuron classes.
      - PV cells inhibit pyramidal cells and preferentially inhibit other PV cells among the tested interneuron classes.
      - SST cells inhibit pyramidal cells and the other major interneuron classes but weakly inhibit one another.
      - VIP cells preferentially inhibit SST cells, defining a disinhibitory motif.
    translation_limits:
      - Class prevalence does not determine synaptic weight or SMART grid population count.
      - The study does not provide one universal connection matrix for every cortical layer and visual state.
      - Molecular class is broader than a single morphological, transcriptomic or electrophysiological type.

  - citation: >-
      Scala F, et al. (2019). Layer 4 of mouse neocortex differs in cell types
      and circuit organization between sensory areas. Nature Communications 10:4174.
    doi: 10.1038/s41467-019-12058-z
    url: https://www.nature.com/articles/s41467-019-12058-z
    preparation: adult-mouse-V1-and-S1-layer-4-multicell-recordings-and-morphology
    supported:
      - Adult mouse V1 L4 contained one major excitatory and seven inhibitory morphological types.
      - V1 L4 SOM cells were Martinotti cells, unlike the non-Martinotti SOM organization emphasized for S1.
      - PV and SOM classes follow different local and thalamic connectivity motifs.
    translation_limits:
      - Somatosensory findings must not be substituted for visual-cortex parameters.
      - A three-class PV/SST/VIP model remains a coarse functional abstraction, not a complete V1 L4 census.

  - citation: >-
      Schneider-Mizell CM, et al. (2023). Cell-type-specific inhibitory
      circuitry from a connectomic census of mouse visual cortex. Cell 186:1-18.
    doi: 10.1016/j.cell.2023.01.004
    pmcid: PMC9900837
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9900837/
    preparation: mouse-primary-visual-cortex-MICrONS-electron-microscopy-volume
    supported:
      - Inhibitory neurons separated into output-defined subclasses based on excitatory dendritic targets and inhibitory targets.
      - The census identified more than one disinhibitory specialization, including a basket-cell-targeting class distinct from the expected SST-targeting class.
    translation_limits:
      - PV/SST/VIP labels alone do not capture all target-specific inhibitory structure.
      - Anatomical synapse counts do not directly specify physiological efficacy or kinetics.

  - citation: >-
      Liu X, et al. (2024). Organization of corticocortical and
      thalamocortical top-down inputs in the primary visual cortex.
      Nature Communications 15:4496.
    doi: 10.1038/s41467-024-48924-8
    url: https://www.nature.com/articles/s41467-024-48924-8
    preparation: mouse-V1-layer-and-cell-type-specific-long-range-input-mapping
    supported:
      - LP input strongly recruited VIP cells across L2-L6 and PV cells in L5.
      - PV and SST activation produced large IPSCs in sampled L5 pyramidal subtypes, while direct VIP-to-pyramidal IPSCs were weak.
      - Higher-order inputs engaged layer- and cell-type-specific inhibitory routes.
    translation_limits:
      - This evidence belongs to a later interaction study with the unresolved pulvinar module, not the first inhibitory-only test.
      - Input strength does not specify a SMART-compatible weight, delay or cell count.

