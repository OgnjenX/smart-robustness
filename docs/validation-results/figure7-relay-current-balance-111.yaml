interpretation:
  - The caption says expectation-only cells should remain inhibited and a mismatch should leave only the single bottom-up/top-down overlap cell firing. The expectation-only cells are indeed subthreshold, but all five directly driven cells continue to fire in both conditions.
  - Directly driven image cells receive approximately 0.65 nA from the external input and generate full somatic action potentials. In mismatch, the four nonoverlap cells are therefore not suppressed by the top-down-driven inhibitory off-surround as required.
  - Eliminating the available learned-amplitude uncertainty does not restore that operation. Scaling the horizontal reference field by its complete 1.2-fold headroom, until both center weights reach 1.5, preserves five active cells in each condition; match has 20 relay events and mismatch 18.
  - TRN remains at its 81-event startup volley and nonspecific output remains 60 Hz in both conditions. Missing Figure 6 learning amplitude within the declared shape and official bounds is therefore excluded as the primary Figure 7 discrepancy.
  - No weight, inhibition, or spike threshold is tuned. Exact relay-clamp and source-profile alternatives are retained in earlier artifacts and also fail condition-dependent recruitment.
