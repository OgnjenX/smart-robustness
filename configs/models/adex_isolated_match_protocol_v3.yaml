schema_version: 1
name: adex-isolated-cell-match-protocol-v3
status: preregistered-adaptive-assay-before-fitting-and-network-outcomes
predecessor: configs/models/adex_isolated_match_protocol_v2.yaml
cell_classes: all-12-source-smart-classes

classic_target_scan:
  pre_ms: 50.0
  step_ms: 200.0
  post_ms: 50.0
  dt_ms: 0.02
  voltage_recording_dt_ms: 0.1
  passive_voltage_offset_range_mV: [-100.0, 200.0]
  passive_voltage_offset_increment_mV: 5.0
  amplitude_rule: soma_g_leak_nS_times_voltage_offset_mV_equals_pA
  vectorized_current_levels: 61

sealed_level_selection:
  levels_per_cell_class: 7
  rule: >-
    Select nearest current indices to seven evenly spaced classic firing rates
    from the isolated scan. If fewer than seven unique rates exist, use seven
    evenly spaced current indices. Remove duplicate indices and fill with the
    unused index maximally distant from selected indices; ties choose the lower
    index. Sort all selected indices by current.
  training_positions: [0, 2, 4, 6]
  sealed_holdout_positions: [1, 3, 5]
  adex_outputs_used_to_select_levels: false

training_targets:
  - resting voltage
  - spike count and firing rate
  - first-spike latency
  - first-to-last interspike-interval adaptation ratio

candidate_generation:
  method: scipy-qmc-sobol-unscrambled
  candidates_per_cell_class: 32
  include_literature_candidate: true
  bounds:
    threshold_offset_mV: [10.0, 30.0]
    slope_factor_mV: [0.5, 5.0]
    reset_offset_mV: [-15.0, 5.0]
    subthreshold_adaptation_nS: [0.0, 10.0]
    spike_adaptation_pA: [0.0, 150.0]
    adaptation_time_constant_ms: [40.0, 400.0]
  fixed:
    peak_mV: 20.0
    refractory_ms: 2.0
  vectorize_candidates_and_levels_per_cell_class: true

selection:
  primary: minimum training loss
  deterministic_tie_break: ascending-parameter-tuple
  holdout_not_used_for_selection: true
  promotion:
    - selected candidate trace is finite
    - training loss is no worse than literature arm
    - sealed holdout loss is no worse than literature arm
    - separately registered thalamic rebound and layer-5 AHP/ACh gates pass

parameters_held_from_smart:
  - capacitance, leak, and morphology
  - axial coupling
  - T-type calcium
  - AHP/ACh

forbidden_fit_inputs:
  - all full-network results
  - Figure 6 learning outcomes
  - Figure 7 match or mismatch outcomes
  - Figure 10 reset outcomes
  - Figure 14, 15, or 16 spectral and synchrony outcomes
