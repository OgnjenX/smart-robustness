schema_version: 1
name: figure7_declared_input_top_down_current_recheck_v1
classification: source-bounded-protocol-recheck-after-source-semantic-change
base_profile: configs/calibration/figure6_declared_interneuron_input_v1.yaml
dimension:
  name: top_down_current_pA
  source_status: not_identifiable
  previously_registered_bounds_pA: [600.0, 1000.0]
  fixed_control_pA: 800.0
  endpoints_to_recheck_pA: [600.0, 1000.0]
protocol:
  duration_ms: 25.0
  dt_ms: 0.01
  top_down_current_mode: until_cued_cell_first_event
  top_down_cue_lead_ms: 0.0
  uniform_relay_input_gain: 1.0
  projection_002_gain: 1.0
  learned_feedback_delay_ms: 2.0
selection:
  order: registered_endpoint_order
  required_gates:
    - match_horizontal_relay_set
    - mismatch_overlap_only
    - match_more_active_relay_cells
    - match_more_trn_events
    - learned_feedback_arrives_before_first_relay_event
boundaries:
  - The 800-pA corrected-input control is imported from Artifact 443 and is not rerun.
  - Only the two previously registered endpoints are reopened; no interpolation or expansion is allowed.
  - Reopening is authorized solely because the declared Relay_INT input changes an upstream source interpretation.
  - The screen uses actual fresh Figure 6 weights, simultaneous command onset, and source projection delays.
  - No comparator, learned headroom, input scaling, projection scaling, calcium ablation, equilibration, or cue lead is permitted.
  - A short-run survivor authorizes an independently rebuilt 100-ms pair but is not itself Figure 7 reproduction.
