scientific_conclusion: >-
  The exact 68-case synthetic matrix supports the MPFR backend's equivalence
  to the independently coded sealed Boost implementation at the tested input,
  parameter and binary64-initialization conventions, with about sevenfold
  matched integration throughput improvement. Every matched exported state
  agrees numerically, all exact repeats pass, and independent saved-array
  feature and loss reconstructions agree. This does not establish a numerical
  reference for every synthetic input because the longest active trace fails
  the unchanged finest-step refinement gate in both implementations. The
  improved arithmetic speed also does not make the complete fixed-support
  biological screen operationally feasible under demonstrated local resources.
  The synthetic high-drive event counts are numerical test observables, not
  evidence of physiological fit, biological validity or SMART/ART behavior.
limitations:
  - Saved-array reconstruction and the passive analytic solution are not a third independent full active forward simulation.
  - Cross-backend equivalence is distinct from integration-step admissibility and from biological model adequacy.
  - These four synthetic input profiles do not cover all768candidate-stratum identities or33280biological candidate-sweep cases.
