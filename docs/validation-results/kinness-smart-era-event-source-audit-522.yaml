  documented_semantics:
    - Chemical synapses receive binary spike timing converted from somatic potential in the axon.
    - Axons are required for cells that provide chemical-synapse input.
    - Spike-file times denote action-potential initiation at the axon hillock.
    - Connection-specific propagation delay is applied at the receiving end.
