interpretation:
  - Match and mismatch select horizontal versus vertical relay locations, but both recruit five cells and 18 relay events.
  - Every TRN cell emits once at 1.34 ms, before the first category event and long before the first stimulus-driven relay event at 49.15 ms; there are no later TRN events.
  - The nonzero post-5-ms GABA gate is the decaying residue of the population-wide startup volley, not condition-dependent relay-driven TRN output.
  - Consequently all three TRN-to-nonspecific GABA channels, both layer-6II-to-nonspecific excitatory channels, direct image input, nonspecific voltages, and nonspecific spikes are numerically identical across conditions.
  - This directly excludes the nonspecific-cell current balance as the earliest Figure 7 discrepancy. The missing causal operation remains upstream: matched relay recruitment must create more post-startup TRN output than mismatch.
  - No parameter correction is promoted because the published paper and recovered executable records do not identify an alternative resting-state initialization or somatodendritic transfer rule that resolves this failure.
