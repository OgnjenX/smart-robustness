conclusion: >-
  The preregistered latency gate was an added causal proxy, not a directly
  reported official metric. Correcting that classification does not rescue any
  projection-025 scale: scales 1 through 4 fail winner suppression, and scale
  8 suppresses the old winner but neither recruits more alternative cells nor
  increases their aggregate output relative to control. Aggregate counts do
  not establish whether one alternative becomes the displayed replacement
  winner, so one target-resolved diagnostic is warranted at scale 8.
next_gate: >-
  Rerun only the scale-8 intact/control pair with unchanged dynamics and retain
  per-cell layer-4 counts and first/last event times before release, after
  release, and during the late reset interval. This is instrumentation-only
  diagnosis, not selection or calibration. Do not interpolate projection 025
  or open holdouts.
