  conclusion: >-
    With the frozen independently current-step-matched parameter maps, changing
    either excitatory or inhibitory cortical somatic spike generators is
    sufficient to break the complete Figure 6 learning prerequisite. The
    pattern is distributed rather than uniquely thalamic: multiple sub-gates
    survive, but no alternative arm preserves their conjunction.
  prohibited_conclusion: >-
    These results do not show that ART dynamics are stable only with
    Hodgkin-Huxley neurons, nor that AdEx or GIF families are intrinsically
    incapable of ART. They reject only the registered parameterizations under
    the morphology-preserving somatic-substitution contract.
  thalamic_interpretation: >-
