  conclusion: >-
    The longer fixed-candidate observation reveals a delayed cooperative match
    response: the outer cells fire at 11.91 ms, then the inner and center cells
    fire near 40 ms. This does not rescue Figure 7. The mismatch overlap cell
    never fires, and TRN output remains in the wrong direction (377 match
    versus 443 mismatch). Through every registered sample up to 15 ms, center
    cell 40 has exactly identical currents and voltages in match and mismatch;
    condition separation can therefore arise only after activity outside the
    overlap changes the recurrent network. In the early overlap balance, the
    local relay-interneuron GABA current reverses the positive direct plus
    top-down minus TRN balance. Small outer-to-center differences are then
    nonlinearly amplified by somatic sodium current, explaining the first
    outer-cell escape without identifying a fitted correction.
  next_step: >-
    Audit the archived mixed Relay_INT input record against the KInNeSS input
