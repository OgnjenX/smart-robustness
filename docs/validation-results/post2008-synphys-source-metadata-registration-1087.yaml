artifact_type: outcome-blind-external-synaptic-physiology-source-metadata-registration
date: 2026-10-09
scientific_question: >-
  Does the independent Allen Synaptic Physiology source provide documented
  mouse visual-cortex class/layer/protocol metadata and accessible resources
  from which biological recruitment or synaptic targets could later be sealed?
  Availability is not cell-model validation and is not a VIP replacement.
primary_reference:
  title: Local connectivity and synaptic dynamics in mouse and human neocortex
  doi: 10.1126/science.abj5861
  publication_year: 2022
source_rationale: >-
  Official documentation describes paired patch recordings and publicly
  available connectivity, strength, kinetics and short-term plasticity data.
  These can motivate a separate source audit, not conductance-response fidelity
  or a quantitative SMART fitting target before protocol and provenance checks.
