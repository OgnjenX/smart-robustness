name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Provenance tests verify that preregistered file hashes remain
          # recoverable from Git history even after the files evolve.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Calibration and provenance contracts
        run: >-
          pytest -q
          tests/test_calibration_contract.py
          tests/test_joint_calibrated_reconstruction_contract.py
      - name: Unit and lightweight integration tests
        run: >-
          pytest -q
          --ignore=tests/test_calibration_contract.py
          --ignore=tests/test_joint_calibrated_reconstruction_contract.py
          --ignore=tests/test_classic_sector.py
          --ignore=tests/test_classic_synapses.py
          --ignore=tests/test_figure19_validation.py
      - name: Full first-order intrinsic sector
        run: pytest -q tests/test_classic_sector.py
      - name: Full first-order connected sector
        run: pytest -q tests/test_classic_synapses.py
      - name: AHP/ACh long-duration validation
        run: pytest -q tests/test_figure19_validation.py
