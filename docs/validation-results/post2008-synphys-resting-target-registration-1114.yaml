  pooled resting responses. No original experiment reassignment is allowed.
quality_and_counts: >-
  Descriptive coverage requires one rested fit with finite correctly signed
  amplitude, finite nonnegative latency, finite positive rise/decay times,
  finite nonnegative nrmse and one finite actual baseline in [-0.1,0.0] volts.
  Voltage bounds are a broad physical sanity check, not new fidelity gates.
  Report per project/route/pre-layer/post-layer and original partition distinct
  pair and experiment counts; original holding labels are retained only as
  lineage. Minimum independent units remain five fitting and three validation
  experiments. Missing baselines are not replaced by nominal holding values.
