conclusion: >-
  All 21 nonspecific events after the first upstream circuit event disappear
  when the three archived TRN GABA contacts are removed. Removing both direct
  layer-6II excitatory contacts changes no event count and leaves the late train
  intact. The 240-Hz match failure is therefore generated by a TRN-GABA-
  dependent process in the paper-coherent nonspecific cell, not by direct
  corticointralaminar excitation or by an omitted global scheduler delay. This
  is consistent with post-inhibitory rebound, but it does not yet prove that
  T-type calcium is necessary.
