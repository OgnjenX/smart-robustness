      - scripts/patchseq_rkf78_reference.py
      - tests/test_patchseq_gbs_hh.py
    work:
      - Primary route may reuse the immutable MPFR RHS through an adapter; preserve that reuse boundary explicitly.
      - Independently implement the comparison route using rational RKF78 and a separately coded raw-MPFR RHS at exact160-and320bits without calling the primary Workspace or derivative adapter.
      - Test the independent route against the short150decimal-digit-mpmath oracle and passive analytic solution.
      - Retain separate error-controller stepper and RHS provenance; saved-array feature reconstruction alone is not an independent forward route.
      - Disclose shared GMP/MPFR arithmetic as a common dependency; algorithm and RHS implementation independence is not independent arithmetic-library certification.
